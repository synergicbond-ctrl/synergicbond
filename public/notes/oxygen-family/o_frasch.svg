45 426" stroke="#4db8e8" stroke-width="1.4" fill="none"/><text x="20" y="18" font-size="8.5" font-weight="bold" fill="#4db8e8" text-anchor="start" font-family="'SF Mono','DejaVu Sans Mono',ui-monospace,Menlo,monospace" letter-spacing="0.24em">SYNERGIC BOND</text><path d="M 728 12 l 6 6 l -6 6 l -6 -6 z" fill="none" stroke="#63d39b" stroke-width="1.2"/><text x="20" y="40" font-size="16" font-weight="bold" fill="#f4ecd9" text-anchor="start" font-family="'Georgia','Times New Roman',serif">The Frasch process — mining native sulfur</text><line x1="20" y1="42" x2="740" y2="42" stroke="#232a36" stroke-width="1"/><g transform="translate(0,34)"><rect x="250" y="90" width="460" height="130" fill="#2a2118" stroke="#232a36" stroke-width="1.4"/><text x="480.0" y="82.0" font-size="8" font-weight="normal" fill="#5c6a7e" text-anchor="middle">overburden rock</text><rect x="250" y="220" width="460" height="90" fill="#d8bf8a" stroke="#232a36" stroke-width="1.4"/><text x="480.0" y="268.0" font-size="9" font-weight="normal" fill="#2a2118" text-anchor="middle">sulfur-bearing limestone</text><rect x="454.0" y="30" width="12" height="280" fill="rgba(120,190,235,0.10)" stroke="#6fb7dc" stroke-width="1.6"/><rect x="474.0" y="30" width="12" height="280" fill="rgba(120,190,235,0.10)" stroke="#6fb7dc" stroke-width="1.6"/><rect x="494.0" y="30" width="12" height="280" fill="rgba(120,190,235,0.10)" stroke="#6fb7dc" stroke-width="1.6"/><path d="M 460.0 240 L 460.0 300" stroke="#ff8f6e" stroke-width="3"/><path d="M 500.0 240 L 500.0 300" stroke="#4db8e8" stroke-width="3"/><ellipse cx="480.0" cy="305" rx="34" ry="8" fill="#f3b64b" fill-opacity="0.4"/><text x="40.0" y="300.0" font-size="8.2" font-weight="normal" fill="#ff8f6e" text-anchor="start">superheated water in</text><text x="40.0" y="314.0" font-size="7.6" font-weight="normal" fill="#93a1b5" text-anchor="start">≈438 K, ≈16 bar</text><text x="480.0" y="300.0" font-size="8.2" font-weight="normal" fill="#f3b64b" text-anchor="middle">molten S + froth out</text><text x="480.0" y="314.0" font-size="7.6" font-weight="normal" fill="#93a1b5" text-anchor="middle">(centre pipe)</text><text x="720.0" y="300.0" font-size="8.2" font-weight="normal" fill="#4db8e8" text-anchor="end">compressed air in</text><text x="720.0" y="314.0" font-size="7.6" font-weight="normal" fill="#93a1b5" text-anchor="end">≈2.5 MPa</text><line x1="40" y1="292" x2="460.0" y2="248" stroke="#ff8f6e" stroke-width="1"/><line x1="720" y1="292" x2="500.0" y2="248" stroke="#4db8e8" stroke-width="1"/><text x="480.0" y="358.0" font-size="8.4" font-weight="normal" fill="#93a1b5" text-anchor="middle">hot water (&gt;386 K m.p.) melts the sulfur in situ; compressed air froths the molten S up the centre pipe</text><text x="480.0" y="378.0" font-size="8.4" font-weight="normal" fill="#93a1b5" text-anchor="middle">yields ≈99.5% pure sulfur directly — no further refining needed</text></g></svg>