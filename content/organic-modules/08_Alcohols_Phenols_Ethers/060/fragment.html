<h3 id="s59">14. Acidity of phenols</h3>
<p>Phenol (pK<sub>a</sub> 10.0) is about <b>a million (10<sup>6</sup>) times more acidic than ethanol</b> (pK<sub>a</sub> 16) but about 10<sup>5</sup> times weaker than acetic acid (4.76) and weaker than carbonic acid (pK<sub>a1</sub> 6.35). The reasons come from the stabilities of the conjugate bases.</p>
