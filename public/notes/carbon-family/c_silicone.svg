ERGIC BOND</text><path d="M 608 12 l 6 6 l -6 6 l -6 -6 z" fill="none" stroke="#63d39b" stroke-width="1.2"/><text x="20" y="40" font-size="16" font-weight="bold" fill="#f4ecd9" text-anchor="start" font-family="'Georgia','Times New Roman',serif">Silicones  -  Rochow direct process</text><line x1="20" y1="42" x2="620" y2="42" stroke="#232a36" stroke-width="1"/><g transform="translate(0,34)"><rect x="60" y="90" width="150" height="60" rx="6" fill="#111a2b" stroke="#232a36" stroke-width="2"/><text x="135.0" y="80.0" font-size="9" font-weight="bold" fill="#dbe3ef" text-anchor="middle">direct process</text><text x="135.0" y="115.0" font-size="8.6" font-weight="normal" fill="#dbe3ef" text-anchor="middle">Si + 2 CH₃Cl</text><text x="135.0" y="132.0" font-size="8" font-weight="normal" fill="#8b98ac" text-anchor="middle">--(Cu, 570 K)→</text><text x="135.0" y="148.0" font-size="8.4" font-weight="normal" fill="#dbe3ef" text-anchor="middle">(CH₃)₂SiCl₂  (+ others)</text><line x1="215.0" y1="120.0" x2="250.0" y2="120.0" stroke="#4db8e8" stroke-width="2" stroke-linecap="round"/><line x1="250.0" y1="120.0" x2="240.9" y2="115.9" stroke="#4db8e8" stroke-width="2" stroke-linecap="round"/><line x1="250.0" y1="120.0" x2="240.9" y2="124.1" stroke="#4db8e8" stroke-width="2" stroke-linecap="round"/><text x="232.0" y="110.0" font-size="7.5" font-weight="normal" fill="#8b98ac" text-anchor="middle">distil</text><rect x="255" y="90" width="150" height="60" rx="6" fill="#211c14" stroke="#232a36" stroke-width="2"/><text x="330.0" y="115.0" font-size="8.6" font-weight="normal" fill="#dbe3ef" text-anchor="middle">hydrolysis</text><text x="330.0" y="132.0" font-size="8" font-weight="normal" fill="#dbe3ef" text-anchor="middle">(CH₃)₂SiCl₂ + 2 H₂O →</text><text x="330.0" y="148.0" font-size="8" font-weight="normal" fill="#dbe3ef" text-anchor="middle">(CH₃)₂Si(OH)₂ + 2 HCl</text><line x1="410.0" y1="120.0" x2="445.0" y2="120.0" stroke="#4db8e8" stroke-width="2" stroke-linecap="round"/><line x1="445.0" y1="120.0" x2="435.9" y2="115.9" stroke="#4db8e8" stroke-width="2" stroke-linecap="round"/><line x1="445.0" y1="120.0" x2="435.9" y2="124.1" stroke="#4db8e8" stroke-width="2" stroke-linecap="round"/><text x="427.0" y="110.0" font-size="7.5" font-weight="normal" fill="#8b98ac" text-anchor="middle">-H₂O</text><rect x="450" y="90" width="150" height="60" rx="6" fill="rgba(120,215,150,0.12)" stroke="#232a36" stroke-width="2"/><text x="525.0" y="118.0" font-size="8.6" font-weight="normal" fill="#dbe3ef" text-anchor="middle">condensation →</text><text x="525.0" y="135.0" font-size="8" font-weight="normal" fill="#dbe3ef" text-anchor="middle">[-(CH₃)₂Si-O-]n chain</text><text x="320.0" y="200.0" font-size="9.5" font-weight="bold" fill="#dbe3ef" text-anchor="middle">functionality controls the product:</text><text x="320.0" y="220.0" font-size="8.8" font-weight="normal" fill="#93a1b5" text-anchor="middle">R₃SiCl  =  chain STOPPER  →  oils / fluids</text><text x="320.0" y="236.0" font-size="8.8" font-weight="normal" fill="#93a1b5" text-anchor="middle">R₂SiCl₂  =  chain BUILDER  →  rubbers / gums</text><text x="320.0" y="252.0" font-size="8.8" font-weight="normal" fill="#93a1b5" text-anchor="middle">RSiCl₃  =  CROSS-LINKER  →  resins</text><text x="320.0" y="285.0" font-size="8.4" font-weight="normal" fill="#8b98ac" text-anchor="middle">strong flexible Si-O-Si backbone + outward CH₃  ⇒  water-repellent, heat-stable (-90 to +250 C)</text></g></svg>