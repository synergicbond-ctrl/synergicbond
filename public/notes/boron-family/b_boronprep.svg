"40" font-size="16" font-weight="bold" fill="#f4ecd9" text-anchor="start" font-family="'Georgia','Times New Roman',serif">Amorphous boron  —  magnesiothermic reduction</text><line x1="20" y1="42" x2="540" y2="42" stroke="#232a36" stroke-width="1"/><g transform="translate(0,34)"><path d="M 130.0 70 L 130.0 200.0 A 20.0 20.0 0 0 0 170.0 200.0 L 170.0 70" fill="rgba(120,190,235,0.08)" stroke="#4db8e8" stroke-width="2" stroke-linejoin="round"/><text x="150.0" y="120.0" font-size="10" font-weight="normal" fill="#dbe3ef" text-anchor="middle">B2O3 + Mg</text><text x="150.0" y="142.0" font-size="8.6" font-weight="normal" fill="#8b98ac" text-anchor="middle">(strongly ignited)</text><line x1="134.0" y1="262.0" x2="166.0" y2="262.0" stroke="#93a1b5" stroke-width="2.5" stroke-linecap="round"/><line x1="143.0" y1="244.0" x2="143.0" y2="262.0" stroke="#93a1b5" stroke-width="2" stroke-linecap="round"/><line x1="157.0" y1="244.0" x2="157.0" y2="262.0" stroke="#93a1b5" stroke-width="2" stroke-linecap="round"/><path d="M 142 244 Q 150 212 158 244 Z" fill="#f3b64b" fill-opacity="0.55" stroke="#f3b64b" stroke-width="1.2"/><path d="M 146 244 Q 150 228 154 244 Z" fill="#4db8e8" fill-opacity="0.7" stroke="none"/><line x1="205.0" y1="150.0" x2="285.0" y2="150.0" stroke="#4db8e8" stroke-width="2" stroke-linecap="round"/><line x1="285.0" y1="150.0" x2="275.9" y2="145.9" stroke="#4db8e8" stroke-width="2" stroke-linecap="round"/><line x1="285.0" y1="150.0" x2="275.9" y2="154.1" stroke="#4db8e8" stroke-width="2" stroke-linecap="round"/><text x="370.0" y="128.0" font-size="10" font-weight="normal" fill="#c9a58a" text-anchor="middle">brown amorphous B</text><text x="370.0" y="150.0" font-size="10" font-weight="normal" fill="#8b98ac" text-anchor="middle">+ MgO</text><text x="370.0" y="182.0" font-size="8.4" font-weight="normal" fill="#8b98ac" text-anchor="middle">wash with HCl (removes MgO / Mg3B2),</text><text x="370.0" y="198.0" font-size="8.4" font-weight="normal" fill="#8b98ac" text-anchor="middle">then HF (removes unreacted B2O3)</text><text x="280.0" y="258.0" font-size="12" font-weight="bold" fill="#dbe3ef" text-anchor="middle">B2O3  +  3 Mg   →   2 B  +  3 MgO</text><text x="280.0" y="280.0" font-size="9" font-weight="normal" fill="#8b98ac" text-anchor="middle">~95-98 % pure; well-crystallised boron needs a vapour-phase route</text></g></svg>