<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 560" width="1000" height="560"><rect x="0" y="0" width="1000" height="560" fill="#0a0c11"/><text x="500.0" y="22.0" text-anchor="middle" font-family='Inter,Arial,sans-serif' font-size="11.5" font-weight="800" fill="#7cc4ff" style="letter-spacing:1.6px;">MOLECULAR-ORBITAL VIEW</text><text x="500.0" y="70.0" text-anchor="middle" font-family='Inter,Arial,sans-serif' font-size="22" font-weight="800" fill="#ffffff" style="">Donor–acceptor interaction and three-centre bonding</text><line x1="120.0" y1="446.0" x2="120.0" y2="154.0" stroke="#9fb2c4" stroke-width="2" stroke-linecap="round"/><text x="90.0" y="130.0" text-anchor="middle" font-family='Inter,Arial,sans-serif' font-size="14" font-weight="600" fill="#9fb2c4" style="">E</text><line x1="214.0" y1="220.0" x2="446.0" y2="220.0" stroke="#9fb2c4" stroke-width="2" stroke-linecap="round"/><text x="330.0" y="205.0" text-anchor="middle" font-family='Inter,Arial,sans-serif' font-size="13" font-weight="600" fill="#9fb2c4" style="">σ*(E–X) acceptor</text><defs><marker id="ah45413" markerWidth="8" markerHeight="8" refX="5" refY="3"
            orient="auto"><path d="M0,0 L6,3 L0,6 Z" fill="#7cc4ff"/></marker></defs><path d="M 240.0 380.0 Q 268.0 268.0 380.0 240.0" stroke="#7cc4ff" stroke-width="2.6" fill="none" marker-end="url(#ah45413)"/><line x1="214.0" y1="380.0" x2="446.0" y2="380.0" stroke="#9fb2c4" stroke-width="2" stroke-linecap="round"/><text x="330.0" y="405.0" text-anchor="middle" font-family='Inter,Arial,sans-serif' font-size="13" font-weight="600" fill="#9fb2c4" style="">n(O) donor</text><text x="200.0" y="400.0" text-anchor="middle" font-family='Inter,Arial,sans-serif' font-size="16" font-weight="600" fill="#7cc4ff" style="">↑↓</text><line x1="664.0" y1="250.0" x2="886.0" y2="250.0" stroke="#9fb2c4" stroke-width="2" stroke-linecap="round"/><text x="775.0" y="235.0" text-anchor="middle" font-family='Inter,Arial,sans-serif' font-size="12" font-weight="600" fill="#9fb2c4" style="">antibonding</text><text x="775.0" y="320.0" text-anchor="middle" font-family='Inter,Arial,sans-serif' font-size="15" font-weight="600" fill="#50dc7b" style="">↑↓</text><line x1="664.0" y1="335.0" x2="886.0" y2="335.0" stroke="#9fb2c4" stroke-width="2" stroke-linecap="round"/><text x="775.0" y="355.0" text-anchor="middle" font-family='Inter,Arial,sans-serif' font-size="12" font-weight="600" fill="#9fb2c4" style="">nonbonding</text><text x="775.0" y="400.0" text-anchor="middle" font-family='Inter,Arial,sans-serif' font-size="15" font-weight="600" fill="#50dc7b" style="">↑↓</text><line x1="664.0" y1="415.0" x2="886.0" y2="415.0" stroke="#9fb2c4" stroke-width="2" stroke-linecap="round"/><text x="775.0" y="435.0" text-anchor="middle" font-family='Inter,Arial,sans-serif' font-size="12" font-weight="600" fill="#9fb2c4" style="">bonding</text><text x="775.0" y="470.0" text-anchor="middle" font-family='Inter,Arial,sans-serif' font-size="13" font-weight="400" fill="#ffffff" style="">3 orbitals, 4 electrons</text><text x="500.0" y="520.0" text-anchor="middle" font-family='Inter,Arial,sans-serif' font-size="14" font-weight="400" fill="#9fb2c4" style="font-style:italic;">Qualitative orbital model — donation from a water/hydroxide lone pair into an acceptor</text><text x="500.0" y="541.0" text-anchor="middle" font-family='Inter,Arial,sans-serif' font-size="14" font-weight="400" fill="#9fb2c4" style="font-style:italic;">with σ*(E–X) character simultaneously forms E–O and weakens E–X. The three-centre levels</text><text x="500.0" y="562.0" text-anchor="middle" font-family='Inter,Arial,sans-serif' font-size="14" font-weight="400" fill="#9fb2c4" style="font-style:italic;">are not a calculated energy diagram for any specific molecule.</text></svg>