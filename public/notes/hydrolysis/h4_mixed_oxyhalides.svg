<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 380" width="900" height="380"><rect x="0" y="0" width="900" height="380" fill="#0a0c11"/><text x="450.0" y="22.0" text-anchor="middle" font-family='Inter,Arial,sans-serif' font-size="11.5" font-weight="800" fill="#7cc4ff" style="letter-spacing:1.6px;">GROUP 16 · MIXED OXYHALIDES</text><text x="450.0" y="70.0" text-anchor="middle" font-family='Inter,Arial,sans-serif' font-size="22" font-weight="800" fill="#ffffff" style="">CrO₂Cl₂ and SOF₄: the same addition–elimination motif</text><text x="90.0" y="170.0" text-anchor="middle" font-family='Inter,Arial,sans-serif' font-size="15" font-weight="600" fill="#ffffff" style="">CrO₂Cl₂ + 2H₂O</text><defs><marker id="sa50580" markerWidth="8" markerHeight="8" refX="5" refY="3"
            orient="auto"><path d="M0,0 L6,3 L0,6 Z" fill="#ffffff"/></marker></defs><line x1="340" y1="170" x2="560" y2="170" stroke="#ffffff" stroke-width="2.2" marker-end="url(#sa50580)"/><text x="450.0" y="160.0" text-anchor="middle" font-family='Inter,Arial,sans-serif' font-size="15" font-weight="400" fill="#9fb2c4" style="">attack at Cr ×2 / –2HCl</text><text x="600.0" y="170.0" text-anchor="start" font-family='Inter,Arial,sans-serif' font-size="15" font-weight="600" fill="#ffffff" style="">H₂CrO₄ + 2HCl</text><text x="90.0" y="280.0" text-anchor="middle" font-family='Inter,Arial,sans-serif' font-size="15" font-weight="600" fill="#ffffff" style="">SOF₄ + H₂O</text><defs><marker id="sa12464" markerWidth="8" markerHeight="8" refX="5" refY="3"
            orient="auto"><path d="M0,0 L6,3 L0,6 Z" fill="#ffffff"/></marker></defs><line x1="340" y1="280" x2="560" y2="280" stroke="#ffffff" stroke-width="2.2" marker-end="url(#sa12464)"/><text x="450.0" y="270.0" text-anchor="middle" font-family='Inter,Arial,sans-serif' font-size="15" font-weight="400" fill="#9fb2c4" style="">attack at S / S–F replaced</text><text x="600.0" y="280.0" text-anchor="start" font-family='Inter,Arial,sans-serif' font-size="15" font-weight="600" fill="#ffffff" style="">H₂SO₄ + ...HF</text><text x="450.0" y="340.0" text-anchor="middle" font-family='Inter,Arial,sans-serif' font-size="14" font-weight="400" fill="#9fb2c4" style="font-style:italic;">Both hydrolyse like SOCl₂/SO₂Cl₂: water adds at the central atom while a halide leaves —</text><text x="450.0" y="361.0" text-anchor="middle" font-family='Inter,Arial,sans-serif' font-size="14" font-weight="400" fill="#9fb2c4" style="font-style:italic;">only the surviving oxo groups and final oxoacid differ.</text></svg>