<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>General Organic Chemistry</title>
<style>
:root{--ink:#14181f;--mute:#4a5565;--line:#c9cfd9;--soft:#eef1f6;--c:#1d4ed8;--no:#9f1c1c;--ok:#166534;--mot:#6d28d9}
*{box-sizing:border-box}
@page{size:A4;margin:12mm 11mm 14mm 11mm;@bottom-center{content:"Synergic Bond · General Organic Chemistry · " counter(page);font:7pt "Century Schoolbook",Georgia,serif;color:#4a5565}}
html{background:#e9ecf1}
body{margin:0 auto;max-width:210mm;background:#fff;color:var(--ink);font:9pt/1.34 "Century Schoolbook","New Century Schoolbook","Century Schoolbook L","C059",Georgia,serif;padding:0 2mm}
.brand{display:flex;justify-content:space-between;border-bottom:1.4pt solid var(--c);padding:2mm 0 1.2mm;margin-bottom:2mm;font-size:8pt;color:var(--mute)}.brand b{color:var(--c);font-size:10pt;letter-spacing:.04em}
.chh h2{font-size:21pt;margin:.1em 0 .05em;color:var(--c);line-height:1.1}.chh .num{font-size:8pt;letter-spacing:.1em;text-transform:uppercase;color:var(--c);font-weight:700}.lead{color:var(--mute);margin:.1em 0 .5em;font-size:9.5pt}
.toc{background:var(--soft);padding:2mm 4mm;margin:2mm 0 3mm;font-size:8pt;columns:3;column-gap:6mm}.toc h3{margin:0 0 1mm;font-size:10pt;border:0}.toc ol{margin:0;padding:0;list-style:none}.toc li{break-inside:avoid;margin:.1em 0}.toc a{color:var(--ink);text-decoration:none}
.cols{column-count:2;column-gap:7mm;column-rule:.4pt solid var(--line)}
h3{font-size:12pt;color:var(--c);border-bottom:.8pt solid var(--c);margin:.9em 0 .35em;padding-bottom:.1em;break-after:avoid;line-height:1.2}

p{margin:.32em 0;text-align:justify;hyphens:auto;orphans:2;widows:2}
ul,ol{margin:.3em 0;padding-left:1.25em}li{margin:.12em 0;text-align:justify}
b{font-weight:700}

.box .bl{display:block;font:700 7pt/1.2 system-ui,Helvetica,Arial,sans-serif;letter-spacing:.06em;text-transform:uppercase;color:var(--c);margin-bottom:.1em}
.box.trap{border-color:var(--no);background:#fdf2f2}.box.trap .bl{color:var(--no)}
.box.tip{border-color:var(--ok);background:#f0faf3}.box.tip .bl{color:var(--ok)}
.box.mot{border-color:var(--mot);background:#f6f2fe}.box.mot .bl{color:var(--mot)}
.box.why{border-color:#b45309;background:#fff8ec}.box.why .bl{color:#b45309}
.box.sp,.box.cmp,.box.link{border-color:#0e7490;background:#effafc}.box.sp .bl,.box.cmp .bl,.box.link .bl{color:#0e7490}
.box.f{font-family:ui-monospace,Menlo,monospace;font-size:8.4pt}
.ex,.pq{border:.5pt solid var(--line);margin:.5em 0;padding:.3em .5em;background:#fff}

.qh{font:700 7.6pt system-ui,Helvetica,sans-serif;margin-bottom:.15em}.qh b{color:var(--c)}.pq .qh b{color:#374151}
.tag{font:600 6.6pt system-ui,sans-serif;padding:0 .35em;border:.4pt solid var(--line);color:var(--mute);margin-left:.3em;background:var(--soft)}
.sol{margin-top:.25em;padding:.2em .45em;background:var(--soft);font-size:8.6pt}
ol.st{padding-left:1.2em;margin:.2em 0}ol.st li{margin:.12em 0}ul.stp{list-style:none;padding:0}
.tw{margin:.4em 0;overflow:visible}.tw.wide{column-span:all}

th{background:#e4e9f2;text-align:left}th,td{border:.4pt solid var(--line);padding:.12em .3em;vertical-align:top}tr{break-inside:avoid}
.fig{margin:.4em 0;text-align:center}.fig svg{max-width:100%;height:auto}
.sch{margin:.4em 0;padding:.25em;background:#fff;border:.4pt solid var(--line);color:#14181f;break-inside:avoid}
.sch .row{display:flex;align-items:center;justify-content:center;flex-wrap:wrap;gap:.1em .3em}
.sch .sp{display:inline-flex;align-items:center;gap:.2em}.sch .m svg{display:block;max-width:none;height:auto}.sch .pl{font-weight:700;color:#4a5565}
.sch .ar{display:inline-flex;flex-direction:column;align-items:center;min-width:2.4em;font-size:6.8pt;line-height:1.1}.sch .rg{text-align:center;max-width:8em}.sch .ln{font-size:12pt;line-height:1;color:#4a5565}
.sch .mc{display:inline-flex;flex-direction:column;align-items:center}.sch .lb{font-size:6.8pt;text-align:center;max-width:9em}
.sch .cap{font-size:7pt;color:#4a5565;text-align:center;margin-top:.1em;font-family:system-ui,sans-serif}
svg text{font-family:system-ui,Helvetica,sans-serif}
.qbl{display:none}
.src li{font-size:8pt}
.keytbl td{font-size:7.4pt}
.sec-full{column-span:all}
.sch svg .s0{fill:none;fill-rule:evenodd;stroke:#000000;stroke-width:1.7px;stroke-linecap:butt;stroke-linejoin:miter;stroke-opacity:1}.sch svg .s1{fill:none;stroke:#000000;stroke-width:1.7px;stroke-linecap:butt;stroke-linejoin:miter;stroke-miterlimit:10;stroke-opacity:1;}.sch svg .s2{fill:none;fill-rule:evenodd;stroke:#FF0000;stroke-width:1.7px;stroke-linecap:butt;stroke-linejoin:miter;stroke-opacity:1}.sch svg .s3{fill:none;fill-rule:evenodd;stroke:#0000FF;stroke-width:1.7px;stroke-linecap:butt;stroke-linejoin:miter;stroke-opacity:1}.sch svg .s4{fill:none;fill-rule:evenodd;stroke:#00CC00;stroke-width:1.7px;stroke-linecap:butt;stroke-linejoin:miter;stroke-opacity:1}.sch svg .s5{fill:none;fill-rule:evenodd;stroke:#33CCCC;stroke-width:1.7px;stroke-linecap:butt;stroke-linejoin:miter;stroke-opacity:1}.sch svg .s6{fill:none;fill-rule:evenodd;stroke:#7F4C19;stroke-width:1.7px;stroke-linecap:butt;stroke-linejoin:miter;stroke-opacity:1}.sch svg .s7{fill:#000000;fill-rule:evenodd;fill-opacity:1;stroke:#000000;stroke-width:0.0px;stroke-linecap:butt;stroke-linejoin:miter;stroke-miterlimit:10;stroke-opacity:1;}.sch svg .s8{fill:#000000;fill-rule:evenodd;fill-opacity:1;stroke:#000000;stroke-width:0.4px;stroke-linecap:butt;stroke-linejoin:miter;stroke-miterlimit:10;stroke-opacity:1;}.sch svg .s9{fill:none;fill-rule:evenodd;stroke:#CCCC00;stroke-width:1.7px;stroke-linecap:butt;stroke-linejoin:miter;stroke-opacity:1}.sch svg .s10{fill:none;fill-rule:evenodd;stroke:#A01EEF;stroke-width:1.7px;stroke-linecap:butt;stroke-linejoin:miter;stroke-opacity:1}
