ont-weight="400" fill="#9fb2c4" style="font-style:italic;">tautomerisation is not acidic. AsCl₃ hydrolyses the same way but stays as As(OH)₃ (no P–H</text><text x="450.0" y="512.0" text-anchor="middle" font-family='Inter,Arial,sans-serif' font-size="14" font-weight="400" fill="#9fb2c4" style="font-style:italic;">analogue exists for arsenic).</text></svg>