<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900"><defs>
  <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#030712"/><stop offset="0.55" stop-color="#071426"/><stop offset="1" stop-color="#120a24"/></linearGradient>
  <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0"><stop stop-color="#43e6ff"/><stop offset="0.5" stop-color="#9b8cff"/><stop offset="1" stop-color="#ffb65c"/></linearGradient>
  <filter id="glow"><feGaussianBlur stdDeviation="6" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
  <style>
    .title{font:800 44px Inter,Arial,sans-serif;fill:#f8fafc} .sub{font:400 22px Inter,Arial,sans-serif;fill:#b9c6d8}
    .h{font:750 26px Inter,Arial,sans-serif;fill:#69e7ff} .t{font:400 21px Inter,Arial,sans-serif;fill:#d8e1ee}
    .small{font:400 17px Inter,Arial,sans-serif;fill:#aebbd0} .tiny{font:400 15px Inter,Arial,sans-serif;fill:#8ba0b8}
    .gold{fill:#ffc866} .violet{fill:#b9a2ff} .cyan{fill:#62e8ff} .coral{fill:#ff9c7a} .green{fill:#7be6ab}
    .panel{fill:#07111f;stroke:#284563;stroke-width:2} .panel2{fill:#0d1023;stroke:#5f4a88;stroke-width:2}
    .line{stroke:#63e6ff;stroke-width:4;fill:none} .dash{stroke:#b69cff;stroke-width:4;stroke-dasharray:12 10;fill:none}
    .bond{stroke:#e8f1fb;stroke-width:5} .thin{stroke:#6f829a;stroke-width:2;fill:none}
  </style>
</defs>
<rect width="1600" height="900" fill="url(#bg)"/><rect x="44" y="34" width="1512" height="832" rx="34" fill="none" stroke="#17324d" stroke-width="2"/><text x="78" y="96" class="title">Isotopes of Hydrogen</text><rect x="78" y="118" width="430" height="5" rx="3" fill="url(#accent)"/><text x="78" y="158" class="sub">Protium, deuterium and tritium — same electron count, different mass</text><rect x="140" y="210" width="380" height="380" rx="20" fill="#07111f" stroke="#62e8ff" stroke-width="2"/><text x="330" y="258" class="h" text-anchor="middle" style="fill:#62e8ff">Protium, ¹H</text><circle cx="330" cy="380" r="34" fill="#132a4a" stroke="#e8f1fb" stroke-width="3"/><circle cx="400" cy="370" r="9" fill="#ffc866"/><text x="180" y="470" class="small">1 proton</text><text x="180" y="494" class="small">0 neutrons</text><text x="180" y="518" class="small">1 electron</text><text x="180" y="556" class="tiny">stable · 99.985% abundance</text><rect x="620" y="210" width="380" height="380" rx="20" fill="#07111f" stroke="#7be6ab" stroke-width="2"/><text x="810" y="258" class="h" text-anchor="middle" style="fill:#7be6ab">Deuterium, ²H (D)</text><circle cx="810" cy="380" r="34" fill="#132a4a" stroke="#e8f1fb" stroke-width="3"/><circle cx="826" cy="386" r="12" fill="#0e3b70" stroke="#62e8ff" stroke-width="2"/><circle cx="880" cy="370" r="9" fill="#ffc866"/><text x="660" y="470" class="small">1 proton</text><text x="660" y="494" class="small">1 neutron</text><text x="660" y="518" class="small">1 electron</text><text x="660" y="556" class="tiny">stable · 0.015% · forms D₂, D₂O</text><rect x="1100" y="210" width="380" height="380" rx="20" fill="#07111f" stroke="#ff9c7a" stroke-width="2"/><text x="1290" y="258" class="h" text-anchor="middle" style="fill:#ff9c7a">Tritium, ³H (T)</text><circle cx="1290" cy="380" r="34" fill="#132a4a" stroke="#e8f1fb" stroke-width="3"/><circle cx="1306" cy="386" r="12" fill="#0e3b70" stroke="#62e8ff" stroke-width="2"/><circle cx="1276" cy="390" r="12" fill="#0e3b70" stroke="#62e8ff" stroke-width="2"/><circle cx="1360" cy="370" r="9" fill="#ffc866"/><text x="1140" y="470" class="small">1 proton</text><text x="1140" y="494" class="small">2 neutrons</text><text x="1140" y="518" class="small">1 electron</text><text x="1140" y="556" class="tiny">radioactive · β⁻ emitter, t½ ≈ 12.3 y</text><rect x="78" y="630" width="1460" height="120" rx="14" fill="#0a2630" stroke="#2aaec0"/><text x="100" y="682" class="small">All three isotopes have the same electronic configuration (1s¹), so their chemical properties are essentially identical — but mass differences of up to 3× change reaction rates,</text><text x="100" y="704" class="small">bond strengths and physical properties substantially (the kinetic isotope effect).</text></svg>