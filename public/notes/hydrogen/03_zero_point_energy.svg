    .bond{stroke:#e8f1fb;stroke-width:5} .thin{stroke:#6f829a;stroke-width:2;fill:none}
  </style>
</defs>
<rect width="1600" height="900" fill="url(#bg)"/><rect x="44" y="34" width="1512" height="832" rx="34" fill="none" stroke="#17324d" stroke-width="2"/><text x="78" y="96" class="title">Zero-Point Energy and the Isotope Effect</text><rect x="78" y="118" width="430" height="5" rx="3" fill="url(#accent)"/><text x="78" y="158" class="sub">Why a D–D bond is effectively stronger than an H–H bond</text><rect x="78" y="210" width="1460" height="470" rx="26" class="panel"/><text x="112" y="260" class="h">Same electronic potential well, different vibrational floor</text><path d="M 220 600 L 235 591 L 250 581 L 265 570 L 280 559 L 295 548 L 310 536 L 325 524 L 340 512 L 355 499 L 370 487 L 385 474 L 400 462 L 415 449 L 430 438 L 445 426 L 460 416 L 475 406 L 490 397 L 505 389 L 520 382 L 535 376 L 550 371 L 565 367 L 580 365 L 595 364 L 610 364 L 625 366 L 640 369 L 655 373 L 670 379 L 685 386 L 700 393 L 715 402 L 730 412 L 745 422 L 760 433 L 775 445 L 790 457 L 805 469 L 820 482 L 835 494 L 850 507 L 865 519 L 880 531 L 895 543 L 910 555 L 925 566 L 940 577 L 955 587 L 970 596 L 985 605 L 1000 614 L 1015 622 L 1030 629 L 1045 635 L 1060 641 L 1075 647 L 1090 652 L 1105 656 L 1120 661" class="line"/><line x1="200" y1="660" x2="200" y2="250" class="thin"/><path d="M 200 250 l -10 20 h 20 z" fill="#8ba0b8"/><text x="150" y="430" class="small" transform="rotate(-90 150 430)">Potential</text><text x="1060" y="690" class="small">H–H / D–D distance</text><line x1="400" y1="402.0" x2="740" y2="402.0" stroke="#62e8ff" stroke-width="3"/><text x="760" y="408.0" class="t" style="fill:#62e8ff">E₀(H–H)</text><line x1="400" y1="440.0" x2="740" y2="440.0" stroke="#7be6ab" stroke-width="3"/><text x="760" y="446.0" class="t" style="fill:#7be6ab">E₀(D–D)  — lower</text><line x1="570" y1="402.0" x2="570" y2="440.0" stroke="#ff9c7a" stroke-width="2" stroke-dasharray="4 4"/><text x="1140" y="240" class="t" text-anchor="middle">E₀ = ½hν,  ν ∝ 1/√μ  (μ = reduced mass)</text><rect x="78" y="700" width="1460" height="120" rx="14" fill="#0a2630" stroke="#2aaec0"/><text x="100" y="747" class="small">The heavier D–D bond vibrates at a lower frequency, so it sits at a lower zero-point energy — effectively a deeper, stronger bond. This is why deuterated compounds often react more</text><text x="100" y="769" class="small">slowly (the kinetic isotope effect).</text></svg>