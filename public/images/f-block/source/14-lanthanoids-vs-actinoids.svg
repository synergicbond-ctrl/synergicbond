<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900">
<rect x="0" y="0" width="1600" height="900" rx="0" fill="#07131F" stroke="#07131F" stroke-width="0"/>
<path d="M0 0H1600V122H0Z" fill="#091B2A"/>
<text x="62" y="64" font-family="Aptos,Arial,sans-serif" font-size="40" fill="#F4FAFF" font-weight="750" text-anchor="start">Lanthanoids versus actinoids: one-screen comparison</text>
<text x="62" y="101" font-family="Aptos,Arial,sans-serif" font-size="20" fill="#A6BDD0" font-weight="400" text-anchor="start">Every difference traces back to shielding, orbital availability or radioactivity</text>
<rect x="70" y="180" width="1460" height="620" rx="18" fill="#0C2537" stroke="#29475C" stroke-width="2"/>
<rect x="455" y="180" width="515" height="70" rx="12" fill="#102E46" stroke="#39D9FF" stroke-width="2"/>
<rect x="970" y="180" width="560" height="70" rx="12" fill="#102E46" stroke="#FF4FD8" stroke-width="2"/>
<text x="712" y="225" font-family="Aptos,Arial,sans-serif" font-size="25" fill="#39D9FF" font-weight="850" text-anchor="middle">LANTHANOIDS</text>
<text x="1250" y="225" font-family="Aptos,Arial,sans-serif" font-size="25" fill="#FF4FD8" font-weight="850" text-anchor="middle">ACTINOIDS</text>
<text x="100" y="320" font-family="Aptos,Arial,sans-serif" font-size="21" fill="#FFC857" font-weight="750" text-anchor="start">Orbital</text>
<text x="500" y="320" font-family="Aptos,Arial,sans-serif" font-size="21" fill="#F4FAFF" font-weight="600" text-anchor="start">4f: buried</text>
<text x="1015" y="320" font-family="Aptos,Arial,sans-serif" font-size="21" fill="#F4FAFF" font-weight="600" text-anchor="start">5f: more exposed</text>
<line x1="80" y1="344" x2="1515" y2="344" stroke="#29475C" stroke-width="2" />
<text x="100" y="406" font-family="Aptos,Arial,sans-serif" font-size="21" fill="#FFC857" font-weight="750" text-anchor="start">Dominant state</text>
<text x="500" y="406" font-family="Aptos,Arial,sans-serif" font-size="21" fill="#F4FAFF" font-weight="600" text-anchor="start">+3</text>
<text x="1015" y="406" font-family="Aptos,Arial,sans-serif" font-size="21" fill="#F4FAFF" font-weight="600" text-anchor="start">+3 late; high states early</text>
<line x1="80" y1="430" x2="1515" y2="430" stroke="#29475C" stroke-width="2" />
<text x="100" y="492" font-family="Aptos,Arial,sans-serif" font-size="21" fill="#FFC857" font-weight="750" text-anchor="start">Bonding</text>
<text x="500" y="492" font-family="Aptos,Arial,sans-serif" font-size="21" fill="#F4FAFF" font-weight="600" text-anchor="start">mostly ionic</text>
<text x="1015" y="492" font-family="Aptos,Arial,sans-serif" font-size="21" fill="#F4FAFF" font-weight="600" text-anchor="start">greater covalent contribution</text>
<line x1="80" y1="516" x2="1515" y2="516" stroke="#29475C" stroke-width="2" />
<text x="100" y="578" font-family="Aptos,Arial,sans-serif" font-size="21" fill="#FFC857" font-weight="750" text-anchor="start">Spectra</text>
<text x="500" y="578" font-family="Aptos,Arial,sans-serif" font-size="21" fill="#F4FAFF" font-weight="600" text-anchor="start">weak, sharp</text>
<text x="1015" y="578" font-family="Aptos,Arial,sans-serif" font-size="21" fill="#F4FAFF" font-weight="600" text-anchor="start">more ligand-sensitive</text>
<line x1="80" y1="602" x2="1515" y2="602" stroke="#29475C" stroke-width="2" />
<text x="100" y="664" font-family="Aptos,Arial,sans-serif" font-size="21" fill="#FFC857" font-weight="750" text-anchor="start">Complexes</text>
<text x="500" y="664" font-family="Aptos,Arial,sans-serif" font-size="21" fill="#F4FAFF" font-weight="600" text-anchor="start">hard O/F donors</text>
<text x="1015" y="664" font-family="Aptos,Arial,sans-serif" font-size="21" fill="#F4FAFF" font-weight="600" text-anchor="start">broader ligand chemistry</text>
<line x1="80" y1="688" x2="1515" y2="688" stroke="#29475C" stroke-width="2" />
<text x="100" y="750" font-family="Aptos,Arial,sans-serif" font-size="21" fill="#FFC857" font-weight="750" text-anchor="start">Radioactivity</text>
<text x="500" y="750" font-family="Aptos,Arial,sans-serif" font-size="21" fill="#F4FAFF" font-weight="600" text-anchor="start">Pm exceptional</text>
<text x="1015" y="750" font-family="Aptos,Arial,sans-serif" font-size="21" fill="#F4FAFF" font-weight="600" text-anchor="start">all radioactive</text>
<line x1="80" y1="774" x2="1515" y2="774" stroke="#29475C" stroke-width="2" />
<rect x="330" y="825" width="940" height="44" rx="10" fill="#0A1D2B" stroke="#1ED6C0" stroke-width="2"/>
<text x="800" y="855" font-family="Aptos,Arial,sans-serif" font-size="20" fill="#1ED6C0" font-weight="750" text-anchor="middle">Both contract across the series because f electrons shield poorly.</text>
</svg>