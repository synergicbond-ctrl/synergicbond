<svg xmlns="http://www.w3.org/2000/svg" width="760" height="382" viewBox="0 0 760 382" font-family="'Inter','Helvetica Neue',Arial,'DejaVu Sans',sans-serif"><rect width="760" height="382" fill="#0a0c11"/><g stroke="#141a24" stroke-width="1"><line x1="34" y1="0" x2="34" y2="382"/><line x1="68" y1="0" x2="68" y2="382"/><line x1="102" y1="0" x2="102" y2="382"/><line x1="136" y1="0" x2="136" y2="382"/><line x1="170" y1="0" x2="170" y2="382"/><line x1="204" y1="0" x2="204" y2="382"/><line x1="238" y1="0" x2="238" y2="382"/><line x1="272" y1="0" x2="272" y2="382"/><line x1="306" y1="0" x2="306" y2="382"/><line x1="340" y1="0" x2="340" y2="382"/><line x1="374" y1="0" x2="374" y2="382"/><line x1="408" y1="0" x2="408" y2="382"/><line x1="442" y1="0" x2="442" y2="382"/><line x1="476" y1="0" x2="476" y2="382"/><line x1="510" y1="0" x2="510" y2="382"/><line x1="544" y1="0" x2="544" y2="382"/><line x1="578" y1="0" x2="578" y2="382"/><line x1="612" y1="0" x2="612" y2="382"/><line x1="646" y1="0" x2="646" y2="382"/><line x1="680" y1="0" x2="680" y2="382"/><line x1="714" y1="0" x2="714" y2="382"/><line x1="748" y1="0" x2="748" y2="382"/><line x1="0" y1="34" x2="760" y2="34"/><line x1="0" y1="68" x2="760" y2="68"/><line x1="0" y1="102" x2="760" y2="102"/><line x1="0" y1="136" x2="760" y2="136"/><line x1="0" y1="170" x2="760" y2="170"/><line x1="0" y1="204" x2="760" y2="204"/><line x1="0" y1="238" x2="760" y2="238"/><line x1="0" y1="272" x2="760" y2="272"/><line x1="0" y1="306" x2="760" y2="306"/><line x1="0" y1="340" x2="760" y2="340"/><line x1="0" y1="374" x2="760" y2="374"/></g><rect x="8" y="8" width="744" height="332" fill="none" stroke="#232a36" stroke-width="1"/><path d="M 8 15 L 8 8 L 15 8" stroke="#4db8e8" stroke-width="1.4" fill="none"/><path d="M 752 15 L 752 8 L 745 8" stroke="#4db8e8" stroke-width="1.4" fill="none"/><path d="M 8 333 L 8 340 L 15 340" stroke="#4db8e8" stroke-width="1.4" fill="none"/><path d="M 752 333 L 752 340 L 745 340" stroke="#4db8e8" stroke-width="1.4" fill="none"/><text x="20" y="18" font-size="8.5" font-weight="bold" fill="#4db8e8" text-anchor="start" font-family="'SF Mono','DejaVu Sans Mono',ui-monospace,Menlo,monospace" letter-spacing="0.24em">SYNERGIC BOND</text><path d="M 728 12 l 6 6 l -6 6 l -6 -6 z" fill="none" stroke="#63d39b" stroke-width="1.2"/><text x="20" y="40" font-size="16" font-weight="bold" fill="#f4ecd9" text-anchor="start" font-family="'Georgia','Times New Roman',serif">Ostwald process for nitric acid</text><line x1="20" y1="42" x2="740" y2="42" stroke="#232a36" stroke-width="1"/><g transform="translate(0,34)"><rect x="60" y="80" width="212" height="120" rx="8" fill="#0f1219" stroke="#6fb7dc" stroke-width="1.6"/><text x="74.0" y="102.0" font-size="9" font-weight="bold" fill="#f4ecd9" text-anchor="start">1  ·  catalytic oxidation</text><text x="166.0" y="132.0" font-size="8.4" font-weight="normal" fill="#dbe3ef" text-anchor="middle">4 NH₃ + 5 O₂ →</text><text x="166.0" y="150.0" font-size="8.4" font-weight="bold" fill="#63d39b" text-anchor="middle">4 NO + 6 H₂O</text><text x="166.0" y="178.0" font-size="7.6" font-weight="normal" fill="#93a1b5" text-anchor="middle">Pt–Rh gauze, ≈1100 K, ≈9 bar</text><rect x="296" y="80" width="212" height="120" rx="8" fill="#0f1219" stroke="#6fb7dc" stroke-width="1.6"/><text x="310.0" y="102.0" font-size="9" font-weight="bold" fill="#f4ecd9" text-anchor="start">2  ·  further oxidation</text><text x="402.0" y="132.0" font-size="8.4" font-weight="normal" fill="#dbe3ef" text-anchor="middle">2 NO + O₂ →</text><text x="402.0" y="150.0" font-size="8.4" font-weight="bold" fill="#63d39b" text-anchor="middle">2 NO₂</text><text x="402.0" y="178.0" font-size="7.6" font-weight="normal" fill="#93a1b5" text-anchor="middle">cool to ≈320 K</text><rect x="532" y="80" width="212" height="120" rx="8" fill="#0f1219" stroke="#6fb7dc" stroke-width="1.6"/><text x="546.0" y="102.0" font-size="9" font-weight="bold" fill="#f4ecd9" text-anchor="start">3  ·  absorption</text><text x="638.0" y="132.0" font-size="8.4" font-weight="normal" fill="#dbe3ef" text-anchor="middle">4 NO₂ + O₂ + 2 H₂O →</text><text x="638.0" y="150.0" font-size="8.4" font-weight="bold" fill="#63d39b" text-anchor="middle">4 HNO₃</text><text x="638.0" y="178.0" font-size="7.6" font-weight="normal" fill="#93a1b5" text-anchor="middle">water in an absorption tower</text><line x1="272.0" y1="140.0" x2="292.0" y2="140.0" stroke="#4db8e8" stroke-width="2" stroke-linecap="round"/><line x1="292.0" y1="140.0" x2="285.6" y2="137.1" stroke="#4db8e8" stroke-width="2" stroke-linecap="round"/><line x1="292.0" y1="140.0" x2="285.6" y2="142.9" stroke="#4db8e8" stroke-width="2" stroke-linecap="round"/><line x1="508.0" y1="140.0" x2="528.0" y2="140.0" stroke="#4db8e8" stroke-width="2" stroke-linecap="round"/><line x1="528.0" y1="140.0" x2="521.6" y2="137.1" stroke="#4db8e8" stroke-width="2" stroke-linecap="round"/><line x1="528.0" y1="140.0" x2="521.6" y2="142.9" stroke="#4db8e8" stroke-width="2" stroke-linecap="round"/><path d="M 578 200 L 578 232 L 166 232 L 166 200" fill="none" stroke="#b79bff" stroke-width="1.8" stroke-dasharray="5 4"/><line x1="166.0" y1="214.0" x2="166.0" y2="202.0" stroke="#b79bff" stroke-width="2" stroke-linecap="round"/><line x1="166.0" y1="202.0" x2="163.6" y2="207.5" stroke="#b79bff" stroke-width="2" stroke-linecap="round"/><line x1="166.0" y1="202.0" x2="168.4" y2="207.5" stroke="#b79bff" stroke-width="2" stroke-linecap="round"/><text x="372.0" y="226.0" font-size="8" font-weight="normal" fill="#b79bff" text-anchor="middle">NO from stage 3 is recycled to stage 2</text><text x="390.0" y="288.0" font-size="9" font-weight="bold" fill="#dbe3ef" text-anchor="middle">dilute HNO₃ (≈60 %) leaves the tower</text><text x="390.0" y="308.0" font-size="8.4" font-weight="normal" fill="#93a1b5" text-anchor="middle">concentrated to 68 % by distillation, then to ≈98 % over conc. H₂SO₄ or Mg(NO₃)₂</text><text x="390.0" y="328.0" font-size="9" font-weight="bold" fill="#63d39b" text-anchor="middle">overall:  NH₃ + 2 O₂ → HNO₃ + H₂O</text></g></svg>