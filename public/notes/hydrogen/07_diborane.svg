<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900"><defs>
  <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#030712"/><stop offset="0.55" stop-color="#071426"/><stop offset="1" stop-color="#120a24"/></linearGradient>
  <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0"><stop stop-color="#43e6ff"/><stop offset="0.5" stop-color="#9b8cff"/><stop offset="1" stop-color="#ffb65c"/></linearGradient>
  <filter id="glow"><feGaussianBlur stdDeviation="6" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
  <style>
    .title{font:800 44px Inter,Arial,sans-serif;fill:#f8fafc} .sub{font:400 22px Inter,Arial,sans-serif;fill:#b9c6d8}
    .h{font:750 26px Inter,Arial,sans-serif;fill:#69e7ff} .t{font:400 21px Inter,Arial,sans-serif;fill:#d8e1ee}
    .small{font:400 17px Inter,Arial,sans-serif;fill:#aebbd0} .tiny{font:400 15px Inter,Arial,sans-serif;fill:#8ba0b8}
    .gold{fill:#ffc866} .violet{fill:#b9a2ff} .cyan{fill:#62e8ff} .coral{fill:#ff9c7a} .green{fill:#7be6ab}
    .panel{fill:#07111f;stroke:#284563;stroke-width:2} .panel2{fill:#0d1023;stroke:#5f4a88;stroke-width:2}
    .line{stroke:#63e6ff;stroke-width:4;fill:none} .dash{stroke:#b69cff;stroke-width:4;stroke-dasharray:12 10;fill:none}
    .bond{stroke:#e8f1fb;stroke-width:5} .thin{stroke:#6f829a;stroke-width:2;fill:none}
  </style>
</defs>
<rect width="1600" height="900" fill="url(#bg)"/><rect x="44" y="34" width="1512" height="832" rx="34" fill="none" stroke="#17324d" stroke-width="2"/><text x="78" y="96" class="title">Diborane, B₂H₆ — Bridged Structure</text><rect x="78" y="118" width="430" height="5" rx="3" fill="url(#accent)"/><text x="78" y="158" class="sub">Four terminal 2-centre bonds, two bridging 3-centre bonds</text><circle cx="560" cy="460" r="46" fill="#12213f" stroke="#62e8ff" stroke-width="4" filter="url(#glow)"/><text x="560" y="468" class="title" text-anchor="middle" style="font-size:32px">B</text><circle cx="900" cy="460" r="46" fill="#12213f" stroke="#62e8ff" stroke-width="4" filter="url(#glow)"/><text x="900" y="468" class="title" text-anchor="middle" style="font-size:32px">B</text><line x1="560" y1="460" x2="400" y2="362.0" class="line"/><circle cx="400" cy="362.0" r="26" fill="#241c0e" stroke="#ffc866" stroke-width="4"/><text x="400" y="369.0" class="t" text-anchor="middle" style="font-size:20px;fill:#ffc866">H</text><text x="400" y="322.0" class="tiny" text-anchor="middle">terminal H</text><line x1="560" y1="460" x2="400" y2="558.0" class="line"/><circle cx="400" cy="558.0" r="26" fill="#241c0e" stroke="#ffc866" stroke-width="4"/><text x="400" y="565.0" class="t" text-anchor="middle" style="font-size:20px;fill:#ffc866">H</text><text x="400" y="614.0" class="tiny" text-anchor="middle">terminal H</text><line x1="900" y1="460" x2="1060" y2="362.0" class="line"/><circle cx="1060" cy="362.0" r="26" fill="#241c0e" stroke="#ffc866" stroke-width="4"/><text x="1060" y="369.0" class="t" text-anchor="middle" style="font-size:20px;fill:#ffc866">H</text><text x="1060" y="322.0" class="tiny" text-anchor="middle">terminal H</text><line x1="900" y1="460" x2="1060" y2="558.0" class="line"/><circle cx="1060" cy="558.0" r="26" fill="#241c0e" stroke="#ffc866" stroke-width="4"/><text x="1060" y="565.0" class="t" text-anchor="middle" style="font-size:20px;fill:#ffc866">H</text><text x="1060" y="614.0" class="tiny" text-anchor="middle">terminal H</text><line x1="560" y1="460" x2="730" y2="370" class="dash" stroke-dasharray="10 8"/><line x1="900" y1="460" x2="730" y2="370" class="dash" stroke-dasharray="10 8"/><circle cx="730" cy="370" r="26" fill="#241c0e" stroke="#b9a2ff" stroke-width="4"/><text x="730" y="377" class="t" text-anchor="middle" style="font-size:20px;fill:#b9a2ff">H</text><line x1="560" y1="460" x2="730" y2="550" class="dash" stroke-dasharray="10 8"/><line x1="900" y1="460" x2="730" y2="550" class="dash" stroke-dasharray="10 8"/><circle cx="730" cy="550" r="26" fill="#241c0e" stroke="#b9a2ff" stroke-width="4"/><text x="730" y="557" class="t" text-anchor="middle" style="font-size:20px;fill:#b9a2ff">H</text><text x="730" y="320" class="small" text-anchor="middle" style="fill:#b9a2ff">bridging H (3c-2e)</text><text x="730" y="625" class="small" text-anchor="middle" style="fill:#b9a2ff">bridging H (3c-2e)</text><rect x="78" y="660" width="1460" height="130" rx="14" fill="#0a2630" stroke="#2aaec0"/><text x="100" y="712" class="small">Diborane is electron-deficient: 12 valence electrons for 8 B-H connections. The 2 bridge hydrogens each donate into a delocalised 3-centre-2-electron B-H-B bond, not an ordinary</text><text x="100" y="734" class="small">2-electron bond — see the MO picture in the revision figure for this framework.</text></svg>