idth="130" height="90" rx="6" fill="none" stroke="#4db8e8" stroke-width="2"/><text x="465.0" y="110.0" font-size="8.6" font-weight="normal" fill="#4db8e8" text-anchor="middle">calciner</text><text x="465.0" y="152.0" font-size="9.5" font-weight="normal" fill="#dbe3ef" text-anchor="middle">2 NaHCO3</text><text x="465.0" y="172.0" font-size="9" font-weight="normal" fill="#63d39b" text-anchor="middle">-&gt; Na2CO3 + CO2 + H2O</text><text x="280.0" y="352.0" font-size="11.5" font-weight="bold" fill="#dbe3ef" text-anchor="middle">NH3 + CO2 + H2O + NaCl  -&gt;  NaHCO3  +  NH4Cl</text><text x="280.0" y="372.0" font-size="9" font-weight="normal" fill="#8b98ac" text-anchor="middle">NaHCO3 is only sparingly soluble in cold ammoniated brine, so it crystallises out</text></g></svg>