<svg xmlns="http://www.w3.org/2000/svg" width="520" height="320" viewBox="0 0 520 320" font-family="DejaVu Sans, Arial, sans-serif"><rect x="0" y="0" width="520" height="320" fill="white"/><text x="260.0" y="22.0" font-family="DejaVu Sans, Arial, sans-serif" font-size="17" font-weight="bold" fill="#111" text-anchor="middle">Holme's signal</text><path d="M 20 165 Q 130 156 260 165 T 500 165 L 500 260 L 20 260 Z" fill="#dff0ea" stroke="#3a7" stroke-width="1.6"/><rect x="215" y="138" width="78" height="46" rx="3" fill="#e2eaf0" stroke="#111" stroke-width="2"/><line x1="232.0" y1="138.0" x2="232.0" y2="128.0" stroke="#111" stroke-width="1.5"/><line x1="255.0" y1="138.0" x2="255.0" y2="128.0" stroke="#111" stroke-width="1.5"/><line x1="278.0" y1="138.0" x2="278.0" y2="128.0" stroke="#111" stroke-width="1.5"/><text x="254.0" y="205.0" font-family="DejaVu Sans, Arial, sans-serif" font-size="10" font-weight="normal" fill="#111" text-anchor="middle">perforated float:  CaC2 + Ca3P2</text><text x="254.0" y="222.0" font-family="DejaVu Sans, Arial, sans-serif" font-size="9" font-weight="normal" fill="#333" text-anchor="middle">Ca3P2 + 6 H2O -&gt; 3 Ca(OH)2 + 2 PH3</text><text x="254.0" y="238.0" font-family="DejaVu Sans, Arial, sans-serif" font-size="9" font-weight="normal" fill="#333" text-anchor="middle">CaC2 + 2 H2O -&gt; Ca(OH)2 + C2H2</text><path d="M 244 136 Q 254 96 264 136 Z" fill="#ffb84d" stroke="#e8990b" stroke-width="1.3"/><path d="M 249 136 Q 254 114 259 136 Z" fill="#8fd0ff" stroke="none" stroke-width="2.0"/><text x="254.0" y="88.0" font-family="DejaVu Sans, Arial, sans-serif" font-size="9.5" font-weight="normal" fill="#c0392b" text-anchor="middle">gas ignites (trace P2H4)  -&gt;  bright flame + smoke  =  signal</text><text x="254.0" y="288.0" font-family="DejaVu Sans, Arial, sans-serif" font-size="9.5" font-weight="normal" fill="#555" text-anchor="middle">marks the position of buoys / life-belts at sea</text></svg>