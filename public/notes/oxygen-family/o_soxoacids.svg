.0" y="173.5" font-family="DejaVu Sans, Arial, sans-serif" font-size="10" font-weight="bold" fill="#111" text-anchor="middle">O</text><text x="349.0" y="183.0" font-family="DejaVu Sans, Arial, sans-serif" font-size="9" font-weight="normal" fill="#111" text-anchor="start">H</text><circle cx="340.0" cy="120.0" r="11" fill="#fff2cc" stroke="#111" stroke-width="1.6"/><text x="340.0" y="125.2" font-family="DejaVu Sans, Arial, sans-serif" font-size="15" font-weight="bold" fill="#111" text-anchor="middle">S</text><text x="560.0" y="46.0" font-family="DejaVu Sans, Arial, sans-serif" font-size="11.5" font-weight="bold" fill="#111" text-anchor="middle">H2S2O3  (thio)</text><text x="560.0" y="62.0" font-family="DejaVu Sans, Arial, sans-serif" font-size="10" font-weight="normal" fill="#555" text-anchor="middle">one O of SO4 2- -&gt; S</text><line x1="556.8" y1="108.0" x2="556.8" y2="86.0" stroke="#111" stroke-width="1.7"/><line x1="563.2" y1="108.0" x2="563.2" y2="86.0" stroke="#111" stroke-width="1.7"/><circle cx="560.0" cy="74.0" r="8" fill="#fde2e2" stroke="#111" stroke-width="1.6"/><text x="560.0" y="77.5" font-family="DejaVu Sans, Arial, sans-serif" font-size="10" font-weight="bold" fill="#111" text-anchor="middle">O</text><line x1="549.2" y1="125.2" x2="524.8" y2="136.8" stroke="#111" stroke-width="1.7"/><circle cx="514.0" cy="142.0" r="8" fill="#fde2e2" stroke="#111" stroke-width="1.6"/><text x="514.0" y="145.5" font-family="DejaVu Sans, Arial, sans-serif" font-size="10" font-weight="bold" fill="#111" text-anchor="middle">O</text><text x="523.0" y="155.0" font-family="DejaVu Sans, Arial, sans-serif" font-size="9" font-weight="normal" fill="#111" text-anchor="start">H</text><line x1="570.8" y1="125.2" x2="595.2" y2="136.8" stroke="#111" stroke-width="1.7"/><circle cx="606.0" cy="142.0" r="8" fill="#fde2e2" stroke="#111" stroke-width="1.6"/><text x="606.0" y="145.5" font-family="DejaVu Sans, Arial, sans-serif" font-size="10" font-weight="bold" fill="#111" text-anchor="middle">O</text><text x="615.0" y="155.0" font-family="DejaVu Sans, Arial, sans-serif" font-size="9" font-weight="normal" fill="#111" text-anchor="start">H</text><line x1="563.2" y1="132.0" x2="563.2" y2="158.0" stroke="#111" stroke-width="1.7"/><line x1="556.8" y1="132.0" x2="556.8" y2="158.0" stroke="#111" stroke-width="1.7"/><circle cx="560.0" cy="170.0" r="8" fill="#fff2cc" stroke="#111" stroke-width="1.6"/><text x="560.0" y="173.5" font-family="DejaVu Sans, Arial, sans-serif" font-size="10" font-weight="bold" fill="#111" text-anchor="middle">S</text><circle cx="560.0" cy="120.0" r="11" fill="#fff2cc" stroke="#111" stroke-width="1.6"/><text x="560.0" y="125.2" font-family="DejaVu Sans, Arial, sans-serif" font-size="15" font-weight="bold" fill="#111" text-anchor="middle">S</text><text x="60.0" y="235.0" font-family="DejaVu Sans, Arial, sans-serif" font-size="10.5" font-weight="normal" fill="#333" text-anchor="start">S-S bond in:  S2O3 2-, S2O4 2-, S2O5 2-, S2O6 2-, SnO6 2-   (thio / dithionous / meta / dithionic / polythionic)</text><text x="60.0" y="258.0" font-family="DejaVu Sans, Arial, sans-serif" font-size="10.5" font-weight="normal" fill="#333" text-anchor="start">peroxo (-O-O-) in:  H2SO5 (Caro's, 1 -O-O-H)   and   H2S2O8 (Marshall's, S-O-O-S)</text><text x="60.0" y="281.0" font-family="DejaVu Sans, Arial, sans-serif" font-size="10.5" font-weight="normal" fill="#333" text-anchor="start">NO S-S bond in:  H2S2O7 (pyrosulphuric / oleum)  --&gt;  it has an S-O-S bridge</text><text x="60.0" y="304.0" font-family="DejaVu Sans, Arial, sans-serif" font-size="10.5" font-weight="normal" fill="#333" text-anchor="start">H2S2O8 + H2O -&gt; H2SO4 + H2SO5 ;   H2SO5 + H2O -&gt; H2SO4 + H2O2</text><text x="60.0" y="350.0" font-family="DejaVu Sans, Arial, sans-serif" font-size="11.5" font-weight="bold" fill="#111" text-anchor="start">basicity = number of S-OH groups   (H2SO3, H2SO4 both dibasic)</text><text x="60.0" y="373.0" font-family="DejaVu Sans, Arial, sans-serif" font-size="11.5" font-weight="normal" fill="#111" text-anchor="start">reducing power comes from S in a LOW state (H2SO3, H2S2O4);</text><text x="60.0" y="396.0" font-family="DejaVu Sans, Arial, sans-serif" font-size="11.5" font-weight="normal" fill="#111" text-anchor="start">oxidising power comes from a PEROXO link (H2SO5, H2S2O8).</text></svg>