<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 460" width="900" height="460"><rect x="0" y="0" width="900" height="460" fill="#0a0c11"/><text x="450.0" y="22.0" text-anchor="middle" font-family='Inter,Arial,sans-serif' font-size="11.5" font-weight="800" fill="#7cc4ff" style="letter-spacing:1.6px;">HYDRATED CATIONS</text><text x="450.0" y="70.0" text-anchor="middle" font-family='Inter,Arial,sans-serif' font-size="22" font-weight="800" fill="#ffffff" style="">Fe³⁺(aq) ≫ Fe²⁺(aq) in acidity: charge density sets the barrier</text><line x1="90.0" y1="366.0" x2="90.0" y2="154.0" stroke="#9fb2c4" stroke-width="2" stroke-linecap="round"/><path d="M 90 340 L 220 190 L 340 270" stroke="#ff775d" stroke-width="3" fill="none"/><text x="220.0" y="165.0" text-anchor="middle" font-family='Inter,Arial,sans-serif' font-size="13" font-weight="600" fill="#ff775d" style="">‡ (lower)</text><text x="90.0" y="405.0" text-anchor="middle" font-family='Inter,Arial,sans-serif' font-size="13" font-weight="600" fill="#ffffff" style="">[Fe(H₂O)₆]³⁺</text><text x="340.0" y="300.0" text-anchor="middle" font-family='Inter,Arial,sans-serif' font-size="12" font-weight="600" fill="#ffffff" style="">pKa ≈ 2.2</text><line x1="480.0" y1="366.0" x2="480.0" y2="154.0" stroke="#9fb2c4" stroke-width="2" stroke-linecap="round"/><path d="M 480 340 L 610 240 L 730 300" stroke="#50dc7b" stroke-width="3" fill="none"/><text x="610.0" y="215.0" text-anchor="middle" font-family='Inter,Arial,sans-serif' font-size="13" font-weight="600" fill="#50dc7b" style="">‡ (higher)</text><text x="480.0" y="405.0" text-anchor="middle" font-family='Inter,Arial,sans-serif' font-size="13" font-weight="600" fill="#ffffff" style="">[Fe(H₂O)₆]²⁺</text><text x="730.0" y="330.0" text-anchor="middle" font-family='Inter,Arial,sans-serif' font-size="12" font-weight="600" fill="#ffffff" style="">pKa ≈ 9.5</text><text x="450.0" y="420.0" text-anchor="middle" font-family='Inter,Arial,sans-serif' font-size="14" font-weight="400" fill="#9fb2c4" style="font-style:italic;">Fe³⁺'s higher charge/smaller radius polarises coordinated O–H far more strongly,</text><text x="450.0" y="441.0" text-anchor="middle" font-family='Inter,Arial,sans-serif' font-size="14" font-weight="400" fill="#9fb2c4" style="font-style:italic;">lowering the proton-transfer barrier and pushing the equilibrium toward the hydroxo ion.</text></svg>