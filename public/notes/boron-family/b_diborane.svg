<svg xmlns="http://www.w3.org/2000/svg" width="600" height="334" viewBox="0 0 600 334" font-family="'Inter','Helvetica Neue',Arial,'DejaVu Sans',sans-serif"><rect width="600" height="334" fill="#0a0c11"/><g stroke="#141a24" stroke-width="1"><line x1="34" y1="0" x2="34" y2="334"/><line x1="68" y1="0" x2="68" y2="334"/><line x1="102" y1="0" x2="102" y2="334"/><line x1="136" y1="0" x2="136" y2="334"/><line x1="170" y1="0" x2="170" y2="334"/><line x1="204" y1="0" x2="204" y2="334"/><line x1="238" y1="0" x2="238" y2="334"/><line x1="272" y1="0" x2="272" y2="334"/><line x1="306" y1="0" x2="306" y2="334"/><line x1="340" y1="0" x2="340" y2="334"/><line x1="374" y1="0" x2="374" y2="334"/><line x1="408" y1="0" x2="408" y2="334"/><line x1="442" y1="0" x2="442" y2="334"/><line x1="476" y1="0" x2="476" y2="334"/><line x1="510" y1="0" x2="510" y2="334"/><line x1="544" y1="0" x2="544" y2="334"/><line x1="578" y1="0" x2="578" y2="334"/><line x1="0" y1="34" x2="600" y2="34"/><line x1="0" y1="68" x2="600" y2="68"/><line x1="0" y1="102" x2="600" y2="102"/><line x1="0" y1="136" x2="600" y2="136"/><line x1="0" y1="170" x2="600" y2="170"/><line x1="0" y1="204" x2="600" y2="204"/><line x1="0" y1="238" x2="600" y2="238"/><line x1="0" y1="272" x2="600" y2="272"/><line x1="0" y1="306" x2="600" y2="306"/></g><rect x="8" y="8" width="584" height="318" fill="none" stroke="#232a36" stroke-width="1"/><path d="M 8 15 L 8 8 L 15 8" stroke="#4db8e8" stroke-width="1.4" fill="none"/><path d="M 592 15 L 592 8 L 585 8" stroke="#4db8e8" stroke-width="1.4" fill="none"/><path d="M 8 319 L 8 326 L 15 326" stroke="#4db8e8" stroke-width="1.4" fill="none"/><path d="M 592 319 L 592 326 L 585 326" stroke="#4db8e8" stroke-width="1.4" fill="none"/><text x="20" y="18" font-size="8.5" font-weight="bold" fill="#4db8e8" text-anchor="start" font-family="'SF Mono','DejaVu Sans Mono',ui-monospace,Menlo,monospace" letter-spacing="0.24em">SYNERGIC BOND</text><path d="M 568 12 l 6 6 l -6 6 l -6 -6 z" fill="none" stroke="#63d39b" stroke-width="1.2"/><text x="20" y="40" font-size="16" font-weight="bold" fill="#f4ecd9" text-anchor="start" font-family="'Georgia','Times New Roman',serif">Diborane, B₂H₆  —  laboratory routes</text><line x1="20" y1="42" x2="580" y2="42" stroke="#232a36" stroke-width="1"/><g transform="translate(0,34)"><rect x="60" y="80" width="220" height="96" rx="6" fill="none" stroke="#4db8e8" stroke-width="2"/><text x="170.0" y="70.0" font-size="8.6" font-weight="normal" fill="#4db8e8" text-anchor="middle">industrial / large scale</text><text x="170.0" y="112.0" font-size="9.5" font-weight="normal" fill="#dbe3ef" text-anchor="middle">3 NaBH₄ + 4 BF₃|OEt₂</text><text x="170.0" y="134.0" font-size="9.5" font-weight="normal" fill="#63d39b" text-anchor="middle">→  2 B₂H₆ + 3 NaBF₄</text><text x="170.0" y="158.0" font-size="8" font-weight="normal" fill="#8b98ac" text-anchor="middle">(diglyme solvent)</text><rect x="320" y="80" width="220" height="96" rx="6" fill="none" stroke="#4db8e8" stroke-width="2"/><text x="430.0" y="70.0" font-size="8.6" font-weight="normal" fill="#4db8e8" text-anchor="middle">small scale</text><text x="430.0" y="112.0" font-size="9" font-weight="normal" fill="#dbe3ef" text-anchor="middle">2 NaBH₄ + I₂  →  B₂H₆ + 2 NaI + H₂</text><text x="430.0" y="138.0" font-size="9" font-weight="normal" fill="#63d39b" text-anchor="middle">2 BF₃ + 6 NaH  →  B₂H₆ + 6 NaF</text><text x="430.0" y="158.0" font-size="8" font-weight="normal" fill="#8b98ac" text-anchor="middle">(430-450 K)</text><text x="300.0" y="222.0" font-size="10" font-weight="bold" fill="#dbe3ef" text-anchor="middle">B₂H₆ ignites spontaneously in air — handled on a greaseless vacuum line</text><text x="300.0" y="246.0" font-size="9" font-weight="normal" fill="#8b98ac" text-anchor="middle">collected by trap-to-trap fractionation (b.p. 181 K); never over water — it hydrolyses to H₃BO₃ + H₂</text></g></svg>