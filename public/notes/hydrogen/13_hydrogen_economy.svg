<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900"><defs>
  <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#030712"/><stop offset="0.55" stop-color="#071426"/><stop offset="1" stop-color="#120a24"/></linearGradient>
  <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0"><stop stop-color="#43e6ff"/><stop offset="0.5" stop-color="#9b8cff"/><stop offset="1" stop-color="#ffb65c"/></linearGradient>
  <filter id="glow"><feGaussianBlur stdDeviation="6" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
  <style>
    .title{font:800 44px Inter,Arial,sans-serif;fill:#f8fafc} .sub{font:400 22px Inter,Arial,sans-serif;fill:#b9c6d8}
    .h{font:750 26px Inter,Arial,sans-serif;fill:#69e7ff} .t{font:400 21px Inter,Arial,sans-serif;fill:#d8e1ee}
    .small{font:400 17px Inter,Arial,sans-serif;fill:#aebbd0} .tiny{font:400 15px Inter,Arial,sans-serif;fill:#8ba0b8}
    .gold{fill:#ffc866} .violet{fill:#b9a2ff} .cyan{fill:#62e8ff} .coral{fill:#ff9c7a} .green{fill:#7be6ab}
    .panel{fill:#07111f;stroke:#284563;stroke-width:2} .panel2{fill:#0d1023;stroke:#5f4a88;stroke-width:2}
    .line{stroke:#63e6ff;stroke-width:4;fill:none} .dash{stroke:#b69cff;stroke-width:4;stroke-dasharray:12 10;fill:none}
    .bond{stroke:#e8f1fb;stroke-width:5} .thin{stroke:#6f829a;stroke-width:2;fill:none}
  </style>
</defs>
<rect width="1600" height="900" fill="url(#bg)"/><rect x="44" y="34" width="1512" height="832" rx="34" fill="none" stroke="#17324d" stroke-width="2"/><text x="78" y="96" class="title">The Hydrogen Economy and Fuel Cells</text><rect x="78" y="118" width="430" height="5" rx="3" fill="url(#accent)"/><text x="78" y="158" class="sub">Production, storage and clean energy release</text><rect x="78" y="210" width="450" height="120" rx="16" fill="#0d1023" stroke="#62e8ff" stroke-width="2"/><text x="108" y="254" class="h" style="fill:#62e8ff">Source</text><text x="108" y="284" class="small">reforming, electrolysis,</text><text x="108" y="306" class="small">or other production</text><rect x="568" y="210" width="450" height="120" rx="16" fill="#0d1023" stroke="#7be6ab" stroke-width="2"/><text x="598" y="254" class="h" style="fill:#7be6ab">Storage</text><text x="598" y="284" class="small">compressed gas, liquid H₂,</text><text x="598" y="306" class="small">or metal-hydride store</text><rect x="1058" y="210" width="450" height="120" rx="16" fill="#0d1023" stroke="#ffc866" stroke-width="2"/><text x="1088" y="254" class="h" style="fill:#ffc866">Use</text><text x="1088" y="284" class="small">fuel cell (electricity)</text><text x="1088" y="306" class="small">or direct combustion</text><line x1="528" y1="270" x2="568" y2="270" stroke="#62e8ff" stroke-width="4"/><path d="M 568 270 L 556 277 L 556 263 Z" fill="#62e8ff"/><line x1="1018" y1="270" x2="1058" y2="270" stroke="#62e8ff" stroke-width="4"/><path d="M 1058 270 L 1046 277 L 1046 263 Z" fill="#62e8ff"/><rect x="78" y="380" width="1460" height="300" rx="26" class="panel"/><text x="112" y="430" class="h">The fuel cell — inside the electrochemistry</text><rect x="120" y="450" width="300" height="130" rx="14" fill="#0d1023" stroke="#62e8ff" stroke-width="2"/><text x="270" y="490" class="h" text-anchor="middle" style="fill:#62e8ff;font-size:22px">Anode (-)</text><text x="270" y="530" class="t" text-anchor="middle">H₂ → 2 H⁺ + 2 e⁻</text><rect x="1140" y="450" width="360" height="130" rx="14" fill="#0d1023" stroke="#ff9c7a" stroke-width="2"/><text x="1320" y="490" class="h" text-anchor="middle" style="fill:#ff9c7a;font-size:22px">Cathode (+)</text><text x="1320" y="530" class="t" text-anchor="middle">O₂ + 4 H⁺ + 4 e⁻ → 2 H₂O</text><line x1="420" y1="490" x2="1140" y2="490" stroke="#ffc866" stroke-width="4"/><path d="M 1140 490 L 1128 497 L 1128 483 Z" fill="#ffc866"/><text x="780" y="470" class="small" text-anchor="middle">e⁻ through external circuit → electrical energy</text><text x="780" y="620" class="t" text-anchor="middle" style="font-weight:700">overall:  2 H₂ + O₂ → 2 H₂O</text><rect x="78" y="710" width="1460" height="90" rx="14" fill="#0a2630" stroke="#2aaec0"/><text x="100" y="761.0" class="small">Hydrogen has very high energy density per unit mass, but low density per unit volume — storage and transport remain the major engineering challenges of the hydrogen economy.</text></svg>