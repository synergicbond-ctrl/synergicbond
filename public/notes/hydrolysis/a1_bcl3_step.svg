" style="">2</text><text x="86.0" y="436.0" text-anchor="start" font-family='Inter,Arial,sans-serif' font-size="19" font-weight="800" fill="#ffffff" style="">Repeat twice more at the remaining B–Cl bonds</text><text x="380.0" y="560.0" text-anchor="middle" font-family='Inter,Arial,sans-serif' font-size="20" font-weight="600" fill="#ffffff" style="">BCl₃ + 3H₂O  →  B(OH)₃ + 3HCl</text><text x="380.0" y="620.0" text-anchor="middle" font-family='Inter,Arial,sans-serif' font-size="14" font-weight="400" fill="#9fb2c4" style="font-style:italic;">Each step is an identical attack-and-leave cycle at boron; three repeats replace all</text><text x="380.0" y="641.0" text-anchor="middle" font-family='Inter,Arial,sans-serif' font-size="14" font-weight="400" fill="#9fb2c4" style="font-style:italic;">three chlorides, giving boric acid + 3HCl overall.</text></svg>