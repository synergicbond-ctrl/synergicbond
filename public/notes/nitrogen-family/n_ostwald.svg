<svg xmlns="http://www.w3.org/2000/svg" width="680" height="310" viewBox="0 0 680 310" font-family="DejaVu Sans, Arial, sans-serif"><rect x="0" y="0" width="680" height="310" fill="white"/><text x="340.0" y="22.0" font-family="DejaVu Sans, Arial, sans-serif" font-size="17" font-weight="bold" fill="#111" text-anchor="middle">Ostwald process for nitric acid</text><rect x="60" y="66" width="250" height="48" rx="4" fill="none" stroke="#111" stroke-width="1.6"/><text x="185.0" y="87.0" font-family="DejaVu Sans, Arial, sans-serif" font-size="11" font-weight="normal" fill="#111" text-anchor="middle">4 NH3 + 5 O2   -&gt;</text><text x="185.0" y="105.0" font-family="DejaVu Sans, Arial, sans-serif" font-size="11" font-weight="bold" fill="#111" text-anchor="middle">4 NO + 6 H2O</text><text x="330.0" y="93.0" font-family="DejaVu Sans, Arial, sans-serif" font-size="10.5" font-weight="normal" fill="#555" text-anchor="start">Pt/Rh gauze, 500 K, 9 bar</text><rect x="60" y="138" width="250" height="48" rx="4" fill="none" stroke="#111" stroke-width="1.6"/><text x="185.0" y="159.0" font-family="DejaVu Sans, Arial, sans-serif" font-size="11" font-weight="normal" fill="#111" text-anchor="middle">2 NO + O2   -&gt;</text><text x="185.0" y="177.0" font-family="DejaVu Sans, Arial, sans-serif" font-size="11" font-weight="bold" fill="#111" text-anchor="middle">2 NO2</text><text x="330.0" y="165.0" font-family="DejaVu Sans, Arial, sans-serif" font-size="10.5" font-weight="normal" fill="#555" text-anchor="start">on cooling</text><rect x="60" y="210" width="250" height="48" rx="4" fill="none" stroke="#111" stroke-width="1.6"/><text x="185.0" y="231.0" font-family="DejaVu Sans, Arial, sans-serif" font-size="11" font-weight="normal" fill="#111" text-anchor="middle">3 NO2 + H2O   -&gt;</text><text x="185.0" y="249.0" font-family="DejaVu Sans, Arial, sans-serif" font-size="11" font-weight="bold" fill="#111" text-anchor="middle">2 HNO3 + NO</text><text x="330.0" y="237.0" font-family="DejaVu Sans, Arial, sans-serif" font-size="10.5" font-weight="normal" fill="#555" text-anchor="start">absorption tower;  NO recycled</text><line x1="185.0" y1="66.0" x2="185.0" y2="82.0" stroke="#111" stroke-width="2"/><line x1="185.0" y1="82.0" x2="190.4" y2="89.2" stroke="#111" stroke-width="2"/><line x1="185.0" y1="82.0" x2="179.6" y2="89.2" stroke="#111" stroke-width="2"/><line x1="185.0" y1="138.0" x2="185.0" y2="154.0" stroke="#111" stroke-width="2"/><line x1="185.0" y1="154.0" x2="190.4" y2="161.2" stroke="#111" stroke-width="2"/><line x1="185.0" y1="154.0" x2="179.6" y2="161.2" stroke="#111" stroke-width="2"/><text x="340.0" y="265.0" font-family="DejaVu Sans, Arial, sans-serif" font-size="10.8" font-weight="normal" fill="#333" text-anchor="middle">tower acid ~68% HNO3 (azeotrope) ;  conc. to 98% with conc. H2SO4 / Mg(NO3)2.</text></svg>