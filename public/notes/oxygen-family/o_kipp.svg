<svg xmlns="http://www.w3.org/2000/svg" width="440" height="400" viewBox="0 0 440 400" font-family="DejaVu Sans, Arial, sans-serif"><rect x="0" y="0" width="440" height="400" fill="white"/><text x="220.0" y="22.0" font-family="DejaVu Sans, Arial, sans-serif" font-size="17" font-weight="bold" fill="#111" text-anchor="middle">Kipp's apparatus  (H2S on demand)</text><ellipse cx="200" cy="100" rx="70" ry="55" fill="#eef6ff" stroke="#111" stroke-width="2"/><ellipse cx="200" cy="230" rx="70" ry="60" fill="#eef6ff" stroke="#111" stroke-width="2"/><path d="M 150 300 Q 200 360 250 300" fill="#eef6ff" stroke="#111" stroke-width="2"/><line x1="150.0" y1="300.0" x2="150.0" y2="155.0" stroke="#111" stroke-width="2"/><line x1="250.0" y1="300.0" x2="250.0" y2="155.0" stroke="#111" stroke-width="2"/><line x1="200.0" y1="145.0" x2="200.0" y2="320.0" stroke="#111" stroke-width="2"/><text x="200.0" y="100.0" font-family="DejaVu Sans, Arial, sans-serif" font-size="9.5" font-weight="normal" fill="#111" text-anchor="middle">dil. H2SO4</text><text x="200.0" y="232.0" font-family="DejaVu Sans, Arial, sans-serif" font-size="9.5" font-weight="normal" fill="#111" text-anchor="middle">FeS lumps</text><text x="200.0" y="320.0" font-family="DejaVu Sans, Arial, sans-serif" font-size="8.5" font-weight="normal" fill="#555" text-anchor="middle">acid</text><path d="M 270.0 230.0 L 320.0 230.0" fill="none" stroke="#111" stroke-width="2"/><rect x="315" y="222" width="16" height="16" rx="4" fill="none" stroke="#111" stroke-width="1.6"/><text x="345.0" y="233.0" font-family="DejaVu Sans, Arial, sans-serif" font-size="9" font-weight="normal" fill="#555" text-anchor="start">tap</text><text x="360.0" y="250.0" font-family="DejaVu Sans, Arial, sans-serif" font-size="12" font-weight="bold" fill="#c0392b" text-anchor="start">H2S</text><text x="200.0" y="372.0" font-family="DejaVu Sans, Arial, sans-serif" font-size="9" font-weight="normal" fill="#333" text-anchor="middle">tap open -&gt; acid rises onto FeS -&gt; FeS + H2SO4 -&gt; FeSO4 + H2S</text><text x="200.0" y="388.0" font-family="DejaVu Sans, Arial, sans-serif" font-size="9" font-weight="normal" fill="#555" text-anchor="middle">tap shut -&gt; gas pressure pushes acid back down -&gt; reaction stops</text></svg>