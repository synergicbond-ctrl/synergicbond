<svg xmlns="http://www.w3.org/2000/svg" width="600" height="300" viewBox="0 0 600 300" font-family="DejaVu Sans, Arial, sans-serif"><rect x="0" y="0" width="600" height="300" fill="white"/><text x="300.0" y="22.0" font-family="DejaVu Sans, Arial, sans-serif" font-size="17" font-weight="bold" fill="#111" text-anchor="middle">Ozoniser  (silent electric discharge)</text><rect x="120" y="110" width="320" height="70" rx="8" fill="#eef6ff" stroke="#111" stroke-width="2"/><rect x="150" y="128" width="260" height="34" rx="4" fill="#eaf2ff" stroke="#111" stroke-width="1.4"/><text x="280.0" y="150.0" font-family="DejaVu Sans, Arial, sans-serif" font-size="9" font-weight="normal" fill="#555" text-anchor="middle">inner + outer tin-foil electrodes</text><path d="M 150.0 128.0 L 150.0 80.0 L 120.0 80.0" fill="none" stroke="#111" stroke-width="2"/><text x="108.0" y="80.0" font-family="DejaVu Sans, Arial, sans-serif" font-size="9" font-weight="normal" fill="#111" text-anchor="end">~10 kV</text><path d="M 410.0 162.0 L 410.0 205.0 L 440.0 205.0" fill="none" stroke="#111" stroke-width="2"/><text x="90.0" y="145.0" font-family="DejaVu Sans, Arial, sans-serif" font-size="10" font-weight="normal" fill="#111" text-anchor="end">dry O2</text><path d="M 90.0 145.0 L 120.0 145.0" fill="none" stroke="#111" stroke-width="2"/><path d="M 440.0 145.0 L 475.0 145.0" fill="none" stroke="#111" stroke-width="2"/><text x="482.0" y="148.0" font-family="DejaVu Sans, Arial, sans-serif" font-size="10" font-weight="normal" fill="#c0392b" text-anchor="start">~10% O3</text><text x="280.0" y="55.0" font-family="DejaVu Sans, Arial, sans-serif" font-size="12" font-weight="bold" fill="#111" text-anchor="start">3 O2  &lt;=&gt;  2 O3      dH(298 K) = +142 kJ  (endothermic)</text><text x="280.0" y="74.0" font-family="DejaVu Sans, Arial, sans-serif" font-size="9.5" font-weight="normal" fill="#555" text-anchor="start">SILENT discharge -&gt; no heating -&gt; O3 not decomposed back</text><text x="280.0" y="240.0" font-family="DejaVu Sans, Arial, sans-serif" font-size="9.5" font-weight="normal" fill="#555" text-anchor="middle">pure O3: condense the ozonised oxygen in liquid O2 (b.p. 161 K)</text></svg>