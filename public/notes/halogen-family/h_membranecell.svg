ERGIC BOND</text><path d="M 568 12 l 6 6 l -6 6 l -6 -6 z" fill="none" stroke="#63d39b" stroke-width="1.2"/><text x="20" y="40" font-size="16" font-weight="bold" fill="#f4ecd9" text-anchor="start" font-family="'Georgia','Times New Roman',serif">Chlor-alkali membrane cell  (manufacture of Cl₂, H₂, NaOH)</text><line x1="20" y1="42" x2="580" y2="42" stroke="#232a36" stroke-width="1"/><g transform="translate(0,34)"><rect x="120" y="90" width="360" height="150" rx="4" fill="none" stroke="#232a36" stroke-width="2"/><line x1="300.0" y1="90.0" x2="300.0" y2="240.0" stroke="#dbe3ef" stroke-width="2" stroke-linecap="round" stroke-dasharray="5,4"/><text x="300.0" y="82.0" font-size="8.5" font-weight="normal" fill="#8b98ac" text-anchor="middle">ion-selective membrane</text><rect x="180" y="110" width="12" height="110" rx="4" fill="#93a1b5" stroke="#232a36" stroke-width="1.6"/><text x="186.0" y="258.0" font-size="8.5" font-weight="normal" fill="#dbe3ef" text-anchor="middle">anode (+)</text><rect x="408" y="110" width="12" height="110" rx="4" fill="#5b6675" stroke="#232a36" stroke-width="1.6"/><text x="414.0" y="258.0" font-size="8.5" font-weight="normal" fill="#dbe3ef" text-anchor="middle">cathode (-)</text><text x="210.0" y="140.0" font-size="9" font-weight="normal" fill="#dbe3ef" text-anchor="start">brine  NaCl(aq)</text><text x="370.0" y="140.0" font-size="9" font-weight="normal" fill="#dbe3ef" text-anchor="start">dilute NaOH</text><path d="M 186.0 90.0 L 186.0 60.0 L 150.0 60.0" fill="none" stroke="#dbe3ef" stroke-width="2" stroke-linejoin="round"/><text x="140.0" y="60.0" font-size="11" font-weight="bold" fill="#63d39b" text-anchor="end">Cl₂</text><path d="M 414.0 90.0 L 414.0 60.0 L 450.0 60.0" fill="none" stroke="#dbe3ef" stroke-width="2" stroke-linejoin="round"/><text x="460.0" y="60.0" font-size="11" font-weight="bold" fill="#ff8f6e" text-anchor="start">H₂</text><text x="414.0" y="232.0" font-size="8.5" font-weight="normal" fill="#93a1b5" text-anchor="middle">conc. NaOH out</text><text x="300.0" y="322.0" font-size="12" font-weight="bold" fill="#dbe3ef" text-anchor="start">2 NaCl + 2 H₂O  --electrolysis→  2 NaOH + H₂ + Cl₂</text><text x="300.0" y="285.0" font-size="8.8" font-weight="normal" fill="#8b98ac" text-anchor="middle">Na⁺ passes through the membrane;  Cl⁻ oxidised at the anode, H₂O reduced at the cathode</text></g></svg>