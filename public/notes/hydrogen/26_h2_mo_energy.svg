<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900" role="img" aria-labelledby="title desc">
<title id="title">Molecular-Orbital Picture of Dihydrogen</title><desc id="desc">From two 1s atomic orbitals to bond order and magnetic behaviour</desc>
<defs>
  <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#030712"/><stop offset="0.55" stop-color="#071426"/><stop offset="1" stop-color="#120a24"/></linearGradient>
  <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0"><stop stop-color="#43e6ff"/><stop offset="0.5" stop-color="#9b8cff"/><stop offset="1" stop-color="#ffb65c"/></linearGradient>
  <filter id="glow"><feGaussianBlur stdDeviation="6" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
  <style>
    .title{font:800 52px Inter,Arial,sans-serif;fill:#f8fafc} .sub{font:400 24px Inter,Arial,sans-serif;fill:#b9c6d8}
    .h{font:750 28px Inter,Arial,sans-serif;fill:#69e7ff} .t{font:400 22px Inter,Arial,sans-serif;fill:#d8e1ee}
    .small{font:400 18px Inter,Arial,sans-serif;fill:#aebbd0} .gold{fill:#ffc866} .violet{fill:#b9a2ff} .cyan{fill:#62e8ff}
    .panel{fill:#07111f;stroke:#284563;stroke-width:2} .panel2{fill:#0d1023;stroke:#5f4a88;stroke-width:2}
    .line{stroke:#63e6ff;stroke-width:4;fill:none} .dash{stroke:#b69cff;stroke-width:4;stroke-dasharray:12 10;fill:none}
    .bond{stroke:#e8f1fb;stroke-width:5} .thin{stroke:#6f829a;stroke-width:2;fill:none}
  </style>
</defs>
<rect width="1600" height="900" fill="url(#bg)"/>
<rect x="44" y="34" width="1512" height="832" rx="34" fill="none" stroke="#17324d" stroke-width="2"/>
<text x="78" y="105" class="title">Molecular-Orbital Picture of Dihydrogen</text>
<rect x="78" y="128" width="430" height="5" rx="3" fill="url(#accent)"/>
<text x="78" y="172" class="sub">From two 1s atomic orbitals to bond order and magnetic behaviour</text>

<rect x="78" y="220" width="720" height="560" rx="28" class="panel"/>
<text x="112" y="270" class="h">AO combination and energy ordering</text>
<text x="135" y="365" class="t">H(1s)</text><circle cx="190" cy="450" r="76" fill="#0e3b70" stroke="#62e8ff" stroke-width="4" filter="url(#glow)"/><circle cx="190" cy="450" r="12" fill="#f8fafc"/>
<text x="328" y="458" class="title" style="font-size:46px">+</text>
<text x="420" y="365" class="t">H(1s)</text><circle cx="475" cy="450" r="76" fill="#0e3b70" stroke="#62e8ff" stroke-width="4" filter="url(#glow)"/><circle cx="475" cy="450" r="12" fill="#f8fafc"/>
<path d="M585 450 H700" class="line"/><path d="M700 450 l-22 -14 v28 z" fill="#62e8ff"/>
<line x1="535" y1="705" x2="535" y2="300" class="thin"/><path d="M535 300 l-10 20 h20 z" fill="#8ba0b8"/><text x="500" y="330" class="small" transform="rotate(-90 500 330)">Energy</text>
<line x1="610" y1="620" x2="745" y2="620" stroke="#62e8ff" stroke-width="6"/><text x="620" y="666" class="t">σ1s bonding</text><text x="655" y="604" class="t">↑↓</text>
<line x1="610" y1="345" x2="745" y2="345" stroke="#b9a2ff" stroke-width="6"/><text x="598" y="320" class="t">σ*1s antibonding</text>
<path d="M550 450 L610 620 M550 450 L610 345" class="thin"/>
<rect x="835" y="220" width="687" height="560" rx="28" class="panel2"/>
<text x="872" y="270" class="h">Bond order and magnetic behaviour</text>
<text x="880" y="340" class="t">H₂: (σ1s)²</text><text x="880" y="385" class="t">Bond order = ½(2 − 0) = 1</text><text x="880" y="430" class="t">All electrons paired → diamagnetic</text>
<line x1="875" y1="465" x2="1480" y2="465" class="thin"/>
<text x="880" y="525" class="t violet">H₂⁺: (σ1s)¹</text><text x="880" y="570" class="t">Bond order = ½; one unpaired electron → paramagnetic</text>
<text x="880" y="635" class="t gold">He₂: (σ1s)²(σ*1s)²</text><text x="880" y="680" class="t">Bond order = 0; no net bond; not stable</text>
<rect x="875" y="710" width="585" height="48" rx="14" fill="#0a2630" stroke="#2aaec0"/><text x="900" y="742" class="small">MOT explains stability, bond order and magnetism in one framework.</text>

</svg>