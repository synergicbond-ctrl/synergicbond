cx="200" cy="288" r="22" fill="#231a37" stroke="#c6a6ff" stroke-width="2.2"/><text x="200.0" y="292.5" font-size="13" font-weight="bold" fill="#c6a6ff" text-anchor="middle">P</text><text x="196.0" y="328.0" font-size="8" font-weight="normal" fill="#5c6a7e" text-anchor="middle">regular tetrahedron — all four P equivalent</text><rect x="356" y="92" width="190" height="150" rx="8" fill="#0f1219" stroke="#232a36" stroke-width="1.3"/><text x="451.0" y="112.0" font-size="10" font-weight="bold" fill="#f4ecd9" text-anchor="middle">P₄ molecule</text><text x="368.0" y="134.0" font-size="8" font-weight="normal" fill="#93a1b5" text-anchor="start">geometry</text><text x="534.0" y="134.0" font-size="8" font-weight="normal" fill="#dbe3ef" text-anchor="end">tetrahedral</text><text x="368.0" y="151.0" font-size="8" font-weight="normal" fill="#93a1b5" text-anchor="start">∠ P–P–P</text><text x="534.0" y="151.0" font-size="8" font-weight="normal" fill="#dbe3ef" text-anchor="end">60°</text><text x="368.0" y="168.0" font-size="8" font-weight="normal" fill="#93a1b5" text-anchor="start">P–P length</text><text x="534.0" y="168.0" font-size="8" font-weight="normal" fill="#dbe3ef" text-anchor="end">2.21 Å</text><text x="368.0" y="185.0" font-size="8" font-weight="normal" fill="#93a1b5" text-anchor="start">P–P bonds</text><text x="534.0" y="185.0" font-size="8" font-weight="normal" fill="#dbe3ef" text-anchor="end">6 — one per edge</text><text x="368.0" y="202.0" font-size="8" font-weight="normal" fill="#93a1b5" text-anchor="start">each P</text><text x="534.0" y="202.0" font-size="8" font-weight="normal" fill="#dbe3ef" text-anchor="end">3 bonds + 1 lone pair</text><text x="368.0" y="219.0" font-size="8" font-weight="normal" fill="#93a1b5" text-anchor="start">ring strain</text><text x="534.0" y="219.0" font-size="8" font-weight="normal" fill="#dbe3ef" text-anchor="end">high (bent bonds)</text><text x="280.0" y="348.0" font-size="8.8" font-weight="normal" fill="#93a1b5" text-anchor="middle">the 60° angle forces bent (“banana”) P–P bonds and a strained cage,</text><text x="280.0" y="362.0" font-size="8.8" font-weight="normal" fill="#93a1b5" text-anchor="middle">so white P is very reactive — it ignites in air near 303 K and is kept under water.</text><text x="212.5" y="395.5" font-size="10" font-weight="bold" fill="#f4ecd9" text-anchor="start">P₄ + 5 O₂</text><line x1="268.3" y1="392.0" x2="308.3" y2="392.0" stroke="#4db8e8" stroke-width="1.8" stroke-linecap="round"/><line x1="308.3" y1="392.0" x2="301.0" y2="388.7" stroke="#4db8e8" stroke-width="1.8" stroke-linecap="round"/><line x1="308.3" y1="392.0" x2="301.0" y2="395.3" stroke="#4db8e8" stroke-width="1.8" stroke-linecap="round"/><text x="326.3" y="395.5" font-size="10" font-weight="bold" fill="#f4ecd9" text-anchor="start">P₄O₁₀</text><text x="163.0" y="417.5" font-size="10" font-weight="bold" fill="#f4ecd9" text-anchor="start">P₄ + 3 NaOH + 3 H₂O</text><line x1="266.3" y1="414.0" x2="310.3" y2="414.0" stroke="#4db8e8" stroke-width="1.8" stroke-linecap="round"/><line x1="310.3" y1="414.0" x2="303.0" y2="410.7" stroke="#4db8e8" stroke-width="1.8" stroke-linecap="round"/><line x1="310.3" y1="414.0" x2="303.0" y2="417.3" stroke="#4db8e8" stroke-width="1.8" stroke-linecap="round"/><text x="288.3" y="406.0" font-size="6.5" font-weight="normal" fill="#93a1b5" text-anchor="middle">warm, conc.</text><text x="328.3" y="417.5" font-size="10" font-weight="bold" fill="#f4ecd9" text-anchor="start">PH₃ + 3 NaH₂PO₂</text><text x="280.0" y="440.0" font-size="8.4" font-weight="normal" fill="#93a1b5" text-anchor="middle">prolonged heating out of air → polymeric red phosphorus (more stable, less reactive)</text></g></svg>