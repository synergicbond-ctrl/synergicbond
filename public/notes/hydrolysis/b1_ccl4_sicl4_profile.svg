<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 620" width="900" height="620"><rect x="0" y="0" width="900" height="620" fill="#0a0c11"/><text x="450.0" y="22.0" text-anchor="middle" font-family='Inter,Arial,sans-serif' font-size="11.5" font-weight="800" fill="#7cc4ff" style="letter-spacing:1.6px;">GROUP 14 · CARBON VS SILICON</text><text x="450.0" y="70.0" text-anchor="middle" font-family='Inter,Arial,sans-serif' font-size="22" font-weight="800" fill="#ffffff" style="">Why CCl₄ is inert but SiCl₄ hydrolyses rapidly</text><line x1="120.0" y1="466.0" x2="120.0" y2="174.0" stroke="#9fb2c4" stroke-width="2" stroke-linecap="round"/><path d="M 120 460 C 204.0 200, 224.0 200, 264.0 317.0 S 340 265.0, 360 265.0" stroke="#ff775d" stroke-width="3.4" fill="none"/><text x="240.0" y="190.0" text-anchor="middle" font-family='Inter,Arial,sans-serif' font-size="14" font-weight="600" fill="#ff775d" style="">‡ (very high)</text><text x="120.0" y="510.0" text-anchor="middle" font-family='Inter,Arial,sans-serif' font-size="15" font-weight="600" fill="#ffffff" style="">CCl₄ + H₂O</text><text x="400.0" y="420.0" text-anchor="middle" font-family='Inter,Arial,sans-serif' font-size="13" font-weight="600" fill="#9fb2c4" style="">no reaction</text><line x1="520.0" y1="466.0" x2="520.0" y2="174.0" stroke="#9fb2c4" stroke-width="2" stroke-linecap="round"/><path d="M 520 460 C 604.0 310, 624.0 310, 664.0 377.5 S 740 347.5, 760 347.5" stroke="#50dc7b" stroke-width="3.4" fill="none"/><text x="660.0" y="300.0" text-anchor="middle" font-family='Inter,Arial,sans-serif' font-size="14" font-weight="600" fill="#50dc7b" style="">‡ (low)</text><text x="520.0" y="510.0" text-anchor="middle" font-family='Inter,Arial,sans-serif' font-size="15" font-weight="600" fill="#ffffff" style="">SiCl₄ + HO⁻</text><text x="790.0" y="400.0" text-anchor="middle" font-family='Inter,Arial,sans-serif' font-size="14" font-weight="600" fill="#ffffff" style="">Cl₃SiOH + Cl⁻</text><text x="450.0" y="570.0" text-anchor="middle" font-family='Inter,Arial,sans-serif' font-size="14" font-weight="400" fill="#9fb2c4" style="font-style:italic;">Same driving force (both thermodynamically favourable) but very different ΔG‡ — Si is</text><text x="450.0" y="591.0" text-anchor="middle" font-family='Inter,Arial,sans-serif' font-size="14" font-weight="400" fill="#9fb2c4" style="font-style:italic;">larger and accessible (low-barrier 5-coordinate TS); C is small and shielded (high barrier).</text></svg>