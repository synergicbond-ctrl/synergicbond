<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 620" width="1000" height="620"><rect x="0" y="0" width="1000" height="620" fill="#0a0c11"/><text x="500.0" y="22.0" text-anchor="middle" font-family='Inter,Arial,sans-serif' font-size="11.5" font-weight="800" fill="#7cc4ff" style="letter-spacing:1.6px;">MASTER MENTAL MODEL</text><text x="500.0" y="70.0" text-anchor="middle" font-family='Inter,Arial,sans-serif' font-size="22" font-weight="800" fill="#ffffff" style="">Predict hydrolysis from the reacting bond</text><text x="500.0" y="140.0" text-anchor="middle" font-family='Inter,Arial,sans-serif' font-size="16" font-weight="600" fill="#ffffff" style="">Identify the electrophile and the bond that changes</text><line x1="486.6" y1="169.2" x2="273.4" y2="235.8" stroke="#9fb2c4" stroke-width="2" stroke-linecap="round"/><line x1="513.4" y1="169.2" x2="726.6" y2="235.8" stroke="#9fb2c4" stroke-width="2" stroke-linecap="round"/><text x="260.0" y="270.0" text-anchor="middle" font-family='Inter,Arial,sans-serif' font-size="14" font-weight="600" fill="#ffffff" style="">Covalent E–X / E–H / E–C</text><text x="740.0" y="270.0" text-anchor="middle" font-family='Inter,Arial,sans-serif' font-size="14" font-weight="600" fill="#ffffff" style="">Coordinated H₂O / salt ion</text><defs><marker id="da80538" markerWidth="8" markerHeight="8" refX="5" refY="3"
            orient="auto"><path d="M0,0 L6,3 L0,6 Z" fill="#9fb2c4"/></marker></defs><line x1="260" y1="300" x2="260" y2="360" stroke="#9fb2c4" stroke-width="2" marker-end="url(#da80538)"/><defs><marker id="da97064" markerWidth="8" markerHeight="8" refX="5" refY="3"
            orient="auto"><path d="M0,0 L6,3 L0,6 Z" fill="#9fb2c4"/></marker></defs><line x1="740" y1="300" x2="740" y2="360" stroke="#9fb2c4" stroke-width="2" marker-end="url(#da97064)"/><text x="260.0" y="390.0" text-anchor="middle" font-family='Inter,Arial,sans-serif' font-size="13" font-weight="600" fill="#9fb2c4" style="">Attack, leaving group, proton relay</text><text x="740.0" y="390.0" text-anchor="middle" font-family='Inter,Arial,sans-serif' font-size="13" font-weight="600" fill="#9fb2c4" style="">Acid–base equilibrium and pH</text><text x="500.0" y="470.0" text-anchor="middle" font-family='Inter,Arial,sans-serif' font-size="14" font-weight="600" fill="#ffffff" style="">Then check: conditions → products → mass and charge → oxidation states</text><text x="500.0" y="520.0" text-anchor="middle" font-family='Inter,Arial,sans-serif' font-size="13" font-weight="600" fill="#9fb2c4" style="">Favourable thermodynamics alone does not establish a rapid reaction.</text></svg>