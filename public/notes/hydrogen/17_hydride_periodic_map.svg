<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900"><defs>
  <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#030712"/><stop offset="0.55" stop-color="#071426"/><stop offset="1" stop-color="#120a24"/></linearGradient>
  <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0"><stop stop-color="#43e6ff"/><stop offset="0.5" stop-color="#9b8cff"/><stop offset="1" stop-color="#ffb65c"/></linearGradient>
  <filter id="glow"><feGaussianBlur stdDeviation="6" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
  <style>
    .title{font:800 44px Inter,Arial,sans-serif;fill:#f8fafc} .sub{font:400 22px Inter,Arial,sans-serif;fill:#b9c6d8}
    .h{font:750 26px Inter,Arial,sans-serif;fill:#69e7ff} .t{font:400 21px Inter,Arial,sans-serif;fill:#d8e1ee}
    .small{font:400 17px Inter,Arial,sans-serif;fill:#aebbd0} .tiny{font:400 15px Inter,Arial,sans-serif;fill:#8ba0b8}
    .gold{fill:#ffc866} .violet{fill:#b9a2ff} .cyan{fill:#62e8ff} .coral{fill:#ff9c7a} .green{fill:#7be6ab}
    .panel{fill:#07111f;stroke:#284563;stroke-width:2} .panel2{fill:#0d1023;stroke:#5f4a88;stroke-width:2}
    .line{stroke:#63e6ff;stroke-width:4;fill:none} .dash{stroke:#b69cff;stroke-width:4;stroke-dasharray:12 10;fill:none}
    .bond{stroke:#e8f1fb;stroke-width:5} .thin{stroke:#6f829a;stroke-width:2;fill:none}
  </style>
</defs>
<rect width="1600" height="900" fill="url(#bg)"/><rect x="44" y="34" width="1512" height="832" rx="34" fill="none" stroke="#17324d" stroke-width="2"/><text x="78" y="96" class="title">Hydride Classification — Periodic-Table Map</text><rect x="78" y="118" width="430" height="5" rx="3" fill="url(#accent)"/><text x="78" y="158" class="sub">Schematic exam map — boundaries are classification trends, not absolute limits</text><rect x="78" y="220" width="280" height="440" rx="18" fill="#07111f" stroke="#62e8ff" stroke-width="2"/><text x="218" y="270" class="h" text-anchor="middle" style="fill:#62e8ff">s-block</text><text x="218" y="320" class="t" text-anchor="middle">Group 1</text><text x="218" y="348" class="t" text-anchor="middle">Ca, Sr, Ba</text><text x="218" y="376" class="t" text-anchor="middle"></text><text x="218" y="404" class="t" text-anchor="middle">mostly ionic</text><rect x="378" y="220" width="620" height="440" rx="18" fill="#241c0e" stroke="#ffc866" stroke-width="2"/><text x="688" y="270" class="h" text-anchor="middle" style="fill:#ffc866">d / f block</text><text x="688" y="320" class="t" text-anchor="middle">many metallic / non-stoichiometric hydrides</text><rect x="500" y="380" width="380" height="130" rx="14" fill="#2a1416" stroke="#ff9c7a" stroke-width="2"/><text x="690" y="420" class="h" text-anchor="middle" style="fill:#ff9c7a;font-size:22px">hydride gap</text><text x="690" y="452" class="small" text-anchor="middle">Groups 7-9 (NCERT trend)</text><text x="688" y="590" class="small" text-anchor="middle">CrH: standard Group-6 exception</text><rect x="1018" y="220" width="360" height="440" rx="18" fill="#111a2b" stroke="#7db4ff" stroke-width="2"/><text x="1198" y="270" class="h" text-anchor="middle" style="fill:#7db4ff">p-block</text><text x="1198" y="320" class="t" text-anchor="middle">Group 13: electron-deficient</text><text x="1198" y="348" class="t" text-anchor="middle">Group 14: electron-precise</text><text x="1198" y="376" class="t" text-anchor="middle">Groups 15-17: electron-rich</text><text x="1198" y="404" class="t" text-anchor="middle"></text><text x="1198" y="432" class="t" text-anchor="middle">mostly covalent / molecular</text><rect x="78" y="690" width="1460" height="100" rx="14" fill="#0a2630" stroke="#2aaec0"/><text x="100" y="736.0" class="small">Exceptions: BeH₂ is polymeric covalent, not simple saline; MgH₂ is intermediate.</text><text x="100" y="764.0" class="small">The boundaries above describe the general classroom trend, not high-pressure or exotic modern hydride chemistry.</text></svg>