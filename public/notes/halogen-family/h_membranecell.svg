<svg xmlns="http://www.w3.org/2000/svg" width="600" height="300" viewBox="0 0 600 300" font-family="DejaVu Sans, Arial, sans-serif"><rect x="0" y="0" width="600" height="300" fill="white"/><text x="300.0" y="22.0" font-family="DejaVu Sans, Arial, sans-serif" font-size="17" font-weight="bold" fill="#111" text-anchor="middle">Chlor-alkali membrane cell  (manufacture of Cl2, H2, NaOH)</text><rect x="120" y="90" width="360" height="150" rx="4" fill="none" stroke="#111" stroke-width="2"/><line x1="300.0" y1="90.0" x2="300.0" y2="240.0" stroke="#111" stroke-width="2" stroke-dasharray="5,4"/><text x="300.0" y="82.0" font-family="DejaVu Sans, Arial, sans-serif" font-size="8.5" font-weight="normal" fill="#555" text-anchor="middle">ion-selective membrane</text><rect x="180" y="110" width="12" height="110" rx="4" fill="#333" stroke="#111" stroke-width="1.6"/><text x="186.0" y="258.0" font-family="DejaVu Sans, Arial, sans-serif" font-size="8.5" font-weight="normal" fill="#111" text-anchor="middle">anode (+)</text><rect x="408" y="110" width="12" height="110" rx="4" fill="#999" stroke="#111" stroke-width="1.6"/><text x="414.0" y="258.0" font-family="DejaVu Sans, Arial, sans-serif" font-size="8.5" font-weight="normal" fill="#111" text-anchor="middle">cathode (-)</text><text x="210.0" y="140.0" font-family="DejaVu Sans, Arial, sans-serif" font-size="9" font-weight="normal" fill="#111" text-anchor="start">brine  NaCl(aq)</text><text x="370.0" y="140.0" font-family="DejaVu Sans, Arial, sans-serif" font-size="9" font-weight="normal" fill="#111" text-anchor="start">dilute NaOH</text><path d="M 186.0 90.0 L 186.0 60.0 L 150.0 60.0" fill="none" stroke="#111" stroke-width="2"/><text x="140.0" y="60.0" font-family="DejaVu Sans, Arial, sans-serif" font-size="11" font-weight="bold" fill="#2e7d32" text-anchor="end">Cl2</text><path d="M 414.0 90.0 L 414.0 60.0 L 450.0 60.0" fill="none" stroke="#111" stroke-width="2"/><text x="460.0" y="60.0" font-family="DejaVu Sans, Arial, sans-serif" font-size="11" font-weight="bold" fill="#c0392b" text-anchor="start">H2</text><text x="414.0" y="232.0" font-family="DejaVu Sans, Arial, sans-serif" font-size="8.5" font-weight="normal" fill="#333" text-anchor="middle">conc. NaOH out</text><text x="300.0" y="55.0" font-family="DejaVu Sans, Arial, sans-serif" font-size="12" font-weight="bold" fill="#111" text-anchor="start">2 NaCl + 2 H2O  --electrolysis--&gt;  2 NaOH + H2 + Cl2</text><text x="300.0" y="285.0" font-family="DejaVu Sans, Arial, sans-serif" font-size="8.8" font-weight="normal" fill="#555" text-anchor="middle">Na+ passes through the membrane;  Cl- oxidised at the anode, H2O reduced at the cathode</text></svg>