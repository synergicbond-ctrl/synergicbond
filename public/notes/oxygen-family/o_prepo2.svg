.0 L 400.0 235.0 L 403.0 240.0" fill="none" stroke="#111" stroke-width="2"/><text x="300.0" y="55.0" font-family="DejaVu Sans, Arial, sans-serif" font-size="12" font-weight="bold" fill="#111" text-anchor="start">2 KClO3  --(MnO2, 420 K)--&gt;  2 KCl  +  3 O2</text><text x="300.0" y="74.0" font-family="DejaVu Sans, Arial, sans-serif" font-size="9.5" font-weight="normal" fill="#555" text-anchor="start">MnO2 lowers the decomposition T from ~670 K to ~420 K (true catalyst)</text><text x="430.0" y="312.0" font-family="DejaVu Sans, Arial, sans-serif" font-size="9.5" font-weight="normal" fill="#555" text-anchor="start">collected over water</text></svg>