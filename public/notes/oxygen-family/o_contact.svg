="none"/><path d="M 812 379 L 812 386 L 805 386" stroke="#4db8e8" stroke-width="1.4" fill="none"/><text x="20" y="18" font-size="8.5" font-weight="bold" fill="#4db8e8" text-anchor="start" font-family="'SF Mono','DejaVu Sans Mono',ui-monospace,Menlo,monospace" letter-spacing="0.24em">SYNERGIC BOND</text><path d="M 788 12 l 6 6 l -6 6 l -6 -6 z" fill="none" stroke="#63d39b" stroke-width="1.2"/><text x="20" y="40" font-size="16" font-weight="bold" fill="#f4ecd9" text-anchor="start" font-family="'Georgia','Times New Roman',serif">The Contact process for sulfuric acid</text><line x1="20" y1="42" x2="800" y2="42" stroke="#232a36" stroke-width="1"/><g transform="translate(0,34)"><rect x="30" y="70" width="180" height="130" rx="8" fill="#0f1219" stroke="#6fb7dc" stroke-width="1.6"/><text x="44.0" y="92.0" font-size="9.5" font-weight="bold" fill="#f4ecd9" text-anchor="start">1 · burn</text><text x="120.0" y="128.0" font-size="8.4" font-weight="normal" fill="#dbe3ef" text-anchor="middle">S / FeS₂ + O₂</text><line x1="120.0" y1="134.0" x2="120.0" y2="152.0" stroke="#63d39b" stroke-width="1.8" stroke-linecap="round"/><line x1="120.0" y1="152.0" x2="122.4" y2="146.5" stroke="#63d39b" stroke-width="1.8" stroke-linecap="round"/><line x1="120.0" y1="152.0" x2="117.6" y2="146.5" stroke="#63d39b" stroke-width="1.8" stroke-linecap="round"/><text x="120.0" y="168.0" font-size="9.5" font-weight="bold" fill="#63d39b" text-anchor="middle">SO₂</text><text x="120.0" y="188.0" font-size="7.4" font-weight="normal" fill="#93a1b5" text-anchor="middle">purified of dust, As₂O₃, moisture</text><rect x="230" y="70" width="180" height="130" rx="8" fill="#0f1219" stroke="#6fb7dc" stroke-width="1.6"/><text x="244.0" y="92.0" font-size="9.5" font-weight="bold" fill="#f4ecd9" text-anchor="start">2 · convert</text><text x="320.0" y="128.0" font-size="8.4" font-weight="normal" fill="#dbe3ef" text-anchor="middle">2 SO₂ + O₂</text><line x1="320.0" y1="134.0" x2="320.0" y2="152.0" stroke="#63d39b" stroke-width="1.8" stroke-linecap="round"/><line x1="320.0" y1="152.0" x2="322.4" y2="146.5" stroke="#63d39b" stroke-width="1.8" stroke-linecap="round"/><line x1="320.0" y1="152.0" x2="317.6" y2="146.5" stroke="#63d39b" stroke-width="1.8" stroke-linecap="round"/><text x="320.0" y="168.0" font-size="9.5" font-weight="bold" fill="#63d39b" text-anchor="middle">2 SO₃</text><text x="320.0" y="188.0" font-size="7.4" font-weight="normal" fill="#93a1b5" text-anchor="middle">V₂O₅ catalyst, ≈690 K, ≈2 bar</text><rect x="430" y="70" width="180" height="130" rx="8" fill="#0f1219" stroke="#6fb7dc" stroke-width="1.6"/><text x="444.0" y="92.0" font-size="9.5" font-weight="bold" fill="#f4ecd9" text-anchor="start">3 · absorb</text><text x="520.0" y="128.0" font-size="8.4" font-weight="normal" fill="#dbe3ef" text-anchor="middle">SO₃ + H₂SO₄</text><line x1="520.0" y1="134.0" x2="520.0" y2="152.0" stroke="#63d39b" stroke-width="1.8" stroke-linecap="round"/><line x1="520.0" y1="152.0" x2="522.4" y2="146.5" stroke="#63d39b" stroke-width="1.8" stroke-linecap="round"/><line x1="520.0" y1="152.0" x2="517.6" y2="146.5" stroke="#63d39b" stroke-width="1.8" stroke-linecap="round"/><text x="520.0" y="168.0" font-size="9.5" font-weight="bold" fill="#63d39b" text-anchor="middle">H₂S₂O₇</text><text x="520.0" y="188.0" font-size="7.4" font-weight="normal" fill="#93a1b5" text-anchor="middle">in 98% H₂SO₄ (not water — acid mist)</text><rect x="630" y="70" width="180" height="130" rx="8" fill="#0f1219" stroke="#6fb7dc" stroke-width="1.6"/><text x="644.0" y="92.0" font-size="9.5" font-weight="bold" fill="#f4ecd9" text-anchor="start">4 · dilute</text><text x="720.0" y="128.0" font-size="8.4" font-weight="normal" fill="#dbe3ef" text-anchor="middle">H₂S₂O₇ + H₂O</text><line x1="720.0" y1="134.0" x2="720.0" y2="152.0" stroke="#63d39b" stroke-width="1.8" stroke-linecap="round"/><line x1="720.0" y1="152.0" x2="722.4" y2="146.5" stroke="#63d39b" stroke-width="1.8" stroke-linecap="round"/><line x1="720.0" y1="152.0" x2="717.6" y2="146.5" stroke="#63d39b" stroke-width="1.8" stroke-linecap="round"/><text x="720.0" y="168.0" font-size="9.5" font-weight="bold" fill="#63d39b" text-anchor="middle">2 H₂SO₄</text><text x="720.0" y="188.0" font-size="7.4" font-weight="normal" fill="#93a1b5" text-anchor="middle">oleum diluted to 96–98% acid</text><line x1="210.0" y1="135.0" x2="240.0" y2="135.0" stroke="#4db8e8" stroke-width="2" stroke-linecap="round"/><line x1="240.0" y1="135.0" x2="233.6" y2="132.1" stroke="#4db8e8" stroke-width="2" stroke-linecap="round"/><line x1="240.0" y1="135.0" x2="233.6" y2="137.9" stroke="#4db8e8" stroke-width="2" stroke-linecap="round"/><line x1="410.0" y1="135.0" x2="440.0" y2="135.0" stroke="#4db8e8" stroke-width="2" stroke-linecap="round"/><line x1="440.0" y1="135.0" x2="433.6" y2="132.1" stroke="#4db8e8" stroke-width="2" stroke-linecap="round"/><line x1="440.0" y1="135.0" x2="433.6" y2="137.9" stroke="#4db8e8" stroke-width="2" stroke-linecap="round"/><line x1="610.0" y1="135.0" x2="640.0" y2="135.0" stroke="#4db8e8" stroke-width="2" stroke-linecap="round"/><line x1="640.0" y1="135.0" x2="633.6" y2="132.1" stroke="#4db8e8" stroke-width="2" stroke-linecap="round"/><line x1="640.0" y1="135.0" x2="633.6" y2="137.9" stroke="#4db8e8" stroke-width="2" stroke-linecap="round"/><text x="410.0" y="240.0" font-size="9" font-weight="bold" fill="#dbe3ef" text-anchor="middle">2 SO₂ + O₂ ⇌ 2 SO₃   ΔH = −197 kJ mol⁻¹ — exothermic, gas moles fall 3 → 2</text><text x="410.0" y="260.0" font-size="8.2" font-weight="normal" fill="#93a1b5" text-anchor="middle">Le Chatelier favours high P and low T, but ≈690 K is the practical compromise —</text><text x="410.0" y="276.0" font-size="8.2" font-weight="normal" fill="#93a1b5" text-anchor="middle">V₂O₅ raises the rate without shifting equilibrium; excess air + double absorption push conversion past 99.5%</text><text x="410.0" y="300.0" font-size="8.4" font-weight="normal" fill="#ff8f6e" text-anchor="middle">SO₃ is never absorbed directly in water — the reaction is so exothermic it forms an unabsorbable acid mist</text></g></svg>