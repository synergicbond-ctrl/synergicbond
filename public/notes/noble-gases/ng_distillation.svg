r="start">Ar</text><text x="393.0" y="201.0" font-size="7.6" font-weight="normal" fill="#93a1b5" text-anchor="start">87 K</text><line x1="339.0" y1="232" x2="385.0" y2="232" stroke="#93a1b5" stroke-width="1.6"/><text x="393.0" y="235.5" font-size="9.5" font-weight="bold" fill="#93a1b5" text-anchor="start">O₂</text><text x="393.0" y="245.0" font-size="7.6" font-weight="normal" fill="#93a1b5" text-anchor="start">90 K</text><line x1="339.0" y1="276" x2="385.0" y2="276" stroke="#f3b64b" stroke-width="1.6"/><text x="393.0" y="279.5" font-size="9.5" font-weight="bold" fill="#f3b64b" text-anchor="start">Kr, Xe</text><text x="393.0" y="289.0" font-size="7.6" font-weight="normal" fill="#93a1b5" text-anchor="start">120, 165 K</text><text x="300.0" y="56.0" font-size="8.4" font-weight="normal" fill="#93a1b5" text-anchor="middle">distillation column</text><line x1="215.0" y1="304" x2="253.0" y2="304" stroke="#6fb7dc" stroke-width="2"/><text x="209.0" y="307.0" font-size="8.4" font-weight="normal" fill="#4db8e8" text-anchor="end">liquid air in</text><text x="340.0" y="350.0" font-size="8.4" font-weight="normal" fill="#93a1b5" text-anchor="middle">gases separate by boiling point — He (lowest b.p.) leaves at the top, Kr/Xe concentrate in the O2-rich bottoms</text><text x="340.0" y="372.0" font-size="8.4" font-weight="normal" fill="#93a1b5" text-anchor="middle">He is extracted commercially from natural gas instead; Rn comes from radioactive decay: 226Ra -&gt; 222Rn + 4He</text></g></svg>