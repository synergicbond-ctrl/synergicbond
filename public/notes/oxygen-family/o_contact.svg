lo,monospace" letter-spacing="0.24em">SYNERGIC BOND</text><path d="M 668 12 l 6 6 l -6 6 l -6 -6 z" fill="none" stroke="#63d39b" stroke-width="1.2"/><text x="20" y="40" font-size="16" font-weight="bold" fill="#f4ecd9" text-anchor="start" font-family="'Georgia','Times New Roman',serif">Contact process for sulphuric acid</text><line x1="20" y1="42" x2="680" y2="42" stroke="#232a36" stroke-width="1"/><g transform="translate(0,34)"><rect x="50" y="55" width="220" height="40" rx="4" fill="none" stroke="#232a36" stroke-width="1.6"/><text x="160.0" y="73.0" font-size="10.5" font-weight="normal" fill="#dbe3ef" text-anchor="middle">S / FeS2 + O2  -&gt;</text><text x="160.0" y="88.0" font-size="10.5" font-weight="bold" fill="#dbe3ef" text-anchor="middle">SO2</text><text x="290.0" y="78.0" font-size="10" font-weight="normal" fill="#8b98ac" text-anchor="start">purify: dust, moisture, As2O3 (poison)</text><rect x="50" y="113" width="220" height="40" rx="4" fill="none" stroke="#232a36" stroke-width="1.6"/><text x="160.0" y="131.0" font-size="10.5" font-weight="normal" fill="#dbe3ef" text-anchor="middle">2 SO2 + O2  -&gt;</text><text x="160.0" y="146.0" font-size="10.5" font-weight="bold" fill="#dbe3ef" text-anchor="middle">2 SO3</text><text x="290.0" y="136.0" font-size="10" font-weight="normal" fill="#8b98ac" text-anchor="start">V2O5, ~720 K, ~2 bar  (dH = -197 kJ)</text><rect x="50" y="171" width="220" height="40" rx="4" fill="none" stroke="#232a36" stroke-width="1.6"/><text x="160.0" y="189.0" font-size="10.5" font-weight="normal" fill="#dbe3ef" text-anchor="middle">SO3 + H2SO4  -&gt;</text><text x="160.0" y="204.0" font-size="10.5" font-weight="bold" fill="#dbe3ef" text-anchor="middle">H2S2O7 (oleum)</text><text x="290.0" y="194.0" font-size="10" font-weight="normal" fill="#8b98ac" text-anchor="start">NOT SO3 + water (acid mist!)</text><rect x="50" y="229" width="220" height="40" rx="4" fill="none" stroke="#232a36" stroke-width="1.6"/><text x="160.0" y="247.0" font-size="10.5" font-weight="normal" fill="#dbe3ef" text-anchor="middle">H2S2O7 + H2O  -&gt;</text><text x="160.0" y="262.0" font-size="10.5" font-weight="bold" fill="#dbe3ef" text-anchor="middle">2 H2SO4</text><text x="290.0" y="252.0" font-size="10" font-weight="normal" fill="#8b98ac" text-anchor="start">dilute -&gt; 96-98% acid</text><text x="350.0" y="275.0" font-size="10" font-weight="normal" fill="#39414f" text-anchor="middle">exothermic + gas moles fall  =&gt;  low T, high P favour yield; ~720 K compromise; excess air; double absorption.</text></g></svg>