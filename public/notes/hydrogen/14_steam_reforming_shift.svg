<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900"><defs>
  <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#030712"/><stop offset="0.55" stop-color="#071426"/><stop offset="1" stop-color="#120a24"/></linearGradient>
  <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0"><stop stop-color="#43e6ff"/><stop offset="0.5" stop-color="#9b8cff"/><stop offset="1" stop-color="#ffb65c"/></linearGradient>
  <filter id="glow"><feGaussianBlur stdDeviation="6" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
  <style>
    .title{font:800 44px Inter,Arial,sans-serif;fill:#f8fafc} .sub{font:400 22px Inter,Arial,sans-serif;fill:#b9c6d8}
    .h{font:750 26px Inter,Arial,sans-serif;fill:#69e7ff} .t{font:400 21px Inter,Arial,sans-serif;fill:#d8e1ee}
    .small{font:400 17px Inter,Arial,sans-serif;fill:#aebbd0} .tiny{font:400 15px Inter,Arial,sans-serif;fill:#8ba0b8}
    .gold{fill:#ffc866} .violet{fill:#b9a2ff} .cyan{fill:#62e8ff} .coral{fill:#ff9c7a} .green{fill:#7be6ab}
    .panel{fill:#07111f;stroke:#284563;stroke-width:2} .panel2{fill:#0d1023;stroke:#5f4a88;stroke-width:2}
    .line{stroke:#63e6ff;stroke-width:4;fill:none} .dash{stroke:#b69cff;stroke-width:4;stroke-dasharray:12 10;fill:none}
    .bond{stroke:#e8f1fb;stroke-width:5} .thin{stroke:#6f829a;stroke-width:2;fill:none}
  </style>
</defs>
<rect width="1600" height="900" fill="url(#bg)"/><rect x="44" y="34" width="1512" height="832" rx="34" fill="none" stroke="#17324d" stroke-width="2"/><text x="78" y="96" class="title">Steam Reforming and the Water-Gas Shift</text><rect x="78" y="118" width="430" height="5" rx="3" fill="url(#accent)"/><text x="78" y="158" class="sub">The two-stage industrial route from natural gas to H₂</text><rect x="78" y="240" width="380" height="160" rx="16" fill="#0d1023" stroke="#62e8ff" stroke-width="2"/><text x="102" y="280" class="h" style="fill:#62e8ff;font-size:22px">Feed</text><text x="102" y="312" class="t">CH₄ + H₂O(g)</text><line x1="468" y1="320" x2="540" y2="320" stroke="#62e8ff" stroke-width="4"/><path d="M 540 320 L 528 327 L 528 313 Z" fill="#62e8ff"/><rect x="550" y="240" width="420" height="160" rx="16" fill="#0d1023" stroke="#7be6ab" stroke-width="2"/><text x="574" y="280" class="h" style="fill:#7be6ab;font-size:22px">Steam reformer</text><text x="574" y="312" class="t">CH₄ + H₂O ⇌ CO + 3 H₂</text><text x="574" y="338" class="t">high T (~1100 K), Ni catalyst</text><line x1="978" y1="340" x2="978" y2="380" stroke="#62e8ff" stroke-width="4"/><path d="M 978 380 L 971 368 L 985 368 Z" fill="#62e8ff"/><rect x="770" y="400" width="420" height="160" rx="16" fill="#0d1023" stroke="#ffc866" stroke-width="2"/><text x="794" y="440" class="h" style="fill:#ffc866;font-size:22px">Shift converter</text><text x="794" y="472" class="t">CO + H₂O ⇌ CO₂ + H₂</text><text x="794" y="498" class="t">raises overall H₂ yield</text><line x1="280" y1="400" x2="280" y2="440" stroke="#62e8ff" stroke-width="4"/><path d="M 280 440 L 273 428 L 287 428 Z" fill="#62e8ff"/><rect x="78" y="460" width="480" height="160" rx="16" fill="#0d1023" stroke="#ff9c7a" stroke-width="2"/><text x="102" y="500" class="h" style="fill:#ff9c7a;font-size:22px">Coal route (alternative)</text><text x="102" y="532" class="t">C + H₂O → CO + H₂</text><text x="102" y="558" class="t">"water gas" — CO/H₂ mixture</text><rect x="78" y="650" width="1112" height="100" rx="16" fill="#0d1023" stroke="#b9a2ff" stroke-width="2"/><text x="102" y="690" class="h" style="fill:#b9a2ff;font-size:22px">CO₂ removal</text><text x="102" y="722" class="t">Absorption / scrubbing purifies the H₂-rich stream for the required application</text><rect x="78" y="770" width="1460" height="80" rx="14" fill="#0a2630" stroke="#2aaec0"/><text x="100" y="816.0" class="small">Exam distinction: water gas = CO + H₂ (from coal); "syngas" is the reforming feed concept, usually a CO/H₂ mixture used for further synthesis (e.g. methanol).</text></svg>