<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900">
<rect x="0" y="0" width="1600" height="900" rx="0" fill="#07131f" fill-opacity="1" stroke="#07131f" stroke-width="2"/>
<rect x="0" y="0" width="1600" height="118" rx="0" fill="#091b2a" fill-opacity="1" stroke="#091b2a" stroke-width="2"/>
<text x="62" y="66" font-family="Aptos,Arial,sans-serif" font-size="40" fill="#f4faff" font-weight="800" text-anchor="start">JEE Advanced exception and trap map</text>
<text x="62" y="101" font-family="Aptos,Arial,sans-serif" font-size="19" fill="#a6bdd0" font-weight="450" text-anchor="start">A final diagnostic screen for statements, orders, integer counts and assertion–reason questions</text>
<rect x="65" y="165" width="710" height="130" rx="16" fill="#0d2233" fill-opacity="1" stroke="#39d9ff" stroke-width="2"/>
<text x="95" y="208" font-family="Aptos,Arial,sans-serif" font-size="20" fill="#39d9ff" font-weight="820" text-anchor="start">Placement</text>
<text x="95" y="247" font-family="Aptos,Arial,sans-serif" font-size="17" fill="#f4faff" font-weight="600" text-anchor="start">Detached rows still belong to Periods 6 and 7</text>
<rect x="825" y="165" width="710" height="130" rx="16" fill="#0d2233" fill-opacity="1" stroke="#1ed6c0" stroke-width="2"/>
<text x="855" y="208" font-family="Aptos,Arial,sans-serif" font-size="20" fill="#1ed6c0" font-weight="820" text-anchor="start">Configuration</text>
<text x="855" y="247" font-family="Aptos,Arial,sans-serif" font-size="17" fill="#f4faff" font-weight="600" text-anchor="start">Neutral atom ≠ ion; remove outer ns electrons first</text>
<rect x="65" y="330" width="710" height="130" rx="16" fill="#0d2233" fill-opacity="1" stroke="#ff4fd8" stroke-width="2"/>
<text x="95" y="373" font-family="Aptos,Arial,sans-serif" font-size="20" fill="#ff4fd8" font-weight="820" text-anchor="start">Colour</text>
<text x="95" y="412" font-family="Aptos,Arial,sans-serif" font-size="17" fill="#f4faff" font-weight="600" text-anchor="start">f⁰/f¹⁴ blocks f–f colour, not charge transfer</text>
<rect x="825" y="330" width="710" height="130" rx="16" fill="#0d2233" fill-opacity="1" stroke="#ffc857" stroke-width="2"/>
<text x="855" y="373" font-family="Aptos,Arial,sans-serif" font-size="20" fill="#ffc857" font-weight="820" text-anchor="start">Magnetism</text>
<text x="855" y="412" font-family="Aptos,Arial,sans-serif" font-size="17" fill="#f4faff" font-weight="600" text-anchor="start">spin-only moment is generally insufficient</text>
<rect x="65" y="495" width="710" height="130" rx="16" fill="#0d2233" fill-opacity="1" stroke="#ff8a3d" stroke-width="2"/>
<text x="95" y="538" font-family="Aptos,Arial,sans-serif" font-size="20" fill="#ff8a3d" font-weight="820" text-anchor="start">Contraction</text>
<text x="95" y="577" font-family="Aptos,Arial,sans-serif" font-size="17" fill="#f4faff" font-weight="600" text-anchor="start">compare equal charge and coordination number</text>
<rect x="825" y="495" width="710" height="130" rx="16" fill="#0d2233" fill-opacity="1" stroke="#ff5a68" stroke-width="2"/>
<text x="855" y="538" font-family="Aptos,Arial,sans-serif" font-size="20" fill="#ff5a68" font-weight="820" text-anchor="start">Oxidation states</text>
<text x="855" y="577" font-family="Aptos,Arial,sans-serif" font-size="17" fill="#f4faff" font-weight="600" text-anchor="start">f⁰/f⁷/f¹⁴ helps; medium decides stability</text>
<rect x="65" y="660" width="710" height="130" rx="16" fill="#0d2233" fill-opacity="1" stroke="#63e69b" stroke-width="2"/>
<text x="95" y="703" font-family="Aptos,Arial,sans-serif" font-size="20" fill="#63e69b" font-weight="820" text-anchor="start">Actinoids</text>
<text x="95" y="742" font-family="Aptos,Arial,sans-serif" font-size="17" fill="#f4faff" font-weight="600" text-anchor="start">radioactivity is nuclear, not a redox state</text>
<rect x="825" y="660" width="710" height="130" rx="16" fill="#0d2233" fill-opacity="1" stroke="#39d9ff" stroke-width="2"/>
<text x="855" y="703" font-family="Aptos,Arial,sans-serif" font-size="20" fill="#39d9ff" font-weight="820" text-anchor="start">Covalency</text>
<text x="855" y="742" font-family="Aptos,Arial,sans-serif" font-size="17" fill="#f4faff" font-weight="600" text-anchor="start">greater 5f participation is compound-specific</text>
<rect x="320" y="838" width="960" height="35" rx="9" fill="#0a1d2b" fill-opacity="1" stroke="#ffc857" stroke-width="2"/>
<text x="800" y="862" font-family="Aptos,Arial,sans-serif" font-size="17" fill="#ffc857" font-weight="800" text-anchor="middle">Solve in this order: species → oxidation state → f count → medium → property.</text>
</svg>