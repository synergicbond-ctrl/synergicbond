<svg xmlns="http://www.w3.org/2000/svg" width="760" height="396" viewBox="0 0 760 396" font-family="'Inter','Helvetica Neue',Arial,'DejaVu Sans',sans-serif"><rect width="760" height="396" fill="#0a0c11"/><g stroke="#141a24" stroke-width="1"><line x1="34" y1="0" x2="34" y2="396"/><line x1="68" y1="0" x2="68" y2="396"/><line x1="102" y1="0" x2="102" y2="396"/><line x1="136" y1="0" x2="136" y2="396"/><line x1="170" y1="0" x2="170" y2="396"/><line x1="204" y1="0" x2="204" y2="396"/><line x1="238" y1="0" x2="238" y2="396"/><line x1="272" y1="0" x2="272" y2="396"/><line x1="306" y1="0" x2="306" y2="396"/><line x1="340" y1="0" x2="340" y2="396"/><line x1="374" y1="0" x2="374" y2="396"/><line x1="408" y1="0" x2="408" y2="396"/><line x1="442" y1="0" x2="442" y2="396"/><line x1="476" y1="0" x2="476" y2="396"/><line x1="510" y1="0" x2="510" y2="396"/><line x1="544" y1="0" x2="544" y2="396"/><line x1="578" y1="0" x2="578" y2="396"/><line x1="612" y1="0" x2="612" y2="396"/><line x1="646" y1="0" x2="646" y2="396"/><line x1="680" y1="0" x2="680" y2="396"/><line x1="714" y1="0" x2="714" y2="396"/><line x1="748" y1="0" x2="748" y2="396"/><line x1="0" y1="34" x2="760" y2="34"/><line x1="0" y1="68" x2="760" y2="68"/><line x1="0" y1="102" x2="760" y2="102"/><line x1="0" y1="136" x2="760" y2="136"/><line x1="0" y1="170" x2="760" y2="170"/><line x1="0" y1="204" x2="760" y2="204"/><line x1="0" y1="238" x2="760" y2="238"/><line x1="0" y1="272" x2="760" y2="272"/><line x1="0" y1="306" x2="760" y2="306"/><line x1="0" y1="340" x2="760" y2="340"/><line x1="0" y1="374" x2="760" y2="374"/></g><rect x="8" y="8" width="744" height="380" fill="none" stroke="#232a36" stroke-width="1"/><path d="M 8 15 L 8 8 L 15 8" stroke="#4db8e8" stroke-width="1.4" fill="none"/><path d="M 752 15 L 752 8 L 745 8" stroke="#4db8e8" stroke-width="1.4" fill="none"/><path d="M 8 381 L 8 388 L 15 388" stroke="#4db8e8" stroke-width="1.4" fill="none"/><path d="M 752 381 L 752 388 L 745 388" stroke="#4db8e8" stroke-width="1.4" fill="none"/><text x="20" y="18" font-size="8.5" font-weight="bold" fill="#4db8e8" text-anchor="start" font-family="'SF Mono','DejaVu Sans Mono',ui-monospace,Menlo,monospace" letter-spacing="0.24em">SYNERGIC BOND</text><path d="M 728 12 l 6 6 l -6 6 l -6 -6 z" fill="none" stroke="#63d39b" stroke-width="1.2"/><text x="20" y="40" font-size="16" font-weight="bold" fill="#f4ecd9" text-anchor="start" font-family="'Georgia','Times New Roman',serif">Haber–Bosch synthesis of ammonia</text><line x1="20" y1="42" x2="740" y2="42" stroke="#232a36" stroke-width="1"/><g transform="translate(0,34)"><text x="40.0" y="120.0" font-size="9.5" font-weight="bold" fill="#4db8e8" text-anchor="start">N₂ + 3 H₂</text><text x="40.0" y="134.0" font-size="7.6" font-weight="normal" fill="#93a1b5" text-anchor="start">1 : 3</text><line x1="96.0" y1="122.0" x2="140.0" y2="122.0" stroke="#4db8e8" stroke-width="2" stroke-linecap="round"/><line x1="140.0" y1="122.0" x2="133.6" y2="119.1" stroke="#4db8e8" stroke-width="2" stroke-linecap="round"/><line x1="140.0" y1="122.0" x2="133.6" y2="124.9" stroke="#4db8e8" stroke-width="2" stroke-linecap="round"/><rect x="140" y="96" width="92" height="60" rx="6" fill="#0f1219" stroke="#6fb7dc" stroke-width="1.8"/><text x="186.0" y="114.0" font-size="9" font-weight="bold" fill="#f4ecd9" text-anchor="middle">compressor</text><text x="186.0" y="130.0" font-size="7.6" font-weight="normal" fill="#93a1b5" text-anchor="middle">≈200 atm</text><line x1="232.0" y1="122.0" x2="276.0" y2="122.0" stroke="#4db8e8" stroke-width="2" stroke-linecap="round"/><line x1="276.0" y1="122.0" x2="269.6" y2="119.1" stroke="#4db8e8" stroke-width="2" stroke-linecap="round"/><line x1="276.0" y1="122.0" x2="269.6" y2="124.9" stroke="#4db8e8" stroke-width="2" stroke-linecap="round"/><rect x="276" y="84" width="118" height="108" rx="6" fill="#0f1219" stroke="#6fb7dc" stroke-width="1.8"/><text x="335.0" y="102.0" font-size="9" font-weight="bold" fill="#f4ecd9" text-anchor="middle">catalyst converter</text><text x="335.0" y="118.0" font-size="7.6" font-weight="normal" fill="#93a1b5" text-anchor="middle">Fe + K₂O + Al₂O₃</text><text x="335.0" y="130.0" font-size="7.6" font-weight="normal" fill="#93a1b5" text-anchor="middle">≈700 K, ≈200 atm</text><rect x="288" y="150" width="94" height="30" rx="4" fill="rgba(120,215,150,0.08)"/><text x="335.0" y="168.0" font-size="7.4" font-weight="normal" fill="#63d39b" text-anchor="middle">N₂ + 3 H₂ ⇌ 2 NH₃</text><line x1="394.0" y1="122.0" x2="438.0" y2="122.0" stroke="#4db8e8" stroke-width="2" stroke-linecap="round"/><line x1="438.0" y1="122.0" x2="431.6" y2="119.1" stroke="#4db8e8" stroke-width="2" stroke-linecap="round"/><line x1="438.0" y1="122.0" x2="431.6" y2="124.9" stroke="#4db8e8" stroke-width="2" stroke-linecap="round"/><rect x="438" y="96" width="96" height="60" rx="6" fill="#0f1219" stroke="#6fb7dc" stroke-width="1.8"/><text x="486.0" y="114.0" font-size="9" font-weight="bold" fill="#f4ecd9" text-anchor="middle">condenser</text><text x="486.0" y="130.0" font-size="7.6" font-weight="normal" fill="#93a1b5" text-anchor="middle">cooled, ≈ −20 °C</text><line x1="534.0" y1="122.0" x2="578.0" y2="122.0" stroke="#4db8e8" stroke-width="2" stroke-linecap="round"/><line x1="578.0" y1="122.0" x2="571.6" y2="119.1" stroke="#4db8e8" stroke-width="2" stroke-linecap="round"/><line x1="578.0" y1="122.0" x2="571.6" y2="124.9" stroke="#4db8e8" stroke-width="2" stroke-linecap="round"/><text x="586.0" y="118.0" font-size="9.5" font-weight="bold" fill="#63d39b" text-anchor="start">liquid NH₃</text><text x="586.0" y="132.0" font-size="7.6" font-weight="normal" fill="#93a1b5" text-anchor="start">drawn off</text><path d="M 486 96 L 486 56 L 186 56 L 186 96" fill="none" stroke="#b79bff" stroke-width="2" stroke-dasharray="5 4"/><line x1="186.0" y1="76.0" x2="186.0" y2="94.0" stroke="#b79bff" stroke-width="2" stroke-linecap="round"/><line x1="186.0" y1="94.0" x2="188.9" y2="87.6" stroke="#b79bff" stroke-width="2" stroke-linecap="round"/><line x1="186.0" y1="94.0" x2="183.1" y2="87.6" stroke="#b79bff" stroke-width="2" stroke-linecap="round"/><text x="336.0" y="50.0" font-size="8" font-weight="normal" fill="#b79bff" text-anchor="middle">unreacted N₂ + H₂ recycled</text><rect x="60" y="228" width="660" height="120" rx="8" fill="#0f1219" stroke="#232a36" stroke-width="1.2"/><text x="80.0" y="250.0" font-size="9.5" font-weight="bold" fill="#f4ecd9" text-anchor="start">Why these conditions</text><text x="80.0" y="270.0" font-size="8.2" font-weight="normal" fill="#dbe3ef" text-anchor="start">Forward reaction is exothermic (ΔH ≈ −92 kJ) and lowers the gas moles 4 → 2.</text><text x="80.0" y="287.0" font-size="8.2" font-weight="normal" fill="#93a1b5" text-anchor="start">Le Chatelier: high pressure and low temperature both favour more NH₃.</text><text x="80.0" y="304.0" font-size="8.2" font-weight="normal" fill="#93a1b5" text-anchor="start">But at low T the rate is far too slow — so ≈700 K is a kinetic compromise,</text><text x="80.0" y="321.0" font-size="8.2" font-weight="normal" fill="#93a1b5" text-anchor="start">and the iron catalyst raises the rate without shifting the position of equilibrium.</text></g></svg>