family="DejaVu Sans, Arial, sans-serif" font-size="15" font-weight="bold" fill="#111" text-anchor="middle">Cl</text><text x="670.0" y="60.0" font-family="DejaVu Sans, Arial, sans-serif" font-size="12" font-weight="bold" fill="#111" text-anchor="middle">HClO4 (+7)</text><line x1="658.5" y1="145.4" x2="637.7" y2="129.8" stroke="#111" stroke-width="1.7"/><line x1="662.3" y1="140.2" x2="641.5" y2="124.6" stroke="#111" stroke-width="1.7"/><circle cx="630.0" cy="120.0" r="9" fill="#fde2e2" stroke="#111" stroke-width="1.6"/><text x="630.0" y="123.5" font-family="DejaVu Sans, Arial, sans-serif" font-size="10" font-weight="bold" fill="#111" text-anchor="middle">O</text><line x1="677.7" y1="140.2" x2="698.5" y2="124.6" stroke="#111" stroke-width="1.7"/><line x1="681.5" y1="145.4" x2="702.3" y2="129.8" stroke="#111" stroke-width="1.7"/><circle cx="710.0" cy="120.0" r="9" fill="#fde2e2" stroke="#111" stroke-width="1.6"/><text x="710.0" y="123.5" font-family="DejaVu Sans, Arial, sans-serif" font-size="10" font-weight="bold" fill="#111" text-anchor="middle">O</text><line x1="666.8" y1="138.0" x2="666.8" y2="110.0" stroke="#111" stroke-width="1.7"/><line x1="673.2" y1="138.0" x2="673.2" y2="110.0" stroke="#111" stroke-width="1.7"/><circle cx="670.0" cy="98.0" r="9" fill="#fde2e2" stroke="#111" stroke-width="1.6"/><text x="670.0" y="101.5" font-family="DejaVu Sans, Arial, sans-serif" font-size="10" font-weight="bold" fill="#111" text-anchor="middle">O</text><line x1="670.0" y1="162.0" x2="670.0" y2="184.0" stroke="#111" stroke-width="1.7"/><circle cx="670.0" cy="196.0" r="9" fill="#fde2e2" stroke="#111" stroke-width="1.6"/><text x="670.0" y="199.5" font-family="DejaVu Sans, Arial, sans-serif" font-size="10" font-weight="bold" fill="#111" text-anchor="middle">O</text><text x="680.0" y="216.0" font-family="DejaVu Sans, Arial, sans-serif" font-size="10" font-weight="normal" fill="#111" text-anchor="start">H</text><circle cx="670.0" cy="150.0" r="12" fill="#d9f2d9" stroke="#111" stroke-width="1.6"/><text x="670.0" y="155.2" font-family="DejaVu Sans, Arial, sans-serif" font-size="15" font-weight="bold" fill="#111" text-anchor="middle">Cl</text><text x="360.0" y="255.0" font-family="DejaVu Sans, Arial, sans-serif" font-size="11.5" font-weight="bold" fill="#111" text-anchor="middle">acid strength:   HOCl  &lt;  HClO2  &lt;  HClO3  &lt;  HClO4     (more Cl=O drains the O-H bond)</text><text x="360.0" y="278.0" font-family="DejaVu Sans, Arial, sans-serif" font-size="11" font-weight="normal" fill="#333" text-anchor="middle">oxidising power (kinetic):   HOCl  &gt;  HClO2  &gt;  HClO3  &gt;  HClO4</text><text x="360.0" y="300.0" font-family="DejaVu Sans, Arial, sans-serif" font-size="11" font-weight="normal" fill="#555" text-anchor="middle">thermal stability of the salt:   hypochlorite &lt; chlorite &lt; chlorate &lt; perchlorate</text></svg>