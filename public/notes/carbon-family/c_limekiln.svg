ll="#f4ecd9" text-anchor="start" font-family="'Georgia','Times New Roman',serif">Rotary lime kiln  -  CaCO3 -&gt; CaO</text><line x1="20" y1="42" x2="460" y2="42" stroke="#232a36" stroke-width="1"/><g transform="translate(0,34)"><path d="M 70 130 L 400 90 L 410 150 L 80 190 Z" fill="#1e1a12" stroke="#39414f" stroke-width="2" stroke-linejoin="round"/><path d="M 40.0 150.0 L 70.0 145.0" fill="none" stroke="#dbe3ef" stroke-width="2" stroke-linejoin="round"/><text x="35.0" y="150.0" font-size="9" font-weight="normal" fill="#dbe3ef" text-anchor="end">CaCO3 in</text><path d="M 405 100 Q 430 120 405 140 Z" fill="#f3b64b" stroke="#f3b64b" stroke-width="1.4" stroke-linejoin="round"/><text x="430.0" y="120.0" font-size="8.5" font-weight="normal" fill="#dbe3ef" text-anchor="start">burner</text><path d="M 410.0 175.0 L 440.0 175.0" fill="none" stroke="#dbe3ef" stroke-width="2" stroke-linejoin="round"/><text x="446.0" y="178.0" font-size="9" font-weight="normal" fill="#ff8f6e" text-anchor="start">CaO (quicklime)</text><path d="M 90.0 120.0 L 60.0 100.0" fill="none" stroke="#dbe3ef" stroke-width="2" stroke-linejoin="round"/><text x="52.0" y="96.0" font-size="8.5" font-weight="normal" fill="#dbe3ef" text-anchor="end">CO2 flue gas</text><text x="240.0" y="250.0" font-size="11.5" font-weight="bold" fill="#dbe3ef" text-anchor="middle">CaCO3(s)  &lt;=(1100 K)=&gt;  CaO(s)  +  CO2(g)      dH = +178 kJ</text><text x="240.0" y="272.0" font-size="8.8" font-weight="normal" fill="#8b98ac" text-anchor="middle">endothermic + gas released -&gt; favoured by high T and by sweeping the CO2 away</text><text x="240.0" y="296.0" font-size="8.6" font-weight="normal" fill="#8b98ac" text-anchor="middle">CaO + H2O -&gt; Ca(OH)2 (slaking) ;  Ca(OH)2 + CO2 -&gt; CaCO3 + H2O (setting of lime mortar)</text></g></svg>