d39b" stroke-width="1.2"/><text x="20" y="40" font-size="16" font-weight="bold" fill="#f4ecd9" text-anchor="start" font-family="'Georgia','Times New Roman',serif">Chlor-alkali membrane cell  (NaOH, Cl2, H2)</text><line x1="20" y1="42" x2="540" y2="42" stroke="#232a36" stroke-width="1"/><g transform="translate(0,34)"><rect x="120" y="95" width="320" height="150" rx="4" fill="none" stroke="#4db8e8" stroke-width="2"/><line x1="280.0" y1="95.0" x2="280.0" y2="245.0" stroke="#63d39b" stroke-width="2" stroke-linecap="round" stroke-dasharray="5,4"/><text x="280.0" y="88.0" font-size="8.4" font-weight="normal" fill="#4db8e8" text-anchor="middle">cation-exchange membrane  (Na+ only)</text><rect x="178" y="120" width="12" height="105" rx="4" fill="#39414f" stroke="#232a36" stroke-width="1.6"/><text x="184.0" y="262.0" font-size="8.5" font-weight="normal" fill="#8b98ac" text-anchor="middle">anode (+)</text><rect x="372" y="120" width="12" height="105" rx="4" fill="#5b6675" stroke="#232a36" stroke-width="1.6"/><text x="378.0" y="262.0" font-size="8.5" font-weight="normal" fill="#8b98ac" text-anchor="middle">cathode (-)</text><rect x="126" y="165" width="92" height="78" rx="2" fill="rgba(120,215,150,0.10)" stroke="none" stroke-width="1.6"/><text x="200.0" y="150.0" font-size="9" font-weight="normal" fill="#dbe3ef" text-anchor="middle">brine  NaCl(aq)</text><rect x="342" y="165" width="92" height="78" rx="2" fill="rgba(90,175,225,0.14)" stroke="none" stroke-width="1.6"/><text x="360.0" y="150.0" font-size="8.6" font-weight="normal" fill="#dbe3ef" text-anchor="middle">dilute NaOH in</text><path d="M 184.0 95.0 L 184.0 62.0 L 150.0 62.0" fill="none" stroke="#dbe3ef" stroke-width="2" stroke-linejoin="round"/><text x="142.0" y="62.0" font-size="11" font-weight="bold" fill="#63d39b" text-anchor="end">Cl2</text><path d="M 378.0 95.0 L 378.0 62.0 L 412.0 62.0" fill="none" stroke="#dbe3ef" stroke-width="2" stroke-linejoin="round"/><text x="420.0" y="62.0" font-size="11" font-weight="bold" fill="#4db8e8" text-anchor="start">H2</text><text x="388.0" y="236.0" font-size="8.2" font-weight="normal" fill="#4db8e8" text-anchor="middle">conc. NaOH out</text><text x="280.0" y="300.0" font-size="12" font-weight="bold" fill="#dbe3ef" text-anchor="middle">2 NaCl + 2 H2O  -electrolysis-&gt;  2 NaOH + H2 + Cl2</text><text x="280.0" y="322.0" font-size="9" font-weight="normal" fill="#8b98ac" text-anchor="middle">the membrane keeps Cl2 out of the cathode compartment, so the NaOH stays chloride-free</text></g></svg>