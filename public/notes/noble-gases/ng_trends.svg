" fill="#ff8f6e" stroke="#ff8f6e" stroke-width="1.6"/><line x1="410.0" y1="129.8" x2="485.0" y2="90.7" stroke="#ff8f6e" stroke-width="2.2" stroke-linecap="round"/><text x="485.0" y="288.0" font-size="10" font-weight="normal" fill="#dbe3ef" text-anchor="middle">Rn</text><circle cx="110.0" cy="137.5" r="4" fill="#63d39b" stroke="#63d39b" stroke-width="1.6"/><circle cx="185.0" cy="163.8" r="4" fill="#63d39b" stroke="#63d39b" stroke-width="1.6"/><line x1="110.0" y1="137.5" x2="185.0" y2="163.8" stroke="#63d39b" stroke-width="2.2" stroke-linecap="round"/><circle cx="260.0" cy="214.2" r="4" fill="#63d39b" stroke="#63d39b" stroke-width="1.6"/><line x1="185.0" y1="163.8" x2="260.0" y2="214.2" stroke="#63d39b" stroke-width="2.2" stroke-linecap="round"/><circle cx="335.0" cy="229.4" r="4" fill="#63d39b" stroke="#63d39b" stroke-width="1.6"/><line x1="260.0" y1="214.2" x2="335.0" y2="229.4" stroke="#63d39b" stroke-width="2.2" stroke-linecap="round"/><circle cx="410.0" cy="245.7" r="4" fill="#63d39b" stroke="#63d39b" stroke-width="1.6"/><line x1="335.0" y1="229.4" x2="410.0" y2="245.7" stroke="#63d39b" stroke-width="2.2" stroke-linecap="round"/><circle cx="485.0" cy="257.7" r="4" fill="#63d39b" stroke="#63d39b" stroke-width="1.6"/><line x1="410.0" y1="245.7" x2="485.0" y2="257.7" stroke="#63d39b" stroke-width="2.2" stroke-linecap="round"/><text x="430.0" y="90.0" font-size="10" font-weight="normal" fill="#63d39b" text-anchor="start">ionisation enthalpy</text><text x="430.0" y="235.0" font-size="10" font-weight="normal" fill="#ff8f6e" text-anchor="start">boiling point</text><text x="280.0" y="305.0" font-size="10" font-weight="normal" fill="#93a1b5" text-anchor="middle">EVERYTHING increases He→Rn (dispersion forces)  EXCEPT ionisation enthalpy,</text><text x="280.0" y="324.0" font-size="10" font-weight="normal" fill="#8b98ac" text-anchor="middle">which decreases → this is why Kr, Xe, Rn (not He, Ne, Ar) form compounds.</text></g></svg>