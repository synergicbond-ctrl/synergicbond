<svg xmlns="http://www.w3.org/2000/svg" width="700" height="300" viewBox="0 0 700 300" font-family="DejaVu Sans, Arial, sans-serif"><rect x="0" y="0" width="700" height="300" fill="white"/><text x="350.0" y="22.0" font-family="DejaVu Sans, Arial, sans-serif" font-size="17" font-weight="bold" fill="#111" text-anchor="middle">Contact process for sulphuric acid</text><rect x="50" y="55" width="220" height="40" rx="4" fill="none" stroke="#111" stroke-width="1.6"/><text x="160.0" y="73.0" font-family="DejaVu Sans, Arial, sans-serif" font-size="10.5" font-weight="normal" fill="#111" text-anchor="middle">S / FeS2 + O2  -&gt;</text><text x="160.0" y="88.0" font-family="DejaVu Sans, Arial, sans-serif" font-size="10.5" font-weight="bold" fill="#111" text-anchor="middle">SO2</text><text x="290.0" y="78.0" font-family="DejaVu Sans, Arial, sans-serif" font-size="10" font-weight="normal" fill="#555" text-anchor="start">purify: dust, moisture, As2O3 (poison)</text><rect x="50" y="113" width="220" height="40" rx="4" fill="none" stroke="#111" stroke-width="1.6"/><text x="160.0" y="131.0" font-family="DejaVu Sans, Arial, sans-serif" font-size="10.5" font-weight="normal" fill="#111" text-anchor="middle">2 SO2 + O2  -&gt;</text><text x="160.0" y="146.0" font-family="DejaVu Sans, Arial, sans-serif" font-size="10.5" font-weight="bold" fill="#111" text-anchor="middle">2 SO3</text><text x="290.0" y="136.0" font-family="DejaVu Sans, Arial, sans-serif" font-size="10" font-weight="normal" fill="#555" text-anchor="start">V2O5, ~720 K, ~2 bar  (dH = -197 kJ)</text><rect x="50" y="171" width="220" height="40" rx="4" fill="none" stroke="#111" stroke-width="1.6"/><text x="160.0" y="189.0" font-family="DejaVu Sans, Arial, sans-serif" font-size="10.5" font-weight="normal" fill="#111" text-anchor="middle">SO3 + H2SO4  -&gt;</text><text x="160.0" y="204.0" font-family="DejaVu Sans, Arial, sans-serif" font-size="10.5" font-weight="bold" fill="#111" text-anchor="middle">H2S2O7 (oleum)</text><text x="290.0" y="194.0" font-family="DejaVu Sans, Arial, sans-serif" font-size="10" font-weight="normal" fill="#555" text-anchor="start">NOT SO3 + water (acid mist!)</text><rect x="50" y="229" width="220" height="40" rx="4" fill="none" stroke="#111" stroke-width="1.6"/><text x="160.0" y="247.0" font-family="DejaVu Sans, Arial, sans-serif" font-size="10.5" font-weight="normal" fill="#111" text-anchor="middle">H2S2O7 + H2O  -&gt;</text><text x="160.0" y="262.0" font-family="DejaVu Sans, Arial, sans-serif" font-size="10.5" font-weight="bold" fill="#111" text-anchor="middle">2 H2SO4</text><text x="290.0" y="252.0" font-family="DejaVu Sans, Arial, sans-serif" font-size="10" font-weight="normal" fill="#555" text-anchor="start">dilute -&gt; 96-98% acid</text><text x="350.0" y="275.0" font-family="DejaVu Sans, Arial, sans-serif" font-size="10" font-weight="normal" fill="#333" text-anchor="middle">exothermic + gas moles fall  =&gt;  low T, high P favour yield; ~720 K compromise; excess air; double absorption.</text></svg>