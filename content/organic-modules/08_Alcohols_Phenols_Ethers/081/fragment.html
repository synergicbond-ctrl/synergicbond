<h3 id="s80">21.1 Dehydration of primary alcohols (symmetrical ethers)</h3>
<p>2RCH<sub>2</sub>OH → RCH<sub>2</sub>OCH<sub>2</sub>R + H<sub>2</sub>O (conc. H<sub>2</sub>SO<sub>4</sub>, 413 K, excess alcohol, see section 7.2). Only 1° alcohols; mixed ethers give mixtures. Good for ether, dimethyl ether (Al<sub>2</sub>O<sub>3</sub> or H<sub>2</sub>SO<sub>4</sub>), but not for unsymmetrical ethers.</p>
