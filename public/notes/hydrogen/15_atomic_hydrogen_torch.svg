<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900"><defs>
  <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#030712"/><stop offset="0.55" stop-color="#071426"/><stop offset="1" stop-color="#120a24"/></linearGradient>
  <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0"><stop stop-color="#43e6ff"/><stop offset="0.5" stop-color="#9b8cff"/><stop offset="1" stop-color="#ffb65c"/></linearGradient>
  <filter id="glow"><feGaussianBlur stdDeviation="6" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
  <style>
    .title{font:800 44px Inter,Arial,sans-serif;fill:#f8fafc} .sub{font:400 22px Inter,Arial,sans-serif;fill:#b9c6d8}
    .h{font:750 26px Inter,Arial,sans-serif;fill:#69e7ff} .t{font:400 21px Inter,Arial,sans-serif;fill:#d8e1ee}
    .small{font:400 17px Inter,Arial,sans-serif;fill:#aebbd0} .tiny{font:400 15px Inter,Arial,sans-serif;fill:#8ba0b8}
    .gold{fill:#ffc866} .violet{fill:#b9a2ff} .cyan{fill:#62e8ff} .coral{fill:#ff9c7a} .green{fill:#7be6ab}
    .panel{fill:#07111f;stroke:#284563;stroke-width:2} .panel2{fill:#0d1023;stroke:#5f4a88;stroke-width:2}
    .line{stroke:#63e6ff;stroke-width:4;fill:none} .dash{stroke:#b69cff;stroke-width:4;stroke-dasharray:12 10;fill:none}
    .bond{stroke:#e8f1fb;stroke-width:5} .thin{stroke:#6f829a;stroke-width:2;fill:none}
  </style>
</defs>
<rect width="1600" height="900" fill="url(#bg)"/><rect x="44" y="34" width="1512" height="832" rx="34" fill="none" stroke="#17324d" stroke-width="2"/><text x="78" y="96" class="title">The Atomic Hydrogen Torch</text><rect x="78" y="118" width="430" height="5" rx="3" fill="url(#accent)"/><text x="78" y="158" class="sub">Recombination of atomic hydrogen releases intense, localised heat</text><rect x="78" y="240" width="380" height="140" rx="16" fill="#0d1023" stroke="#62e8ff" stroke-width="2"/><text x="102" y="280" class="h" style="fill:#62e8ff;font-size:22px">H₂ feed</text><text x="102" y="312" class="t">molecular hydrogen</text><line x1="468" y1="310" x2="540" y2="310" stroke="#62e8ff" stroke-width="4"/><path d="M 540 310 L 528 317 L 528 303 Z" fill="#62e8ff"/><rect x="550" y="240" width="420" height="140" rx="16" fill="#0d1023" stroke="#ffc866" stroke-width="2"/><text x="574" y="280" class="h" style="fill:#ffc866;font-size:22px">Electric arc</text><text x="574" y="312" class="t">H₂ → 2 H</text><text x="574" y="338" class="t">the strong H-H bond is broken</text><line x1="970" y1="310" x2="1040" y2="310" stroke="#62e8ff" stroke-width="4"/><path d="M 1040 310 L 1028 317 L 1028 303 Z" fill="#62e8ff"/><rect x="1050" y="240" width="410" height="140" rx="16" fill="#0d1023" stroke="#7be6ab" stroke-width="2"/><text x="1074" y="280" class="h" style="fill:#7be6ab;font-size:22px">Atomic H stream</text><text x="1074" y="312" class="t">highly reactive, short-lived</text><line x1="1255" y1="380" x2="1255" y2="440" stroke="#62e8ff" stroke-width="4"/><path d="M 1255 440 L 1248 428 L 1262 428 Z" fill="#62e8ff"/><rect x="950" y="450" width="510" height="200" rx="16" fill="#0d1023" stroke="#ff9c7a" stroke-width="2"/><text x="974" y="490" class="h" style="fill:#ff9c7a;font-size:22px">Metal surface</text><text x="974" y="522" class="t">2 H → H₂ + heat (released)</text><text x="974" y="548" class="t">H atoms recombine on the work surface,</text><text x="974" y="574" class="t">local temperature ~4000 K</text><rect x="78" y="690" width="800" height="140" rx="14" fill="#0a2630" stroke="#2aaec0"/><text x="100" y="766.0" class="small">Why it becomes so hot: the large H-H bond dissociation enthalpy (~436 kJ/mol) is absorbed to make atomic H, then released again in full when the atoms recombine on the metal — used for high-temperature welding.</text></svg>