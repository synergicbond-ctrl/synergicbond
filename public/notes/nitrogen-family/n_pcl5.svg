Mono','DejaVu Sans Mono',ui-monospace,Menlo,monospace" letter-spacing="0.24em">SYNERGIC BOND</text><path d="M 608 12 l 6 6 l -6 6 l -6 -6 z" fill="none" stroke="#63d39b" stroke-width="1.2"/><text x="20" y="40" font-size="16" font-weight="bold" fill="#f4ecd9" text-anchor="start" font-family="'Georgia','Times New Roman',serif">Phosphorus pentachloride, PCl₅</text><line x1="20" y1="42" x2="620" y2="42" stroke="#232a36" stroke-width="1"/><g transform="translate(0,34)"><line x1="176" y1="168" x2="182" y2="72" stroke="#7fe0a0" stroke-width="3.2"/><line x1="176" y1="168" x2="170" y2="264" stroke="#7fe0a0" stroke-width="3.2"/><polygon points="173,170 96,169 96,179" fill="#7fe0a0"/><line x1="176" y1="168" x2="242" y2="132" stroke="#7fe0a0" stroke-width="3.2"/><line x1="176" y1="168" x2="256" y2="220" stroke="#7fe0a0" stroke-width="2.4" stroke-dasharray="5 4"/><circle cx="182" cy="72" r="14" fill="#0f2418" stroke="#7fe0a0" stroke-width="2"/><text x="182.0" y="75.5" font-size="10" font-weight="bold" fill="#7fe0a0" text-anchor="middle">Cl</text><circle cx="170" cy="264" r="14" fill="#0f2418" stroke="#7fe0a0" stroke-width="2"/><text x="170.0" y="267.5" font-size="10" font-weight="bold" fill="#7fe0a0" text-anchor="middle">Cl</text><circle cx="88" cy="174" r="14" fill="#0f2418" stroke="#7fe0a0" stroke-width="2"/><text x="88.0" y="177.5" font-size="10" font-weight="bold" fill="#7fe0a0" text-anchor="middle">Cl</text><circle cx="242" cy="132" r="14" fill="#0f2418" stroke="#7fe0a0" stroke-width="2"/><text x="242.0" y="135.5" font-size="10" font-weight="bold" fill="#7fe0a0" text-anchor="middle">Cl</text><circle cx="256" cy="220" r="14" fill="#0f2418" stroke="#7fe0a0" stroke-width="2"/><text x="256.0" y="223.5" font-size="10" font-weight="bold" fill="#7fe0a0" text-anchor="middle">Cl</text><circle cx="176" cy="168" r="16" fill="#1b1430" stroke="#c6a6ff" stroke-width="2.4"/><text x="176.0" y="172.0" font-size="12" font-weight="bold" fill="#c6a6ff" text-anchor="middle">P</text><rect x="392" y="96" width="240" height="200" rx="8" fill="#0f1219" stroke="#232a36" stroke-width="1.3"/><text x="512.0" y="118.0" font-size="9.5" font-weight="bold" fill="#f4ecd9" text-anchor="middle">solid state — ionic</text><text x="452.0" y="150.0" font-size="11" font-weight="bold" fill="#63d39b" text-anchor="middle">[PCl₄]⁺</text><text x="452.0" y="166.0" font-size="7.6" font-weight="normal" fill="#93a1b5" text-anchor="middle">tetrahedral</text><text x="576.0" y="150.0" font-size="11" font-weight="bold" fill="#ff8f6e" text-anchor="middle">[PCl₆]⁻</text><text x="576.0" y="166.0" font-size="7.6" font-weight="normal" fill="#93a1b5" text-anchor="middle">octahedral</text><path d="M 452 182 L 434 210 L 470 210 Z M 452 182 L 452 210 M 434 210 L 452 224 L 470 210" stroke="#63d39b" stroke-width="1.3" fill="none"/><path d="M 576 184 v 40 M 556 204 h 40 M 562 192 L 590 216 M 590 192 L 562 216" stroke="#ff8f6e" stroke-width="1.2" fill="none"/><circle cx="576" cy="204" r="3" fill="#ff8f6e"/><text x="512.0" y="258.0" font-size="7.8" font-weight="normal" fill="#93a1b5" text-anchor="middle">PCl₅ (gas / melt) is molecular TBP; the solid is [PCl₄]⁺[PCl₆]⁻</text><text x="512.0" y="274.0" font-size="7.8" font-weight="normal" fill="#93a1b5" text-anchor="middle">PBr₅ solid is [PBr₄]⁺ Br⁻ — Br⁻ is too big for six around P</text><text x="200.0" y="288.0" font-size="7.8" font-weight="normal" fill="#93a1b5" text-anchor="middle">axial P–Cl 240 pm (longer, weaker)  ·  equatorial 202 pm</text><text x="330.0" y="344.0" font-size="8.6" font-weight="normal" fill="#93a1b5" text-anchor="middle">P is sp³d: five σ bonds, no lone pair — a trigonal bipyramid</text><text x="330.0" y="364.0" font-size="9" font-weight="bold" fill="#dbe3ef" text-anchor="middle">hydrolyses fully:  PCl₅ + 4 H₂O → H₃PO₄ + 5 HCl</text></g></svg>