ll="#f4ecd9" text-anchor="start" font-family="'Georgia','Times New Roman',serif">Heavy water  —  preferential electrolysis of D2O</text><line x1="20" y1="42" x2="520" y2="42" stroke="#232a36" stroke-width="1"/><g transform="translate(0,34)"><rect x="150" y="70" width="240" height="140" rx="6" fill="rgba(120,190,235,0.08)" stroke="#4db8e8" stroke-width="2"/><rect x="156" y="128" width="228" height="78" rx="3" fill="rgba(90,175,225,0.16)" stroke="none" stroke-width="1.6"/><text x="270.0" y="175.0" font-size="10" font-weight="normal" fill="#dbe3ef" text-anchor="middle">alkaline water  (trace D2O)</text><rect x="212" y="60" width="12" height="110" rx="4" fill="#39414f" stroke="#232a36" stroke-width="1.6"/><text x="218.0" y="228.0" font-size="8.5" font-weight="normal" fill="#8b98ac" text-anchor="middle">anode</text><rect x="316" y="60" width="12" height="110" rx="4" fill="#5b6675" stroke="#232a36" stroke-width="1.6"/><text x="322.0" y="228.0" font-size="8.5" font-weight="normal" fill="#8b98ac" text-anchor="middle">cathode</text><path d="M 218.0 60.0 L 218.0 40.0 L 188.0 40.0" fill="none" stroke="#dbe3ef" stroke-width="2" stroke-linejoin="round"/><text x="180.0" y="40.0" font-size="11" font-weight="bold" fill="#4db8e8" text-anchor="end">O2</text><path d="M 322.0 60.0 L 322.0 40.0 L 352.0 40.0" fill="none" stroke="#dbe3ef" stroke-width="2" stroke-linejoin="round"/><text x="360.0" y="40.0" font-size="11" font-weight="bold" fill="#63d39b" text-anchor="start">H2</text><text x="270.0" y="258.0" font-size="9.5" font-weight="normal" fill="#8b98ac" text-anchor="middle">H-O bonds electrolyse faster than D-O, so the residue is enriched in D2O</text><text x="270.0" y="280.0" font-size="9.5" font-weight="normal" fill="#4db8e8" text-anchor="middle">~30 cascaded stages take natural 1 : 6400 up to ~99.8 % D2O</text></g></svg>