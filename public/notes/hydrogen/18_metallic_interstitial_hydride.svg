<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900"><defs>
  <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#030712"/><stop offset="0.55" stop-color="#071426"/><stop offset="1" stop-color="#120a24"/></linearGradient>
  <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0"><stop stop-color="#43e6ff"/><stop offset="0.5" stop-color="#9b8cff"/><stop offset="1" stop-color="#ffb65c"/></linearGradient>
  <filter id="glow"><feGaussianBlur stdDeviation="6" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
  <style>
    .title{font:800 44px Inter,Arial,sans-serif;fill:#f8fafc} .sub{font:400 22px Inter,Arial,sans-serif;fill:#b9c6d8}
    .h{font:750 26px Inter,Arial,sans-serif;fill:#69e7ff} .t{font:400 17px Inter,Arial,sans-serif;fill:#d8e1ee}
    .small{font:400 17px Inter,Arial,sans-serif;fill:#aebbd0} .tiny{font:400 15px Inter,Arial,sans-serif;fill:#8ba0b8}
    .gold{fill:#ffc866} .violet{fill:#b9a2ff} .cyan{fill:#62e8ff} .coral{fill:#ff9c7a} .green{fill:#7be6ab}
    .panel{fill:#07111f;stroke:#284563;stroke-width:2} .panel2{fill:#0d1023;stroke:#5f4a88;stroke-width:2}
    .line{stroke:#63e6ff;stroke-width:4;fill:none} .dash{stroke:#b69cff;stroke-width:4;stroke-dasharray:12 10;fill:none}
    .bond{stroke:#e8f1fb;stroke-width:5} .thin{stroke:#6f829a;stroke-width:2;fill:none}
  </style>
</defs>
<rect width="1600" height="900" fill="url(#bg)"/><rect x="44" y="34" width="1512" height="832" rx="34" fill="none" stroke="#17324d" stroke-width="2"/><text x="78" y="96" class="title">Metallic (interstitial) hydrides</text><rect x="78" y="118" width="430" height="5" rx="3" fill="url(#accent)"/><text x="78" y="158" class="sub">H atoms occupy octahedral holes of the host metal lattice — non-stoichiometric</text><rect x="78" y="190" width="760" height="560" rx="26" class="panel"/><text x="112" y="240" class="h">Pd lattice + absorbed H</text><circle cx="220.0" cy="340.0" r="26" fill="#122a4a" stroke="#4db8e8" stroke-width="3"/><text x="220.0" y="347.0" class="small" text-anchor="middle">Pd</text><circle cx="275.0" cy="434.6" r="26" fill="#122a4a" stroke="#4db8e8" stroke-width="3"/><text x="275.0" y="441.6" class="small" text-anchor="middle">Pd</text><circle cx="220.0" cy="529.2" r="26" fill="#122a4a" stroke="#4db8e8" stroke-width="3"/><text x="220.0" y="536.2" class="small" text-anchor="middle">Pd</text><circle cx="330.0" cy="340.0" r="26" fill="#122a4a" stroke="#4db8e8" stroke-width="3"/><text x="330.0" y="347.0" class="small" text-anchor="middle">Pd</text><circle cx="385.0" cy="434.6" r="26" fill="#122a4a" stroke="#4db8e8" stroke-width="3"/><text x="385.0" y="441.6" class="small" text-anchor="middle">Pd</text><circle cx="330.0" cy="529.2" r="26" fill="#122a4a" stroke="#4db8e8" stroke-width="3"/><text x="330.0" y="536.2" class="small" text-anchor="middle">Pd</text><circle cx="440.0" cy="340.0" r="26" fill="#122a4a" stroke="#4db8e8" stroke-width="3"/><text x="440.0" y="347.0" class="small" text-anchor="middle">Pd</text><circle cx="495.0" cy="434.6" r="26" fill="#122a4a" stroke="#4db8e8" stroke-width="3"/><text x="495.0" y="441.6" class="small" text-anchor="middle">Pd</text><circle cx="440.0" cy="529.2" r="26" fill="#122a4a" stroke="#4db8e8" stroke-width="3"/><text x="440.0" y="536.2" class="small" text-anchor="middle">Pd</text><circle cx="275" cy="371.5" r="12" fill="#241206" stroke="#ffc866" stroke-width="3" filter="url(#glow)"/><text x="275" y="376.5" class="tiny" text-anchor="middle">H</text><circle cx="385" cy="371.5" r="12" fill="#241206" stroke="#ffc866" stroke-width="3" filter="url(#glow)"/><text x="385" y="376.5" class="tiny" text-anchor="middle">H</text><circle cx="330" cy="466.1" r="12" fill="#241206" stroke="#ffc866" stroke-width="3" filter="url(#glow)"/><text x="330" y="471.1" class="tiny" text-anchor="middle">H</text><circle cx="275" cy="497.7" r="12" fill="#241206" stroke="#ffc866" stroke-width="3" filter="url(#glow)"/><text x="275" y="502.7" class="tiny" text-anchor="middle">H</text><circle cx="385" cy="497.7" r="12" fill="#241206" stroke="#ffc866" stroke-width="3" filter="url(#glow)"/><text x="385" y="502.7" class="tiny" text-anchor="middle">H</text><circle cx="440" cy="466.1" r="12" fill="#241206" stroke="#ffc866" stroke-width="3" filter="url(#glow)"/><text x="440" y="471.1" class="tiny" text-anchor="middle">H</text><text x="120" y="720" class="small">PdH₀.₇ typical — formula is non-stoichiometric (variable x in MHₓ)</text><rect x="878" y="190" width="660" height="560" rx="26" class="panel2"/><text x="912" y="240" class="h">Key features</text><circle cx="908" cy="284" r="4" fill="#ffc866"/><text x="928" y="290" class="t">Formed by: transition metals (Pd, Pt, Ni, rare earths) absorbing H₂ gas</text><circle cx="908" cy="346" r="4" fill="#ffc866"/><text x="928" y="352" class="t">H atoms sit in octahedral / tetrahedral interstitial holes of the metal lattice</text><circle cx="908" cy="408" r="4" fill="#ffc866"/><text x="928" y="414" class="t">Composition is non-stoichiometric: MHₓ, x is not a small whole number</text><circle cx="908" cy="470" r="4" fill="#ffc866"/><text x="928" y="476" class="t">Metallic lustre, conductivity, and malleability are retained</text><circle cx="908" cy="532" r="4" fill="#ffc866"/><text x="928" y="538" class="t">Pd absorbs up to ~900× its own volume of H₂ (used for H₂ purification)</text><circle cx="908" cy="594" r="4" fill="#ffc866"/><text x="928" y="600" class="t">Occlusion is reversible — heating releases the absorbed H₂ again</text></svg>