<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 620" width="900" height="620"><rect x="0" y="0" width="900" height="620" fill="#0a0c11"/><text x="450.0" y="22.0" text-anchor="middle" font-family='Inter,Arial,sans-serif' font-size="11.5" font-weight="800" fill="#7cc4ff" style="letter-spacing:1.6px;">GROUP 15 · PHOSPHORUS PENTACHLORIDE</text><text x="450.0" y="70.0" text-anchor="middle" font-family='Inter,Arial,sans-serif' font-size="22" font-weight="800" fill="#ffffff" style="">PCl₅ hydrolysis changes mechanism partway</text><path d="M 90 480 L 230 220 L 360 340 L 520 180 L 700 470" stroke="#7cc4ff" stroke-width="3.2" fill="none"/><line x1="90.0" y1="486.0" x2="90.0" y2="164.0" stroke="#9fb2c4" stroke-width="2" stroke-linecap="round"/><text x="230.0" y="195.0" text-anchor="middle" font-family='Inter,Arial,sans-serif' font-size="15" font-weight="600" fill="#7cc4ff" style="">‡₁</text><text x="360.0" y="370.0" text-anchor="middle" font-family='Inter,Arial,sans-serif' font-size="13" font-weight="600" fill="#ffffff" style="">POCl₃ + HCl</text><text x="360.0" y="392.0" text-anchor="middle" font-family='Inter,Arial,sans-serif' font-size="10" font-weight="400" fill="#9fb2c4" style="">(isolable, limited H₂O)</text><text x="520.0" y="155.0" text-anchor="middle" font-family='Inter,Arial,sans-serif' font-size="12" font-weight="600" fill="#7cc4ff" style="">‡₂ (addition–elimination)</text><text x="90.0" y="530.0" text-anchor="middle" font-family='Inter,Arial,sans-serif' font-size="15" font-weight="600" fill="#ffffff" style="">PCl₅ + H₂O</text><text x="700.0" y="500.0" text-anchor="middle" font-family='Inter,Arial,sans-serif' font-size="13" font-weight="600" fill="#ffffff" style="">H₃PO₄ + HCl (excess H₂O)</text><text x="450.0" y="560.0" text-anchor="middle" font-family='Inter,Arial,sans-serif' font-size="14" font-weight="400" fill="#9fb2c4" style="font-style:italic;">Step 1 (limited water): substitution at P — POCl₃ is isolable. Step 2 (excess water):</text><text x="450.0" y="581.0" text-anchor="middle" font-family='Inter,Arial,sans-serif' font-size="14" font-weight="400" fill="#9fb2c4" style="font-style:italic;">addition–elimination at P (as for SOCl₂), repeated 3× more → H₃PO₄ + 3HCl.</text><text x="450.0" y="602.0" text-anchor="middle" font-family='Inter,Arial,sans-serif' font-size="14" font-weight="400" fill="#9fb2c4" style="font-style:italic;">Overall: PCl₅ + 4H₂O → H₃PO₄ + 5HCl. P₄O₁₀ hydrates by the same addition–elimination</text><text x="450.0" y="623.0" text-anchor="middle" font-family='Inter,Arial,sans-serif' font-size="14" font-weight="400" fill="#9fb2c4" style="font-style:italic;">motif, opening its bridging P–O–P bonds to give 4H₃PO₄.</text></svg>