<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Crystal Lab — Solid State</title>
<style>
:root { --bg:#040606; --surface:#0b0f10; --surface-2:#101516; --fg:#f6efdf; --body:#f1eee7; --muted:#b9b5ad;
  --line:rgba(246,239,223,.17); --accent:#e3b341; }
* { box-sizing: border-box; }
html, body { margin: 0; background: var(--bg); color: var(--body); font: 15px/1.55 "Inter Tight", Inter, system-ui, -apple-system, sans-serif; }
a { color: var(--accent); }
.wrap { max-width: 1320px; margin: 0 auto; padding: 16px; }
header.top { display: flex; flex-wrap: wrap; align-items: baseline; justify-content: space-between; gap: 8px 16px; margin-bottom: 12px; }
header.top h1 { margin: 0; font-size: 1.8rem; color: var(--fg); letter-spacing: -0.02em; }
header.top h1 span { color: var(--accent); }
header.top p { margin: 0; color: var(--muted); }
.chips { display: flex; flex-wrap: wrap; gap: 6px; margin: 0 0 10px; }
.chips button { appearance: none; border: 1px solid var(--line); background: var(--surface); color: var(--fg); border-radius: 999px; padding: 7px 13px; font: 600 13px/1 inherit; cursor: pointer; transition: border-color .2s, background .2s, transform .15s, box-shadow .2s; }
.chips button:hover { border-color: var(--accent); }
.chips button[aria-pressed="true"] { background: var(--accent); color: #111; border-color: var(--accent);  }
.chips button:active { transform: scale(.97); }
.grid { display: grid; gap: 14px; grid-template-columns: minmax(0, 1fr) 350px; }
@media (max-width: 980px) { .grid { grid-template-columns: 1fr; } }
.stage { position: relative; border: 1px solid var(--line); border-radius: 18px; overflow: hidden; min-height: 480px; background: #040606; box-shadow: 0 30px 80px rgba(0,0,0,.6), inset 0 0 0 1px rgba(255,255,255,.02); }
.stage canvas { display: block; width: 100%; height: 100%; cursor: grab; outline: none; }
.stage canvas:active { cursor: grabbing; }
.hud { position: absolute; left: 16px; top: 14px; right: 16px; display: flex; justify-content: space-between; pointer-events: none; font-size: 13px; color: var(--muted); }
.hud b { color: var(--fg); }
.big { position: absolute; left: 16px; bottom: 14px; pointer-events: none; max-width: 70%; }
.big .num { font: 800 40px/1 inherit; color: var(--accent); letter-spacing: -0.03em; }
.big .cap { color: var(--muted); font-size: 13px; margin-top: 4px; }
.legend { position: absolute; right: 16px; bottom: 14px; display: flex; flex-direction: column; gap: 4px; font-size: 12px; color: var(--muted); pointer-events: none; text-align: right; }
.legend i { display: inline-block; width: 10px; height: 10px; border-radius: 50%; margin-left: 6px; vertical-align: -1px; }
#labels { position: absolute; inset: 0; pointer-events: none; }
.lbl { position: absolute; left: 0; top: 0; font: 600 11px/1 inherit; color: var(--accent); background: rgba(4,6,6,.82); border: 1px solid rgba(227,179,65,.5); border-radius: 999px; padding: 3px 7px; white-space: nowrap; }
table.sites { width: 100%; border-collapse: collapse; margin: 0 0 12px; font-size: 13px; }
table.sites th, table.sites td { text-align: left; padding: 6px 6px; border-bottom: 1px solid var(--line); color: var(--fg); }
table.sites th { color: var(--muted); font-weight: 600; }
table.sites tfoot td { color: var(--accent); font-weight: 700; border-bottom: 0; }
.dot { display: inline-block; width: 10px; height: 10px; border-radius: 50%; margin-right: 8px; vertical-align: -1px; }
.lbl.tag { width: 18px; height: 18px; padding: 0; display: grid; place-items: center; border: 0; border-radius: 50%; color: #ffffff; font: 800 11px/1 inherit; text-shadow: 0 1px 1px rgba(0,0,0,.35); box-shadow: 0 0 0 1.5px rgba(255,255,255,.75); }
.tagdot { display: inline-grid; place-items: center; width: 18px; height: 18px; border-radius: 50%; margin-right: 8px; color: #ffffff; font: 800 11px/1 inherit; font-style: normal; vertical-align: -3px; }
.btn[aria-pressed="true"] { background: var(--accent); color: #111; border-color: var(--accent); }
.embed header.top, .embed #structs, .embed footer { display: none; }
.embed .wrap { padding: 6px; }
.embed .stage { min-height: 400px; }
.panel { background: linear-gradient(180deg, #0d1213, #0a0e0f); border: 1px solid var(--line); border-radius: 18px; padding: 16px 18px; }
.panel h2 { margin: 0 0 4px; font-size: 1.3rem; color: var(--fg); letter-spacing: -0.01em; }
.panel .sub { margin: 0 0 12px; color: var(--muted); font-size: 13px; }
dl.facts { display: grid; grid-template-columns: auto 1fr; gap: 7px 12px; margin: 0 0 12px; }
dl.facts dt { color: var(--muted); font-size: 13px; }
dl.facts dd { margin: 0; color: var(--fg); font-weight: 600; }
.tally { min-height: 3.2em; padding: 10px 12px; border-radius: 12px; background: var(--surface-2); border: 1px solid var(--line); font: 600 14px/1.55 ui-monospace, "JetBrains Mono", monospace; color: var(--fg); margin-bottom: 12px; }
.tally .hl { color: var(--accent); }
.row { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; margin-bottom: 10px; }
.row label { color: var(--muted); font-size: 13px; }
.row input[type=number] { width: 54px; background: var(--surface-2); color: var(--fg); border: 1px solid var(--line); border-radius: 8px; padding: 5px 6px; font: inherit; }
.row input[type=range] { accent-color: var(--accent); flex: 1; }
.note { font-size: 13px; color: var(--muted); margin: 8px 0 0; }
.btn { appearance: none; border: 1px solid var(--line); background: var(--surface-2); color: var(--fg); border-radius: 10px; padding: 8px 12px; font: 600 13px/1 inherit; cursor: pointer; transition: border-color .2s, box-shadow .2s; }
.btn:hover { border-color: var(--accent); box-shadow: 0 0 18px rgba(227,179,65,.25); }
footer { color: var(--muted); font-size: 12px; margin-top: 14px; }
.nogl { padding: 40px; color: var(--muted); }
</style>
</head>
<body>
<div class="wrap">
  <header class="top">
    <h1>Crystal <span>Lab</span></h1>
    <p>Drag to orbit · scroll or pinch to zoom · arrow keys work too</p>
  </header>
  <div class="chips" role="group" aria-label="Structure" id="structs"></div>
  <div class="chips" role="group" aria-label="Mode" id="modes"></div>
  <div class="grid">
    <div class="stage" id="stage">
      <div class="hud"><span id="hudL"></span><span id="hudR"></span></div>
      <div id="labels"></div>
      <div class="big"><div class="num" id="bigNum"></div><div class="cap" id="bigCap"></div></div>
      <div class="legend" id="legend"></div>
    </div>
    <aside class="panel" aria-live="polite">
      <h2 id="title"></h2>
      <p class="sub" id="subtitle"></p>
      <dl class="facts" id="facts"></dl>
      <div class="tally" id="tally"></div>
      <div id="controls"></div>
      <p class="note" id="note"></p>
    </aside>
  </div>
  <footer>Solid State · <a href="index.html">Chapter contents</a> · <a href="solid-state-interactive.html">Interactive chapter</a></footer>
</div>
<script>/*BUNDLE*/</script>
</body>
</html>
