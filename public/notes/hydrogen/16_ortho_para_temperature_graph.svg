<rect width="1600" height="900" fill="url(#bg)"/><rect x="44" y="34" width="1512" height="832" rx="34" fill="none" stroke="#17324d" stroke-width="2"/><text x="78" y="96" class="title">Ortho/Para-H₂: Equilibrium Composition vs Temperature</text><rect x="78" y="118" width="430" height="5" rx="3" fill="url(#accent)"/><text x="78" y="158" class="sub">The high-T statistical limit approaches 3:1 ortho:para</text><line x1="220" y1="640" x2="220" y2="260" class="thin"/><line x1="220" y1="640" x2="1380" y2="640" class="thin"/><text x="160" y="280" class="small" transform="rotate(-90 160 280)">Mole fraction</text><text x="1320" y="680" class="small">Temperature →</text><line x1="212" y1="545.0" x2="220" y2="545.0" class="thin"/><text x="204" y="550.0" class="tiny" text-anchor="end">25%</text><line x1="212" y1="355.0" x2="220" y2="355.0" class="thin"/><text x="204" y="360.0" class="tiny" text-anchor="end">75%</text><path d="M 220 450 L 249 442 L 278 435 L 307 429 L 336 423 L 365 417 L 394 412 L 423 407 L 452 403 L 481 399 L 510 396 L 539 392 L 568 389 L 597 386 L 626 384 L 655 382 L 684 379 L 713 377 L 742 376 L 771 374 L 800 372 L 829 371 L 858 370 L 887 368 L 916 367 L 945 366 L 974 365 L 1003 365 L 1032 364 L 1061 363 L 1090 362 L 1119 362 L 1148 361 L 1177 361 L 1206 360 L 1235 360 L 1264 359 L 1293 359 L 1322 359 L 1351 358 L 1380 358" class="line"/><path d="M 220 450 L 249 458 L 278 465 L 307 471 L 336 477 L 365 483 L 394 488 L 423 493 L 452 497 L 481 501 L 510 504 L 539 508 L 568 511 L 597 514 L 626 516 L 655 518 L 684 521 L 713 523 L 742 524 L 771 526 L 800 528 L 829 529 L 858 530 L 887 532 L 916 533 L 945 534 L 974 535 L 1003 535 L 1032 536 L 1061 537 L 1090 538 L 1119 538 L 1148 539 L 1177 539 L 1206 540 L 1235 540 L 1264 541 L 1293 541 L 1322 541 L 1351 542 L 1380 542" stroke="#7be6ab" stroke-width="4" fill="none" stroke-dasharray="10 8"/><text x="1200" y="336.0" class="t" style="fill:#62e8ff">ortho ≈ 75%</text><text x="1200" y="564.0" class="t" style="fill:#7be6ab">para ≈ 25%</text><text x="360" y="275.2" class="small">very low T: para dominates</text><rect x="78" y="690" width="1460" height="100" rx="14" fill="#0a2630" stroke="#2aaec0"/><text x="100" y="746.0" class="small">Para-H₂ (antiparallel nuclear spins, I = 0) is the lower-energy species; ortho-H₂ (parallel spins, I = 1) is 3-fold spin-degenerate. As T → ∞, the statistical ortho:para ratio approaches 3:1.</text></svg>