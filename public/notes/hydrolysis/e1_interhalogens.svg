            orient="auto"><path d="M0,0 L6,3 L0,6 Z" fill="#ffffff"/></marker></defs><line x1="400" y1="390" x2="620" y2="390" stroke="#ffffff" stroke-width="2.2" marker-end="url(#sa85281)"/><text x="660.0" y="390.0" text-anchor="start" font-family='Inter,Arial,sans-serif' font-size="14" font-weight="600" fill="#ffffff" style="">HBrO₃ + 5HF</text><text x="870.0" y="390.0" text-anchor="start" font-family='Inter,Arial,sans-serif' font-size="11" font-weight="400" fill="#9fb2c4" style="">Br stays +5</text><text x="60.0" y="510.0" text-anchor="start" font-family='Inter,Arial,sans-serif' font-size="15" font-weight="600" fill="#ffffff" style="">F₇I (pent. bipyramidal)</text><text x="60.0" y="532.0" text-anchor="start" font-family='Inter,Arial,sans-serif' font-size="10" font-weight="400" fill="#9fb2c4" style="">successive subst. at I</text><defs><marker id="sa90798" markerWidth="8" markerHeight="8" refX="5" refY="3"
            orient="auto"><path d="M0,0 L6,3 L0,6 Z" fill="#ffffff"/></marker></defs><line x1="400" y1="510" x2="620" y2="510" stroke="#ffffff" stroke-width="2.2" marker-end="url(#sa90798)"/><text x="660.0" y="510.0" text-anchor="start" font-family='Inter,Arial,sans-serif' font-size="14" font-weight="600" fill="#ffffff" style="">H₅IO₆ + 7HF</text><text x="870.0" y="510.0" text-anchor="start" font-family='Inter,Arial,sans-serif' font-size="11" font-weight="400" fill="#9fb2c4" style="">I stays +7</text></svg>