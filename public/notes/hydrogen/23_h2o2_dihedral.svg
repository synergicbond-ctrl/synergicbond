<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900"><defs>
  <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#030712"/><stop offset="0.55" stop-color="#071426"/><stop offset="1" stop-color="#120a24"/></linearGradient>
  <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0"><stop stop-color="#43e6ff"/><stop offset="0.5" stop-color="#9b8cff"/><stop offset="1" stop-color="#ffb65c"/></linearGradient>
  <filter id="glow"><feGaussianBlur stdDeviation="6" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
  <style>
    .title{font:800 44px Inter,Arial,sans-serif;fill:#f8fafc} .sub{font:400 22px Inter,Arial,sans-serif;fill:#b9c6d8}
    .h{font:750 26px Inter,Arial,sans-serif;fill:#69e7ff} .t{font:400 21px Inter,Arial,sans-serif;fill:#d8e1ee}
    .small{font:400 17px Inter,Arial,sans-serif;fill:#aebbd0} .tiny{font:400 15px Inter,Arial,sans-serif;fill:#8ba0b8}
    .gold{fill:#ffc866} .violet{fill:#b9a2ff} .cyan{fill:#62e8ff} .coral{fill:#ff9c7a} .green{fill:#7be6ab}
    .panel{fill:#07111f;stroke:#284563;stroke-width:2} .panel2{fill:#0d1023;stroke:#5f4a88;stroke-width:2}
    .line{stroke:#63e6ff;stroke-width:4;fill:none} .dash{stroke:#b69cff;stroke-width:4;stroke-dasharray:12 10;fill:none}
    .bond{stroke:#e8f1fb;stroke-width:5} .thin{stroke:#6f829a;stroke-width:2;fill:none}
  </style>
</defs>
<rect width="1600" height="900" fill="url(#bg)"/><rect x="44" y="34" width="1512" height="832" rx="34" fill="none" stroke="#17324d" stroke-width="2"/><text x="78" y="96" class="title">H₂O₂ — the Non-Planar "Open-Book" Geometry</text><rect x="78" y="118" width="430" height="5" rx="3" fill="url(#accent)"/><text x="78" y="158" class="sub">The molecule is chiral-shaped and polar; oxygen is at oxidation state -1</text><line x1="620" y1="460" x2="780" y2="460" class="bond"/><line x1="620" y1="460" x2="500" y2="380" class="thin"/><line x1="780" y1="460" x2="900" y2="540" class="thin"/><circle cx="620" cy="460" r="32" fill="#111a2b" stroke="#7db4ff" stroke-width="4" filter="url(#glow)"/><text x="620" y="460" class="t" text-anchor="middle" style="fill:#7db4ff;font-weight:800">O</text><circle cx="780" cy="460" r="32" fill="#111a2b" stroke="#7db4ff" stroke-width="4" filter="url(#glow)"/><text x="780" y="460" class="t" text-anchor="middle" style="fill:#7db4ff;font-weight:800">O</text><circle cx="500" cy="380" r="20" fill="#221d12" stroke="#ffc866" stroke-width="4" filter="url(#glow)"/><text x="500" y="380" class="small" text-anchor="middle" style="fill:#ffc866">H</text><circle cx="900" cy="540" r="20" fill="#221d12" stroke="#ffc866" stroke-width="4" filter="url(#glow)"/><text x="900" y="540" class="small" text-anchor="middle" style="fill:#ffc866">H</text><path d="M 660 420 Q 700 400 740 420" stroke="#ff9c7a" stroke-width="2" fill="none" stroke-dasharray="4 4"/><text x="700" y="400" class="small" text-anchor="middle" style="fill:#ff9c7a">dihedral angle</text><rect x="1050" y="300" width="400" height="260" rx="26" class="panel"/><text x="1084" y="350" class="h">Data</text><text x="1086" y="360" class="t">gas phase: ≈111.5°</text><text x="1086" y="390" class="t">solid phase (110 K): ≈90.2°</text><text x="1086" y="420" class="t"></text><text x="1086" y="450" class="t">O-O ≈147.5 pm</text><text x="1086" y="480" class="t">O-H ≈95 pm</text><text x="1086" y="510" class="t">each O is sp³</text><rect x="78" y="640" width="1460" height="90" rx="14" fill="#0a2630" stroke="#2aaec0"/><text x="100" y="691.0" class="small">The dihedral (open-book) fold minimises lone-pair repulsion between the two oxygens; the fold angle shrinks in the solid state due to hydrogen bonding in the crystal.</text></svg>