<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900"><defs>
  <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#030712"/><stop offset="0.55" stop-color="#071426"/><stop offset="1" stop-color="#120a24"/></linearGradient>
  <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0"><stop stop-color="#43e6ff"/><stop offset="0.5" stop-color="#9b8cff"/><stop offset="1" stop-color="#ffb65c"/></linearGradient>
  <filter id="glow"><feGaussianBlur stdDeviation="6" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
  <style>
    .title{font:800 44px Inter,Arial,sans-serif;fill:#f8fafc} .sub{font:400 22px Inter,Arial,sans-serif;fill:#b9c6d8}
    .h{font:750 26px Inter,Arial,sans-serif;fill:#69e7ff} .t{font:400 21px Inter,Arial,sans-serif;fill:#d8e1ee}
    .small{font:400 17px Inter,Arial,sans-serif;fill:#aebbd0} .tiny{font:400 15px Inter,Arial,sans-serif;fill:#8ba0b8}
    .gold{fill:#ffc866} .violet{fill:#b9a2ff} .cyan{fill:#62e8ff} .coral{fill:#ff9c7a} .green{fill:#7be6ab}
    .panel{fill:#07111f;stroke:#284563;stroke-width:2} .panel2{fill:#0d1023;stroke:#5f4a88;stroke-width:2}
    .line{stroke:#63e6ff;stroke-width:4;fill:none} .dash{stroke:#b69cff;stroke-width:4;stroke-dasharray:12 10;fill:none}
    .bond{stroke:#e8f1fb;stroke-width:5} .thin{stroke:#6f829a;stroke-width:2;fill:none}
  </style>
</defs>
<rect width="1600" height="900" fill="url(#bg)"/><rect x="44" y="34" width="1512" height="832" rx="34" fill="none" stroke="#17324d" stroke-width="2"/><text x="78" y="96" class="title">Hydrogen Bonding</text><rect x="78" y="118" width="430" height="5" rx="3" fill="url(#accent)"/><text x="78" y="158" class="sub">Intermolecular and intramolecular hydrogen bonds</text><rect x="78" y="210" width="700" height="380" rx="26" class="panel"/><text x="112" y="260" class="h">Intermolecular — between molecules</text><circle cx="280" cy="420" r="30" fill="#2a1416" stroke="#ff8f8f" stroke-width="4"/><text x="280" y="420" class="t" text-anchor="middle" style="fill:#ff8f8f;font-weight:800">O</text><circle cx="560" cy="420" r="30" fill="#2a1416" stroke="#ff8f8f" stroke-width="4"/><text x="560" y="420" class="t" text-anchor="middle" style="fill:#ff8f8f;font-weight:800">O</text><line x1="280" y1="420" x2="350" y2="374" class="bond"/><circle cx="350" cy="374" r="18" fill="#221d12" stroke="#ffc866" stroke-width="4"/><text x="350" y="380" class="small" text-anchor="middle" style="fill:#ffc866">H</text><line x1="280" y1="420" x2="350" y2="466" class="bond"/><circle cx="350" cy="466" r="18" fill="#221d12" stroke="#ffc866" stroke-width="4"/><text x="350" y="472" class="small" text-anchor="middle" style="fill:#ffc866">H</text><line x1="560" y1="420" x2="490" y2="374" class="bond"/><circle cx="490" cy="374" r="18" fill="#221d12" stroke="#ffc866" stroke-width="4"/><text x="490" y="380" class="small" text-anchor="middle" style="fill:#ffc866">H</text><line x1="560" y1="420" x2="490" y2="466" class="bond"/><circle cx="490" cy="466" r="18" fill="#221d12" stroke="#ffc866" stroke-width="4"/><text x="490" y="472" class="small" text-anchor="middle" style="fill:#ffc866">H</text><line x1="350" y1="374" x2="490" y2="374" class="dash" stroke-dasharray="10 8"/><text x="420" y="350" class="small" text-anchor="middle">O-H...O hydrogen bond</text><rect x="820" y="210" width="720" height="380" rx="26" class="panel"/><text x="854" y="260" class="h">Intramolecular — within one molecule</text><circle cx="1090" cy="440" r="90" fill="none" stroke="#6f829a" stroke-width="2"/><text x="1090" y="445" class="tiny" text-anchor="middle">aromatic ring</text><circle cx="1160" cy="330" r="22" fill="#111a2b" stroke="#7db4ff" stroke-width="4"/><text x="1160" y="330" class="small" text-anchor="middle" style="fill:#7db4ff">N</text><line x1="1160" y1="330" x2="1190" y2="296" class="bond"/><circle cx="1190" cy="296" r="16" fill="#221d12" stroke="#ffc866" stroke-width="4"/><text x="1190" y="296" class="tiny" text-anchor="middle" style="fill:#ffc866">H</text><circle cx="1030" cy="360" r="22" fill="#2a1416" stroke="#ff8f8f" stroke-width="4"/><text x="1030" y="360" class="small" text-anchor="middle" style="fill:#ff8f8f">O</text><line x1="1190" y1="296" x2="1030" y2="360" class="dash" stroke-dasharray="10 8"/><text x="1090" y="500" class="tiny" text-anchor="middle">classic exam case: o-nitrophenol-type intramolecular H-bond</text><rect x="78" y="620" width="1460" height="100" rx="14" fill="#0a2630" stroke="#2aaec0"/><text x="100" y="676.0" class="small">Hydrogen bonding raises boiling point, viscosity and molecular association. It is strongest when H is attached directly to a small, highly electronegative atom — N, O or F.</text></svg>