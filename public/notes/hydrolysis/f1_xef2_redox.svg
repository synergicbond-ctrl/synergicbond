<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 700" width="1000" height="700"><rect x="0" y="0" width="1000" height="700" fill="#0a0c11"/><text x="500.0" y="22.0" text-anchor="middle" font-family='Inter,Arial,sans-serif' font-size="11.5" font-weight="800" fill="#7cc4ff" style="letter-spacing:1.6px;">XENON FLUORIDES</text><text x="500.0" y="70.0" text-anchor="middle" font-family='Inter,Arial,sans-serif' font-size="22" font-weight="800" fill="#ffffff" style="">XeF₂ hydrolysis is a redox reaction</text><line x1="144.0" y1="220.0" x2="206.0" y2="220.0" stroke="#9fb2c4" stroke-width="2.6" stroke-linecap="round"/><text x="110.0" y="227.0" text-anchor="middle" font-family='Inter,Arial,sans-serif' font-size="19" font-weight="600" fill="#ffffff" style="">F</text><line x1="234.0" y1="220.0" x2="296.0" y2="220.0" stroke="#9fb2c4" stroke-width="2.6" stroke-linecap="round"/><text x="330.0" y="227.0" text-anchor="middle" font-family='Inter,Arial,sans-serif' font-size="19" font-weight="600" fill="#ffffff" style="">F</text><text x="220.0" y="227.0" text-anchor="middle" font-family='Inter,Arial,sans-serif' font-size="19" font-weight="600" fill="#ffffff" style="">Xe</text><text x="60.0" y="130.0" text-anchor="middle" font-family='Inter,Arial,sans-serif' font-size="14" font-weight="600" fill="#ffffff" style="">H₂O</text><defs><marker id="ah50286" markerWidth="8" markerHeight="8" refX="5" refY="3"
            orient="auto"><path d="M0,0 L6,3 L0,6 Z" fill="#7cc4ff"/></marker></defs><path d="M 90.0 145.0 Q 173.0 136.0 220.0 205.0" stroke="#7cc4ff" stroke-width="2.6" fill="none" marker-end="url(#ah50286)"/><defs><marker id="ah85037" markerWidth="8" markerHeight="8" refX="5" refY="3"
            orient="auto"><path d="M0,0 L6,3 L0,6 Z" fill="#7cc4ff"/></marker></defs><path d="M 260.0 205.0 Q 279.0 232.5 310.0 220.0" stroke="#7cc4ff" stroke-width="2.6" fill="none" marker-end="url(#ah85037)"/><defs><marker id="sa37206" markerWidth="8" markerHeight="8" refX="5" refY="3"
            orient="auto"><path d="M0,0 L6,3 L0,6 Z" fill="#ffffff"/></marker></defs><line x1="360" y1="220" x2="460" y2="220" stroke="#ffffff" stroke-width="2.2" marker-end="url(#sa37206)"/><text x="410.0" y="210.0" text-anchor="middle" font-family='Inter,Arial,sans-serif' font-size="15" font-weight="400" fill="#9fb2c4" style="">attack at Xe</text><text x="600.0" y="220.0" text-anchor="start" font-family='Inter,Arial,sans-serif' font-size="15" font-weight="600" fill="#ffffff" style="">Xe–OH + HF</text><defs><marker id="ah40314" markerWidth="8" markerHeight="8" refX="5" refY="3"
            orient="auto"><path d="M0,0 L6,3 L0,6 Z" fill="#7cc4ff"/></marker></defs><path d="M 560.0 250.0 Q 541.5 330.0 460.0 340.0" stroke="#7cc4ff" stroke-width="2.6" fill="none" marker-end="url(#ah40314)"/><text x="60.0" y="400.0" text-anchor="start" font-family='Inter,Arial,sans-serif' font-size="11" font-weight="400" fill="#9fb2c4" style="">2(Xe–OH) → Xe + Xe=O ... (net O₂ evolved,</text><text x="60.0" y="425.0" text-anchor="start" font-family='Inter,Arial,sans-serif' font-size="11" font-weight="400" fill="#9fb2c4" style="">Xe(+2) reduced to Xe(0))</text><text x="650.0" y="130.0" text-anchor="middle" font-family='Inter,Arial,sans-serif' font-size="15" font-weight="600" fill="#ffffff" style="">Oxidation-state audit</text><text x="650.0" y="165.0" text-anchor="start" font-family='Inter,Arial,sans-serif' font-size="12" font-weight="400" fill="#9fb2c4" style="">Xe: +2 → 0  (reduced, gains 2e⁻)</text><text x="650.0" y="190.0" text-anchor="start" font-family='Inter,Arial,sans-serif' font-size="12" font-weight="400" fill="#9fb2c4" style="">O:  −2 → 0  (oxidised, loses 2e⁻)</text><defs><marker id="sa21393" markerWidth="8" markerHeight="8" refX="5" refY="3"
            orient="auto"><path d="M0,0 L6,3 L0,6 Z" fill="#ffffff"/></marker></defs><line x1="560" y1="440" x2="780" y2="440" stroke="#ffffff" stroke-width="2.2" marker-end="url(#sa21393)"/><text x="800.0" y="440.0" text-anchor="start" font-family='Inter,Arial,sans-serif' font-size="15" font-weight="600" fill="#ffffff" style="">Xe + 2HF + ½O₂</text><text x="500.0" y="600.0" text-anchor="middle" font-family='Inter,Arial,sans-serif' font-size="14" font-weight="400" fill="#9fb2c4" style="font-style:italic;">XeF₄ is analogous but disproportionates: 3XeF₄ + 6H₂O → 2Xe + XeO₃ + 12HF + 3⁄2O₂ — part</text><text x="500.0" y="621.0" text-anchor="middle" font-family='Inter,Arial,sans-serif' font-size="14" font-weight="400" fill="#9fb2c4" style="font-style:italic;">of the Xe(+4) is reduced to Xe(0) while the rest survives as Xe(+4) in XeO₃ (water oxygen is</text><text x="500.0" y="642.0" text-anchor="middle" font-family='Inter,Arial,sans-serif' font-size="14" font-weight="400" fill="#9fb2c4" style="font-style:italic;">what gets oxidised to O₂ in that branch, not the surviving Xe).</text></svg>