<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 620" width="900" height="620"><rect x="0" y="0" width="900" height="620" fill="#0a0c11"/><text x="450.0" y="22.0" text-anchor="middle" font-family='Inter,Arial,sans-serif' font-size="11.5" font-weight="800" fill="#7cc4ff" style="letter-spacing:1.6px;">GROUP 15 · NITROGEN TRICHLORIDE</text><text x="450.0" y="70.0" text-anchor="middle" font-family='Inter,Arial,sans-serif' font-size="22" font-weight="800" fill="#ffffff" style="">NCl₃ hydrolysis is a disguised redox reaction</text><line x1="210.0" y1="254.0" x2="210.0" y2="306.0" stroke="#9fb2c4" stroke-width="2.6" stroke-linecap="round"/><text x="210.0" y="327.0" text-anchor="middle" font-family='Inter,Arial,sans-serif' font-size="19" font-weight="600" fill="#ffffff" style="">Cl</text><line x1="197.9" y1="233.0" x2="152.8" y2="207.0" stroke="#9fb2c4" stroke-width="2.6" stroke-linecap="round"/><text x="140.7" y="207.0" text-anchor="middle" font-family='Inter,Arial,sans-serif' font-size="19" font-weight="600" fill="#ffffff" style="">Cl</text><line x1="222.1" y1="233.0" x2="267.2" y2="207.0" stroke="#9fb2c4" stroke-width="2.6" stroke-linecap="round"/><text x="279.3" y="207.0" text-anchor="middle" font-family='Inter,Arial,sans-serif' font-size="19" font-weight="600" fill="#ffffff" style="">Cl</text><text x="210.0" y="247.0" text-anchor="middle" font-family='Inter,Arial,sans-serif' font-size="20" font-weight="600" fill="#ffffff" style="">N</text><text x="60.0" y="160.0" text-anchor="middle" font-family='Inter,Arial,sans-serif' font-size="16" font-weight="600" fill="#ffffff" style="">H₂O</text><defs><marker id="ah1936" markerWidth="8" markerHeight="8" refX="5" refY="3"
