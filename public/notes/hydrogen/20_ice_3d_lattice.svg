<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900"><defs>
  <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#030712"/><stop offset="0.55" stop-color="#071426"/><stop offset="1" stop-color="#120a24"/></linearGradient>
  <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0"><stop stop-color="#43e6ff"/><stop offset="0.5" stop-color="#9b8cff"/><stop offset="1" stop-color="#ffb65c"/></linearGradient>
  <filter id="glow"><feGaussianBlur stdDeviation="6" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
  <style>
    .title{font:800 44px Inter,Arial,sans-serif;fill:#f8fafc} .sub{font:400 22px Inter,Arial,sans-serif;fill:#b9c6d8}
    .h{font:750 26px Inter,Arial,sans-serif;fill:#69e7ff} .t{font:400 21px Inter,Arial,sans-serif;fill:#d8e1ee}
    .small{font:400 17px Inter,Arial,sans-serif;fill:#aebbd0} .tiny{font:400 15px Inter,Arial,sans-serif;fill:#8ba0b8}
    .gold{fill:#ffc866} .violet{fill:#b9a2ff} .cyan{fill:#62e8ff} .coral{fill:#ff9c7a} .green{fill:#7be6ab}
    .panel{fill:#07111f;stroke:#284563;stroke-width:2} .panel2{fill:#0d1023;stroke:#5f4a88;stroke-width:2}
    .line{stroke:#63e6ff;stroke-width:4;fill:none} .dash{stroke:#b69cff;stroke-width:4;stroke-dasharray:12 10;fill:none}
    .bond{stroke:#e8f1fb;stroke-width:5} .thin{stroke:#6f829a;stroke-width:2;fill:none}
  </style>
</defs>
<rect width="1600" height="900" fill="url(#bg)"/><rect x="44" y="34" width="1512" height="832" rx="34" fill="none" stroke="#17324d" stroke-width="2"/><text x="78" y="96" class="title">Ice — an Open 3-D Hydrogen-Bonded Network</text><rect x="78" y="118" width="430" height="5" rx="3" fill="url(#accent)"/><text x="78" y="158" class="sub">Schematic projection: dashed links are H-bonds, not covalent O-O bonds</text><line x1="420" y1="290" x2="275.5" y2="400.5" class="dash" stroke-dasharray="10 8"/><line x1="420" y1="290" x2="564.5" y2="400.5" class="dash" stroke-dasharray="10 8"/><line x1="275.5" y1="400.5" x2="250" y2="485.5" class="dash" stroke-dasharray="10 8"/><line x1="275.5" y1="400.5" x2="420" y2="468.5" class="dash" stroke-dasharray="10 8"/><line x1="564.5" y1="400.5" x2="420" y2="468.5" class="dash" stroke-dasharray="10 8"/><line x1="564.5" y1="400.5" x2="590" y2="485.5" class="dash" stroke-dasharray="10 8"/><line x1="250" y1="485.5" x2="335.0" y2="604.5" class="dash" stroke-dasharray="10 8"/><line x1="420" y1="468.5" x2="335.0" y2="604.5" class="dash" stroke-dasharray="10 8"/><line x1="420" y1="468.5" x2="505.0" y2="604.5" class="dash" stroke-dasharray="10 8"/><line x1="590" y1="485.5" x2="505.0" y2="604.5" class="dash" stroke-dasharray="10 8"/><circle cx="420" cy="290" r="22" fill="#111a2b" stroke="#7db4ff" stroke-width="4" filter="url(#glow)"/><circle cx="275.5" cy="400.5" r="22" fill="#111a2b" stroke="#7db4ff" stroke-width="4" filter="url(#glow)"/><circle cx="564.5" cy="400.5" r="22" fill="#111a2b" stroke="#7db4ff" stroke-width="4" filter="url(#glow)"/><circle cx="250" cy="485.5" r="22" fill="#111a2b" stroke="#7db4ff" stroke-width="4" filter="url(#glow)"/><circle cx="420" cy="468.5" r="22" fill="#111a2b" stroke="#7db4ff" stroke-width="4" filter="url(#glow)"/><circle cx="590" cy="485.5" r="22" fill="#111a2b" stroke="#7db4ff" stroke-width="4" filter="url(#glow)"/><circle cx="335.0" cy="604.5" r="22" fill="#111a2b" stroke="#7db4ff" stroke-width="4" filter="url(#glow)"/><circle cx="505.0" cy="604.5" r="22" fill="#111a2b" stroke="#7db4ff" stroke-width="4" filter="url(#glow)"/><rect x="760" y="260" width="780" height="340" rx="26" class="panel"/><text x="794" y="310" class="h">Structural result</text><text x="796" y="330" class="t">Each H₂O is approximately tetrahedrally</text><text x="796" y="360" class="t">hydrogen-bonded to four neighbours.</text><text x="796" y="390" class="t"></text><text x="796" y="420" class="t">The open, cage-like network lowers density —</text><text x="796" y="450" class="t">so solid ice floats on liquid water.</text><text x="796" y="480" class="t"></text><text x="796" y="510" class="t">O...O separation ≈ 276 pm (NCERT value).</text></svg>