<svg xmlns="http://www.w3.org/2000/svg" width="720" height="354" viewBox="0 0 720 354" font-family="'Inter','Helvetica Neue',Arial,'DejaVu Sans',sans-serif"><rect width="720" height="354" fill="#0a0c11"/><g stroke="#141a24" stroke-width="1"><line x1="34" y1="0" x2="34" y2="354"/><line x1="68" y1="0" x2="68" y2="354"/><line x1="102" y1="0" x2="102" y2="354"/><line x1="136" y1="0" x2="136" y2="354"/><line x1="170" y1="0" x2="170" y2="354"/><line x1="204" y1="0" x2="204" y2="354"/><line x1="238" y1="0" x2="238" y2="354"/><line x1="272" y1="0" x2="272" y2="354"/><line x1="306" y1="0" x2="306" y2="354"/><line x1="340" y1="0" x2="340" y2="354"/><line x1="374" y1="0" x2="374" y2="354"/><line x1="408" y1="0" x2="408" y2="354"/><line x1="442" y1="0" x2="442" y2="354"/><line x1="476" y1="0" x2="476" y2="354"/><line x1="510" y1="0" x2="510" y2="354"/><line x1="544" y1="0" x2="544" y2="354"/><line x1="578" y1="0" x2="578" y2="354"/><line x1="612" y1="0" x2="612" y2="354"/><line x1="646" y1="0" x2="646" y2="354"/><line x1="680" y1="0" x2="680" y2="354"/><line x1="714" y1="0" x2="714" y2="354"/><line x1="0" y1="34" x2="720" y2="34"/><line x1="0" y1="68" x2="720" y2="68"/><line x1="0" y1="102" x2="720" y2="102"/><line x1="0" y1="136" x2="720" y2="136"/><line x1="0" y1="170" x2="720" y2="170"/><line x1="0" y1="204" x2="720" y2="204"/><line x1="0" y1="238" x2="720" y2="238"/><line x1="0" y1="272" x2="720" y2="272"/><line x1="0" y1="306" x2="720" y2="306"/><line x1="0" y1="340" x2="720" y2="340"/></g><rect x="8" y="8" width="704" height="338" fill="none" stroke="#232a36" stroke-width="1"/><path d="M 8 15 L 8 8 L 15 8" stroke="#4db8e8" stroke-width="1.4" fill="none"/><path d="M 712 15 L 712 8 L 705 8" stroke="#4db8e8" stroke-width="1.4" fill="none"/><path d="M 8 339 L 8 346 L 15 346" stroke="#4db8e8" stroke-width="1.4" fill="none"/><path d="M 712 339 L 712 346 L 705 346" stroke="#4db8e8" stroke-width="1.4" fill="none"/><text x="20" y="18" font-size="8.5" font-weight="bold" fill="#4db8e8" text-anchor="start" font-family="'SF Mono','DejaVu Sans Mono',ui-monospace,Menlo,monospace" letter-spacing="0.24em">SYNERGIC BOND</text><path d="M 688 12 l 6 6 l -6 6 l -6 -6 z" fill="none" stroke="#63d39b" stroke-width="1.2"/><text x="20" y="40" font-size="16" font-weight="bold" fill="#f4ecd9" text-anchor="start" font-family="'Georgia','Times New Roman',serif">Ultrapure silicon  -  three stages</text><line x1="20" y1="42" x2="700" y2="42" stroke="#232a36" stroke-width="1"/><g transform="translate(0,34)"><rect x="40" y="90" width="180" height="120" rx="6" fill="#111a2b" stroke="#232a36" stroke-width="2"/><text x="130.0" y="80.0" font-size="9.5" font-weight="bold" fill="#dbe3ef" text-anchor="middle">1. Trichlorosilane route (Siemens)</text><text x="130.0" y="115.0" font-size="8.6" font-weight="normal" fill="#dbe3ef" text-anchor="middle">Si(crude) + 3 HCl</text><text x="130.0" y="130.0" font-size="8.6" font-weight="normal" fill="#dbe3ef" text-anchor="middle">-&gt; SiHCl3 + H2</text><text x="130.0" y="150.0" font-size="8.6" font-weight="normal" fill="#dbe3ef" text-anchor="middle">distil SiHCl3, then</text><text x="130.0" y="165.0" font-size="8.6" font-weight="normal" fill="#dbe3ef" text-anchor="middle">SiHCl3 + H2 -&gt; Si + 3 HCl</text><text x="130.0" y="185.0" font-size="8" font-weight="normal" fill="#8b98ac" text-anchor="middle">on a hot Si rod (CVD)</text><line x1="225.0" y1="150.0" x2="255.0" y2="150.0" stroke="#4db8e8" stroke-width="2" stroke-linecap="round"/><line x1="255.0" y1="150.0" x2="245.9" y2="145.9" stroke="#4db8e8" stroke-width="2" stroke-linecap="round"/><line x1="255.0" y1="150.0" x2="245.9" y2="154.1" stroke="#4db8e8" stroke-width="2" stroke-linecap="round"/><text x="370.0" y="80.0" font-size="9.5" font-weight="bold" fill="#dbe3ef" text-anchor="middle">2. Zone refining</text><rect x="280" y="110" width="180" height="26" rx="3" fill="#20262f" stroke="#232a36" stroke-width="1.6"/><rect x="345" y="106" width="30" height="34" rx="4" fill="#f3b64b" stroke="#f3b64b" stroke-width="1.4"/><text x="360.0" y="155.0" font-size="8" font-weight="normal" fill="#8b98ac" text-anchor="middle">molten zone (heater) swept slowly along</text><text x="360.0" y="172.0" font-size="8" font-weight="normal" fill="#8b98ac" text-anchor="middle">impurities (k &lt; 1) collect in the melt -&gt; end</text><line x1="465.0" y1="150.0" x2="495.0" y2="150.0" stroke="#4db8e8" stroke-width="2" stroke-linecap="round"/><line x1="495.0" y1="150.0" x2="485.9" y2="145.9" stroke="#4db8e8" stroke-width="2" stroke-linecap="round"/><line x1="495.0" y1="150.0" x2="485.9" y2="154.1" stroke="#4db8e8" stroke-width="2" stroke-linecap="round"/><text x="600.0" y="80.0" font-size="9.5" font-weight="bold" fill="#dbe3ef" text-anchor="middle">3. Czochralski pull</text><rect x="560" y="150" width="80" height="50" rx="4" fill="rgba(240,190,90,0.22)" stroke="#f3b64b" stroke-width="1.6"/><text x="600.0" y="178.0" font-size="8" font-weight="normal" fill="#dbe3ef" text-anchor="middle">molten Si</text><path d="M 600.0 150.0 L 600.0 110.0 L 600.0 95.0" fill="none" stroke="#dbe3ef" stroke-width="3" stroke-linejoin="round"/><path d="M 590 110 Q 600 150 610 110 Z" fill="#111a2b" stroke="#39414f" stroke-width="1.6" stroke-linejoin="round"/><text x="660.0" y="110.0" font-size="8" font-weight="normal" fill="#8b98ac" text-anchor="start">seed crystal</text><text x="600.0" y="90.0" font-size="8" font-weight="normal" fill="#8b98ac" text-anchor="middle">rotate + pull</text><text x="360.0" y="250.0" font-size="9" font-weight="bold" fill="#dbe3ef" text-anchor="middle">metallurgical Si (98%)  -&gt;  SiHCl3 CVD (7-nines)  -&gt;  zone refine (11-nines)  -&gt;  single-crystal ingot</text><text x="360.0" y="270.0" font-size="8.4" font-weight="normal" fill="#8b98ac" text-anchor="middle">k &lt; 1: an impurity is more soluble in liquid Si than solid, so it stays in the moving melt</text></g></svg>