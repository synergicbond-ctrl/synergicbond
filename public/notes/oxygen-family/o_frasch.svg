<svg xmlns="http://www.w3.org/2000/svg" width="560" height="340" viewBox="0 0 560 340" font-family="DejaVu Sans, Arial, sans-serif"><rect x="0" y="0" width="560" height="340" fill="white"/><text x="280.0" y="22.0" font-family="DejaVu Sans, Arial, sans-serif" font-size="17" font-weight="bold" fill="#111" text-anchor="middle">Frasch process  (mining native sulphur)</text><rect x="120" y="90" width="320" height="210" rx="4" fill="#efe6d6" stroke="#111" stroke-width="1.4"/><rect x="120" y="220" width="320" height="80" rx="4" fill="#e6d3b0" stroke="#111" stroke-width="1.4"/><text x="280.0" y="260.0" font-family="DejaVu Sans, Arial, sans-serif" font-size="9.5" font-weight="normal" fill="#555" text-anchor="middle">sulphur-bearing rock</text><rect x="265.0" y="90" width="30" height="150" rx="4" fill="#d0e6ff" stroke="#555" stroke-width="1"/><rect x="273.0" y="90" width="14" height="150" rx="4" fill="#ffe08a" stroke="#555" stroke-width="1"/><rect x="277.0" y="90" width="6" height="150" rx="4" fill="#ddd" stroke="#555" stroke-width="1"/><text x="455.0" y="110.0" font-family="DejaVu Sans, Arial, sans-serif" font-size="8.5" font-weight="normal" fill="#333" text-anchor="start">compressed air (in)</text><text x="455.0" y="150.0" font-family="DejaVu Sans, Arial, sans-serif" font-size="8.5" font-weight="normal" fill="#333" text-anchor="start">superheated water (in)</text><text x="455.0" y="190.0" font-family="DejaVu Sans, Arial, sans-serif" font-size="8.5" font-weight="normal" fill="#333" text-anchor="start">molten sulphur + froth (out)</text><path d="M 280.0 90.0 L 280.0 60.0 L 200.0 60.0" fill="none" stroke="#111" stroke-width="2"/><text x="190.0" y="60.0" font-family="DejaVu Sans, Arial, sans-serif" font-size="9" font-weight="normal" fill="#c0392b" text-anchor="end">S out</text><text x="280.0" y="55.0" font-family="DejaVu Sans, Arial, sans-serif" font-size="11.5" font-weight="bold" fill="#111" text-anchor="middle">three concentric pipes sunk into the deposit</text><text x="280.0" y="325.0" font-family="DejaVu Sans, Arial, sans-serif" font-size="8.8" font-weight="normal" fill="#333" text-anchor="middle">hot water melts S (m.p. 385 K); compressed air froths the molten S up the middle pipe -&gt; ~99.5% pure</text></svg>