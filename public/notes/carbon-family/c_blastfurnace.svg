d39b" stroke-width="1.2"/><text x="20" y="40" font-size="16" font-weight="bold" fill="#f4ecd9" text-anchor="start" font-family="'Georgia','Times New Roman',serif">Blast furnace  -  CO reduces iron ore</text><line x1="20" y1="42" x2="440" y2="42" stroke="#232a36" stroke-width="1"/><g transform="translate(0,34)"><path d="M 150 60 L 310 60 L 330 150 L 330 300 L 300 360 L 160 360 L 130 300 L 130 150 Z" fill="#1e1a12" stroke="#39414f" stroke-width="2" stroke-linejoin="round"/><text x="230.0" y="50.0" font-size="9" font-weight="normal" fill="#dbe3ef" text-anchor="middle">charge:  Fe₂O₃ + coke + limestone</text><path d="M 120.0 320.0 L 130.0 320.0" fill="none" stroke="#dbe3ef" stroke-width="2" stroke-linejoin="round"/><path d="M 330.0 320.0 L 340.0 320.0" fill="none" stroke="#dbe3ef" stroke-width="2" stroke-linejoin="round"/><text x="112.0" y="322.0" font-size="8.5" font-weight="normal" fill="#dbe3ef" text-anchor="end">hot air</text><text x="348.0" y="322.0" font-size="8.5" font-weight="normal" fill="#dbe3ef" text-anchor="start">hot air</text><line x1="135.0" y1="110.0" x2="325.0" y2="110.0" stroke="#232a36" stroke-width="0.8" stroke-linecap="round"/><text x="230.0" y="123.0" font-size="8.2" font-weight="normal" fill="#93a1b5" text-anchor="middle">~500 K   3 Fe₂O₃ + CO → 2 Fe₃O₄ + CO₂</text><line x1="135.0" y1="165.0" x2="325.0" y2="165.0" stroke="#232a36" stroke-width="0.8" stroke-linecap="round"/><text x="230.0" y="178.0" font-size="8.2" font-weight="normal" fill="#93a1b5" text-anchor="middle">~900 K   Fe₃O₄ + CO → 3 FeO + CO₂</text><line x1="135.0" y1="215.0" x2="325.0" y2="215.0" stroke="#232a36" stroke-width="0.8" stroke-linecap="round"/><text x="230.0" y="228.0" font-size="8.2" font-weight="normal" fill="#93a1b5" text-anchor="middle">~1100 K  FeO + CO → Fe + CO₂</text><line x1="135.0" y1="270.0" x2="325.0" y2="270.0" stroke="#232a36" stroke-width="0.8" stroke-linecap="round"/><text x="230.0" y="283.0" font-size="8.2" font-weight="normal" fill="#93a1b5" text-anchor="middle">~1500 K  C + CO₂ → 2 CO ;  CaCO₃ → CaO + CO₂</text><line x1="135.0" y1="330.0" x2="325.0" y2="330.0" stroke="#232a36" stroke-width="0.8" stroke-linecap="round"/><text x="230.0" y="343.0" font-size="8.2" font-weight="normal" fill="#93a1b5" text-anchor="middle">~1900 K  molten Fe + slag CaSiO₃</text><path d="M 230.0 360.0 L 230.0 388.0" fill="none" stroke="#dbe3ef" stroke-width="2" stroke-linejoin="round"/><text x="230.0" y="402.0" font-size="9" font-weight="normal" fill="#ff8f6e" text-anchor="middle">molten iron  +  slag  (tapped separately)</text><text x="230.0" y="30.0" font-size="8.4" font-weight="normal" fill="#8b98ac" text-anchor="middle">the key: CO (not C) does most of the reduction in the cooler upper zones</text></g></svg>