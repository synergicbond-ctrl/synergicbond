" y="171.5" font-size="8" font-weight="normal" fill="#dbe3ef" text-anchor="start">CO₂ is evolved</text><circle cx="604" cy="308" r="13" fill="url(#kg)" stroke="#6fb7dc" stroke-width="1.3"/><circle cx="604" cy="342" r="18" fill="url(#kg)" stroke="#6fb7dc" stroke-width="1.3"/><path d="M 583 384 Q 604 364 625 384 Q 604 396 583 384 Z" fill="url(#kg)" stroke="#6fb7dc" stroke-width="1.3"/><path d="M 585 380 Q 604 366 623 380 Q 604 392 585 380 Z" fill="url(#ka)"/><circle cx="604" cy="308" r="13" fill="url(#ka)"/><circle cx="604" cy="342" r="18" fill="none" stroke="#6fb7dc" stroke-width="1" stroke-dasharray="3 3"/><text x="638.0" y="292.0" font-size="9.5" font-weight="bold" fill="#ff8f6e" text-anchor="start">clip CLOSED</text><text x="638.0" y="308.0" font-size="8" font-weight="normal" fill="#dbe3ef" text-anchor="start">CO₂ collects → pressure rises →</text><text x="638.0" y="320.5" font-size="8" font-weight="normal" fill="#dbe3ef" text-anchor="start">acid is pushed back down into the</text><text x="638.0" y="333.0" font-size="8" font-weight="normal" fill="#dbe3ef" text-anchor="start">lower bulb → the chips run dry →</text><text x="638.0" y="345.5" font-size="8" font-weight="normal" fill="#dbe3ef" text-anchor="start">evolution stops</text><text x="117.7" y="516.4" font-size="12.5" font-weight="bold" fill="#f4ecd9" text-anchor="start">CaCO₃(s) + 2 HCl(aq)</text><line x1="257.8" y1="512.0" x2="305.8" y2="512.0" stroke="#4db8e8" stroke-width="1.8" stroke-linecap="round"/><line x1="305.8" y1="512.0" x2="298.5" y2="508.7" stroke="#4db8e8" stroke-width="1.8" stroke-linecap="round"/><line x1="305.8" y1="512.0" x2="298.5" y2="515.3" stroke="#4db8e8" stroke-width="1.8" stroke-linecap="round"/><text x="323.8" y="516.4" font-size="12.5" font-weight="bold" fill="#f4ecd9" text-anchor="start">CaCl₂(aq) + H₂O(l) + CO₂(g)</text><text x="300.0" y="532.0" font-size="9" font-weight="normal" fill="#93a1b5" text-anchor="middle">charge with a cold, non-oxidising acid only — FeS + dil. H₂SO₄ give