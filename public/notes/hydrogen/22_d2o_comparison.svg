<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900"><defs>
  <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#030712"/><stop offset="0.55" stop-color="#071426"/><stop offset="1" stop-color="#120a24"/></linearGradient>
  <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0"><stop stop-color="#43e6ff"/><stop offset="0.5" stop-color="#9b8cff"/><stop offset="1" stop-color="#ffb65c"/></linearGradient>
  <filter id="glow"><feGaussianBlur stdDeviation="6" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
  <style>
    .title{font:800 44px Inter,Arial,sans-serif;fill:#f8fafc} .sub{font:400 22px Inter,Arial,sans-serif;fill:#b9c6d8}
    .h{font:750 26px Inter,Arial,sans-serif;fill:#69e7ff} .t{font:400 21px Inter,Arial,sans-serif;fill:#d8e1ee}
    .small{font:400 17px Inter,Arial,sans-serif;fill:#aebbd0} .tiny{font:400 15px Inter,Arial,sans-serif;fill:#8ba0b8}
    .gold{fill:#ffc866} .violet{fill:#b9a2ff} .cyan{fill:#62e8ff} .coral{fill:#ff9c7a} .green{fill:#7be6ab}
    .panel{fill:#07111f;stroke:#284563;stroke-width:2} .panel2{fill:#0d1023;stroke:#5f4a88;stroke-width:2}
    .line{stroke:#63e6ff;stroke-width:4;fill:none} .dash{stroke:#b69cff;stroke-width:4;stroke-dasharray:12 10;fill:none}
    .bond{stroke:#e8f1fb;stroke-width:5} .thin{stroke:#6f829a;stroke-width:2;fill:none}
  </style>
</defs>
<rect width="1600" height="900" fill="url(#bg)"/><rect x="44" y="34" width="1512" height="832" rx="34" fill="none" stroke="#17324d" stroke-width="2"/><text x="78" y="96" class="title">H₂O vs D₂O — Isotope Effects</text><rect x="78" y="118" width="430" height="5" rx="3" fill="url(#accent)"/><text x="78" y="158" class="sub">Heavier isotope, stronger effective X-D bonds</text><rect x="78" y="220" width="660" height="330" rx="20" fill="#07111f" stroke="#62e8ff" stroke-width="2"/><text x="408" y="272" class="h" text-anchor="middle" style="fill:#62e8ff;font-size:28px">H₂O</text><text x="118" y="320" class="t">molar mass</text><text x="698" y="320" class="t" text-anchor="end">≈ 18.015 g/mol</text><text x="118" y="360" class="t">m.p.</text><text x="698" y="360" class="t" text-anchor="end">≈ 273 K</text><text x="118" y="400" class="t">b.p.</text><text x="698" y="400" class="t" text-anchor="end">≈ 373 K</text><text x="118" y="440" class="t">density</text><text x="698" y="440" class="t" text-anchor="end">lower than D₂O</text><text x="118" y="480" class="t">auto-ionisation</text><text x="698" y="480" class="t" text-anchor="end">greater</text><text x="118" y="520" class="t">O-H cleavage</text><text x="698" y="520" class="t" text-anchor="end">generally faster</text><rect x="760" y="220" width="660" height="330" rx="20" fill="#07111f" stroke="#7be6ab" stroke-width="2"/><text x="1090" y="272" class="h" text-anchor="middle" style="fill:#7be6ab;font-size:28px">D₂O</text><text x="800" y="320" class="t">molar mass</text><text x="1380" y="320" class="t" text-anchor="end">≈ 20.028 g/mol</text><text x="800" y="360" class="t">m.p.</text><text x="1380" y="360" class="t" text-anchor="end">≈ 276.8 K</text><text x="800" y="400" class="t">b.p.</text><text x="1380" y="400" class="t" text-anchor="end">≈ 374.4 K</text><text x="800" y="440" class="t">density</text><text x="1380" y="440" class="t" text-anchor="end">higher</text><text x="800" y="480" class="t">auto-ionisation</text><text x="1380" y="480" class="t" text-anchor="end">lower</text><text x="800" y="520" class="t">uses</text><text x="1380" y="520" class="t" text-anchor="end">moderator, isotope tracer</text><rect x="78" y="590" width="1460" height="100" rx="14" fill="#0a2630" stroke="#2aaec0"/><text x="100" y="646.0" class="small">Heavier isotope → lower zero-point vibrational energy → effectively stronger, shorter O-D bonds. This raises D₂O's melting/boiling points and slows O-D bond-breaking steps relative to O-H.</text></svg>