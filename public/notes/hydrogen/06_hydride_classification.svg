<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900"><defs>
  <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#030712"/><stop offset="0.55" stop-color="#071426"/><stop offset="1" stop-color="#120a24"/></linearGradient>
  <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0"><stop stop-color="#43e6ff"/><stop offset="0.5" stop-color="#9b8cff"/><stop offset="1" stop-color="#ffb65c"/></linearGradient>
  <filter id="glow"><feGaussianBlur stdDeviation="6" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
  <style>
    .title{font:800 44px Inter,Arial,sans-serif;fill:#f8fafc} .sub{font:400 22px Inter,Arial,sans-serif;fill:#b9c6d8}
    .h{font:750 26px Inter,Arial,sans-serif;fill:#69e7ff} .t{font:400 21px Inter,Arial,sans-serif;fill:#d8e1ee}
    .small{font:400 17px Inter,Arial,sans-serif;fill:#aebbd0} .tiny{font:400 15px Inter,Arial,sans-serif;fill:#8ba0b8}
    .gold{fill:#ffc866} .violet{fill:#b9a2ff} .cyan{fill:#62e8ff} .coral{fill:#ff9c7a} .green{fill:#7be6ab}
    .panel{fill:#07111f;stroke:#284563;stroke-width:2} .panel2{fill:#0d1023;stroke:#5f4a88;stroke-width:2}
    .line{stroke:#63e6ff;stroke-width:4;fill:none} .dash{stroke:#b69cff;stroke-width:4;stroke-dasharray:12 10;fill:none}
    .bond{stroke:#e8f1fb;stroke-width:5} .thin{stroke:#6f829a;stroke-width:2;fill:none}
  </style>
</defs>
<rect width="1600" height="900" fill="url(#bg)"/><rect x="44" y="34" width="1512" height="832" rx="34" fill="none" stroke="#17324d" stroke-width="2"/><text x="78" y="96" class="title">Classification of Hydrides</text><rect x="78" y="118" width="430" height="5" rx="3" fill="url(#accent)"/><text x="78" y="158" class="sub">Ionic (saline), covalent (molecular), and metallic (interstitial)</text><rect x="78" y="220" width="450" height="330" rx="18" fill="#07111f" stroke="#62e8ff" stroke-width="2"/><text x="108" y="268" class="h" style="fill:#62e8ff">Ionic / Saline</text><text x="108" y="310" class="t">highly electropositive s-block metals</text><text x="108" y="342" class="t">LiH, NaH, CaH₂, BaH₂</text><text x="108" y="374" class="t">contain H⁻: strong reducing agents</text><text x="108" y="406" class="t">react violently with water</text><rect x="568" y="220" width="450" height="330" rx="18" fill="#07111f" stroke="#7be6ab" stroke-width="2"/><text x="598" y="268" class="h" style="fill:#7be6ab">Covalent / Molecular</text><text x="598" y="310" class="t">p-block and Be/Mg</text><text x="598" y="342" class="t">CH₄, NH₃, H₂O, HF, B₂H₆</text><text x="598" y="374" class="t">electron-precise, -deficient or -rich</text><text x="598" y="406" class="t">usually volatile, molecular</text><rect x="1058" y="220" width="450" height="330" rx="18" fill="#07111f" stroke="#ffc866" stroke-width="2"/><text x="1088" y="268" class="h" style="fill:#ffc866">Metallic / Interstitial</text><text x="1088" y="310" class="t">many d⁻ and f-block metals</text><text x="1088" y="342" class="t">TiH₂, LaH₃, PdH₀.6 (non-stoich.)</text><text x="1088" y="374" class="t">variable composition</text><text x="1088" y="406" class="t">metal-like conductivity; H₂ storage</text><rect x="78" y="590" width="1460" height="120" rx="14" fill="#0a2630" stroke="#2aaec0"/><text x="100" y="637" class="small">JEE exceptions: BeH₂ is polymeric/covalent (not saline); MgH₂ is intermediate between ionic and covalent. Groups 7-9 transition metals show a genuine 'hydride gap' — they form no</text><text x="100" y="659" class="small">simple binary hydride.</text></svg>