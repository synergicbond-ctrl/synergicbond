<svg xmlns="http://www.w3.org/2000/svg" width="560" height="300" viewBox="0 0 560 300" font-family="DejaVu Sans, Arial, sans-serif"><rect x="0" y="0" width="560" height="300" fill="white"/><text x="280.0" y="22.0" font-family="DejaVu Sans, Arial, sans-serif" font-size="17" font-weight="bold" fill="#111" text-anchor="middle">Halogen family  -  the master trends (F -&gt; I)</text><text x="40.0" y="70.0" font-family="DejaVu Sans, Arial, sans-serif" font-size="11" font-weight="normal" fill="#111" text-anchor="start">atomic / ionic radius</text><text x="310.0" y="70.0" font-family="DejaVu Sans, Arial, sans-serif" font-size="11" font-weight="bold" fill="#333" text-anchor="start">increases</text><text x="40.0" y="100.0" font-family="DejaVu Sans, Arial, sans-serif" font-size="11" font-weight="normal" fill="#111" text-anchor="start">ionisation enthalpy, electronegativity</text><text x="310.0" y="100.0" font-family="DejaVu Sans, Arial, sans-serif" font-size="11" font-weight="bold" fill="#333" text-anchor="start">decrease</text><text x="40.0" y="130.0" font-family="DejaVu Sans, Arial, sans-serif" font-size="11" font-weight="normal" fill="#111" text-anchor="start">|electron gain enthalpy|</text><text x="310.0" y="130.0" font-family="DejaVu Sans, Arial, sans-serif" font-size="11" font-weight="bold" fill="#333" text-anchor="start">Cl &gt; F &gt; Br &gt; I   (F anomaly)</text><text x="40.0" y="160.0" font-family="DejaVu Sans, Arial, sans-serif" font-size="11" font-weight="normal" fill="#111" text-anchor="start">X-X bond enthalpy</text><text x="310.0" y="160.0" font-family="DejaVu Sans, Arial, sans-serif" font-size="11" font-weight="bold" fill="#333" text-anchor="start">Cl2 &gt; Br2 &gt; F2 &gt; I2   (F2 anomaly)</text><text x="40.0" y="190.0" font-family="DejaVu Sans, Arial, sans-serif" font-size="11" font-weight="normal" fill="#111" text-anchor="start">oxidising power of X2</text><text x="310.0" y="190.0" font-family="DejaVu Sans, Arial, sans-serif" font-size="11" font-weight="bold" fill="#333" text-anchor="start">F2 &gt; Cl2 &gt; Br2 &gt; I2</text><text x="40.0" y="220.0" font-family="DejaVu Sans, Arial, sans-serif" font-size="11" font-weight="normal" fill="#111" text-anchor="start">acid strength / reducing power of HX</text><text x="310.0" y="220.0" font-family="DejaVu Sans, Arial, sans-serif" font-size="11" font-weight="bold" fill="#333" text-anchor="start">HF &lt; HCl &lt; HBr &lt; HI</text><text x="40.0" y="250.0" font-family="DejaVu Sans, Arial, sans-serif" font-size="11" font-weight="normal" fill="#111" text-anchor="start">colour of X2</text><text x="310.0" y="250.0" font-family="DejaVu Sans, Arial, sans-serif" font-size="11" font-weight="bold" fill="#333" text-anchor="start">deepens: pale yellow -&gt; violet</text></svg>