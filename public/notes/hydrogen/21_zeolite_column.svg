<rect width="1600" height="900" fill="url(#bg)"/><rect x="44" y="34" width="1512" height="832" rx="34" fill="none" stroke="#17324d" stroke-width="2"/><text x="78" y="96" class="title">Zeolite (Permutit) Water-Softening Column</text><rect x="78" y="118" width="430" height="5" rx="3" fill="url(#accent)"/><text x="78" y="158" class="sub">Ion exchange removes hard-water Ca²⁺ / Mg²⁺</text><line x1="220" y1="250" x2="220" y2="300" stroke="#7be6ab" stroke-width="4"/><path d="M 220 300 L 213 288 L 227 288 Z" fill="#7be6ab"/><text x="240" y="250" class="small">hard water: Ca²⁺, Mg²⁺ in</text><rect x="120" y="300" width="220" height="340" rx="16" fill="#241c0e" stroke="#ffc866" stroke-width="2"/><text x="230" y="340" class="h" text-anchor="middle" style="fill:#ffc866;font-size:22px">Na-zeolite bed</text><circle cx="192" cy="403" r="18" fill="#0d1023" stroke="#ff9c7a" stroke-width="2"/><text x="192.4886561527382" y="407.69652753075746" class="tiny" text-anchor="middle" style="fill:#ff9c7a">Ca</text><circle cx="221" cy="414" r="18" fill="#0d1023" stroke="#b9a2ff" stroke-width="2"/><text x="221.2904836699226" y="419.09389957653025" class="tiny" text-anchor="middle" style="fill:#b9a2ff">Mg</text><circle cx="162" cy="468" r="18" fill="#0d1023" stroke="#62e8ff" stroke-width="2"/><text x="161.9727172223262" y="473.3500231867165" class="tiny" text-anchor="middle" style="fill:#62e8ff">Na</text><circle cx="315" cy="556" r="18" fill="#0d1023" stroke="#62e8ff" stroke-width="2"/><text x="315.2319077557894" y="561.0995173290779" class="tiny" text-anchor="middle" style="fill:#62e8ff">Na</text><circle cx="288" cy="429" r="18" fill="#0d1023" stroke="#ff9c7a" stroke-width="2"/><text x="287.7292684509789" y="433.8241986518699" class="tiny" text-anchor="middle" style="fill:#ff9c7a">Ca</text><circle cx="247" cy="441" r="18" fill="#0d1023" stroke="#b9a2ff" stroke-width="2"/><text x="246.60240147146644" y="445.87018155711905" class="tiny" text-anchor="middle" style="fill:#b9a2ff">Mg</text><circle cx="181" cy="403" r="18" fill="#0d1023" stroke="#62e8ff" stroke-width="2"/><text x="181.0796152713664" y="408.36032433493665" class="tiny" text-anchor="middle" style="fill:#62e8ff">Na</text><circle cx="189" cy="584" r="18" fill="#0d1023" stroke="#62e8ff" stroke-width="2"/><text x="188.59207786420495" y="589.0446389141733" class="tiny" text-anchor="middle" style="fill:#62e8ff">Na</text><circle cx="299" cy="557" r="18" fill="#0d1023" stroke="#ff9c7a" stroke-width="2"/><text x="299.2056087801155" y="562.4635162745112" class="tiny" text-anchor="middle" style="fill:#ff9c7a">Ca</text><circle cx="294" cy="423" r="18" fill="#0d1023" stroke="#b9a2ff" stroke-width="2"/><text x="294.0806109377339" y="427.5558359642328" class="tiny" text-anchor="middle" style="fill:#b9a2ff">Mg</text><line x1="230" y1="650" x2="230" y2="700" stroke="#7be6ab" stroke-width="4"/><path d="M 230 700 L 223 688 L 237 688 Z" fill="#7be6ab"/><text x="250" y="680" class="small">softened water out</text><rect x="430" y="300" width="1000" height="150" rx="26" class="panel"/><text x="464" y="350" class="h">Exchange</text><text x="466" y="372" class="t">Na₂Z + Ca²⁺ → CaZ + 2 Na⁺</text><text x="466" y="404" class="t">Na₂Z + Mg²⁺ → MgZ + 2 Na⁺</text><rect x="430" y="470" width="1000" height="150" rx="26" class="panel"/><text x="464" y="520" class="h">Regeneration</text><text x="466" y="542" class="t">CaZ + 2 NaCl → Na₂Z + CaCl₂</text><text x="466" y="574" class="small">Concentrated brine restores the Na-form of the resin.</text></svg>