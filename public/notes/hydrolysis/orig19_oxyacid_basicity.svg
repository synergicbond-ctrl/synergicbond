<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 460" width="900" height="460"><rect x="0" y="0" width="900" height="460" fill="#0a0c11"/><text x="450.0" y="22.0" text-anchor="middle" font-family='Inter,Arial,sans-serif' font-size="11.5" font-weight="800" fill="#7cc4ff" style="letter-spacing:1.6px;">PHOSPHORUS OXYACID STRUCTURE</text><text x="450.0" y="70.0" text-anchor="middle" font-family='Inter,Arial,sans-serif' font-size="22" font-weight="800" fill="#ffffff" style="">Structural counting rule for basicity</text><text x="90.0" y="150.0" text-anchor="start" font-family='Inter,Arial,sans-serif' font-size="13" font-weight="400" fill="#9fb2c4" style="">Formula</text><text x="320.0" y="150.0" text-anchor="start" font-family='Inter,Arial,sans-serif' font-size="13" font-weight="400" fill="#9fb2c4" style="">Lewis form</text><text x="580.0" y="150.0" text-anchor="start" font-family='Inter,Arial,sans-serif' font-size="13" font-weight="400" fill="#9fb2c4" style="">Basicity (O–H)</text><text x="780.0" y="150.0" text-anchor="start" font-family='Inter,Arial,sans-serif' font-size="13" font-weight="400" fill="#9fb2c4" style="">P–H bonds</text><text x="90.0" y="210.0" text-anchor="start" font-family='Inter,Arial,sans-serif' font-size="16" font-weight="600" fill="#ffffff" style="">H₃PO₂</text><text x="320.0" y="210.0" text-anchor="start" font-family='Inter,Arial,sans-serif' font-size="15" font-weight="600" fill="#ffffff" style="">H₂P(O)(OH)</text><text x="600.0" y="210.0" text-anchor="middle" font-family='Inter,Arial,sans-serif' font-size="16" font-weight="600" fill="#ffffff" style="">1</text><text x="800.0" y="210.0" text-anchor="middle" font-family='Inter,Arial,sans-serif' font-size="16" font-weight="600" fill="#ffffff" style="">2</text><text x="90.0" y="280.0" text-anchor="start" font-family='Inter,Arial,sans-serif' font-size="16" font-weight="600" fill="#ffffff" style="">H₃PO₃</text><text x="320.0" y="280.0" text-anchor="start" font-family='Inter,Arial,sans-serif' font-size="15" font-weight="600" fill="#ffffff" style="">HP(O)(OH)₂</text><text x="600.0" y="280.0" text-anchor="middle" font-family='Inter,Arial,sans-serif' font-size="16" font-weight="600" fill="#ffffff" style="">2</text><text x="800.0" y="280.0" text-anchor="middle" font-family='Inter,Arial,sans-serif' font-size="16" font-weight="600" fill="#ffffff" style="">1</text><text x="90.0" y="350.0" text-anchor="start" font-family='Inter,Arial,sans-serif' font-size="16" font-weight="600" fill="#ffffff" style="">H₃PO₄</text><text x="320.0" y="350.0" text-anchor="start" font-family='Inter,Arial,sans-serif' font-size="15" font-weight="600" fill="#ffffff" style="">P(O)(OH)₃</text><text x="600.0" y="350.0" text-anchor="middle" font-family='Inter,Arial,sans-serif' font-size="16" font-weight="600" fill="#ffffff" style="">3</text><text x="800.0" y="350.0" text-anchor="middle" font-family='Inter,Arial,sans-serif' font-size="16" font-weight="600" fill="#ffffff" style="">0</text><text x="450.0" y="420.0" text-anchor="middle" font-family='Inter,Arial,sans-serif' font-size="14" font-weight="400" fill="#9fb2c4" style="font-style:italic;">Only O–H groups ionise and count toward basicity; P–H bonds are the structural clue for</text><text x="450.0" y="441.0" text-anchor="middle" font-family='Inter,Arial,sans-serif' font-size="14" font-weight="400" fill="#9fb2c4" style="font-style:italic;">reducing character instead. Do not use total hydrogen count for either conclusion.</text></svg>