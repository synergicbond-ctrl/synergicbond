<svg xmlns="http://www.w3.org/2000/svg" width="520" height="320" viewBox="0 0 520 320" font-family="DejaVu Sans, Arial, sans-serif"><rect x="0" y="0" width="520" height="320" fill="white"/><text x="260.0" y="22.0" font-family="DejaVu Sans, Arial, sans-serif" font-size="17" font-weight="bold" fill="#111" text-anchor="middle">Preparation of F2  -  Moissan / Dennis electrolytic cell</text><rect x="120" y="90" width="280" height="150" rx="4" fill="#eef4ff" stroke="#111" stroke-width="1.6"/><text x="260.0" y="80.0" font-family="DejaVu Sans, Arial, sans-serif" font-size="10" font-weight="normal" fill="#333" text-anchor="middle">molten KHF2 in anhydrous HF  (~370 K, steel/Monel cell)</text><rect x="170" y="60" width="20" height="180" rx="4" fill="#333" stroke="#111" stroke-width="1.6"/><text x="180.0" y="270.0" font-family="DejaVu Sans, Arial, sans-serif" font-size="10" font-weight="normal" fill="#111" text-anchor="middle">C anode</text><rect x="330" y="60" width="20" height="180" rx="4" fill="#999" stroke="#111" stroke-width="1.6"/><text x="340.0" y="270.0" font-family="DejaVu Sans, Arial, sans-serif" font-size="10" font-weight="normal" fill="#111" text-anchor="middle">steel cathode</text><text x="180.0" y="45.0" font-family="DejaVu Sans, Arial, sans-serif" font-size="13" font-weight="bold" fill="#c0392b" text-anchor="middle">F2</text><text x="340.0" y="45.0" font-family="DejaVu Sans, Arial, sans-serif" font-size="13" font-weight="bold" fill="#2e7d32" text-anchor="middle">H2</text><text x="260.0" y="180.0" font-family="DejaVu Sans, Arial, sans-serif" font-size="11" font-weight="normal" fill="#111" text-anchor="middle">KHF2 -&gt; KF + HF</text><text x="260.0" y="205.0" font-family="DejaVu Sans, Arial, sans-serif" font-size="11" font-weight="bold" fill="#111" text-anchor="middle">2 HF  -&gt;  H2 (cathode) + F2 (anode)</text><text x="260.0" y="300.0" font-family="DejaVu Sans, Arial, sans-serif" font-size="10" font-weight="normal" fill="#555" text-anchor="middle">no chemical 