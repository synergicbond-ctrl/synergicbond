" text-anchor="middle">1:1 Xe excess</text><text x="356.0" y="253.7" font-size="10.5" font-weight="bold" fill="#f4ecd9" text-anchor="start">XeF₂</text><text x="310.0" y="272.0" font-size="8.4" font-weight="normal" fill="#93a1b5" text-anchor="middle">Xe : F₂ ratio controls the product — 1:5 → XeF₄ ; 1:20, 60-70 bar → XeF₆</text><text x="310.0" y="294.0" font-size="8.4" font-weight="normal" fill="#93a1b5" text-anchor="middle">colourless crystals, sublime at 298 K; a powerful, selective fluorinating agent</text></g></svg>