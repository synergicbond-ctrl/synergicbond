</text><line x1="80.0" y1="260.0" x2="530.0" y2="260.0" stroke="#111" stroke-width="2"/><text x="260.0" y="295.0" font-family="DejaVu Sans, Arial, sans-serif" font-size="11" font-weight="bold" fill="#111" text-anchor="middle">order:  Cl2 &gt; Br2 &gt; F2 &gt; I2      (F2 falls BELOW Br2)</text><text x="260.0" y="314.0" font-family="DejaVu Sans, Arial, sans-serif" font-size="10" font-weight="normal" fill="#555" text-anchor="middle">F2 anomaly: 3 lone pairs on each small F crowd across the short bond (lp-lp repulsion)</text></svg>