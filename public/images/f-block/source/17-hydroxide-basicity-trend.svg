<text x="800" y="745" font-family="Aptos,Arial,sans-serif" font-size="28" fill="#ffc857" font-weight="850" text-anchor="middle">La(OH)₃  &gt;  Ce(OH)₃  &gt;  …  &gt;  Lu(OH)₃</text>
<rect x="100" y="790" width="1400" height="72" rx="14" fill="#0a1d2b" fill-opacity="1" stroke="#1ed6c0" stroke-width="2"/>
<text x="800" y="821" font-family="Aptos,Arial,sans-serif" font-size="20" fill="#1ed6c0" font-weight="800" text-anchor="middle">radius ↓ → charge density ↑ → O–H / Ln–O polarisation ↑ → ionic character ↓</text>
<text x="800" y="850" font-family="Aptos,Arial,sans-serif" font-size="16" fill="#a6bdd0" font-weight="550" text-anchor="middle">The trend is relative: later hydroxides are less basic, not ordinary acidic hydroxides.</text>
