<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900"><defs>
  <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#030712"/><stop offset="0.55" stop-color="#071426"/><stop offset="1" stop-color="#120a24"/></linearGradient>
  <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0"><stop stop-color="#43e6ff"/><stop offset="0.5" stop-color="#9b8cff"/><stop offset="1" stop-color="#ffb65c"/></linearGradient>
  <filter id="glow"><feGaussianBlur stdDeviation="6" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
  <style>
    .title{font:800 44px Inter,Arial,sans-serif;fill:#f8fafc} .sub{font:400 22px Inter,Arial,sans-serif;fill:#b9c6d8}
    .h{font:750 26px Inter,Arial,sans-serif;fill:#69e7ff} .t{font:400 21px Inter,Arial,sans-serif;fill:#d8e1ee}
    .small{font:400 17px Inter,Arial,sans-serif;fill:#aebbd0} .tiny{font:400 15px Inter,Arial,sans-serif;fill:#8ba0b8}
    .gold{fill:#ffc866} .violet{fill:#b9a2ff} .cyan{fill:#62e8ff} .coral{fill:#ff9c7a} .green{fill:#7be6ab}
    .panel{fill:#07111f;stroke:#284563;stroke-width:2} .panel2{fill:#0d1023;stroke:#5f4a88;stroke-width:2}
    .line{stroke:#63e6ff;stroke-width:4;fill:none} .dash{stroke:#b69cff;stroke-width:4;stroke-dasharray:12 10;fill:none}
    .bond{stroke:#e8f1fb;stroke-width:5} .thin{stroke:#6f829a;stroke-width:2;fill:none}
  </style>
</defs>
<rect width="1600" height="900" fill="url(#bg)"/><rect x="44" y="34" width="1512" height="832" rx="34" fill="none" stroke="#17324d" stroke-width="2"/><text x="78" y="96" class="title">Industrial Preparation of Hydrogen</text><rect x="78" y="118" width="430" height="5" rx="3" fill="url(#accent)"/><text x="78" y="158" class="sub">Four independent commercial routes</text><rect x="78" y="220" width="900" height="100" rx="16" fill="#0d1023" stroke="#62e8ff" stroke-width="2"/><text x="108" y="262" class="h" style="fill:#62e8ff;font-size:22px">Steam reforming</text><text x="108" y="294" class="t">CH₄ + H₂O -(Ni, 1100 K)→ CO + 3 H₂</text><rect x="78" y="350" width="900" height="100" rx="16" fill="#0d1023" stroke="#7be6ab" stroke-width="2"/><text x="108" y="392" class="h" style="fill:#7be6ab;font-size:22px">Water-gas shift</text><text x="108" y="424" class="t">CO + H₂O -(Fe₂O₃/Cr₂O₃)→ CO₂ + H₂</text><rect x="78" y="480" width="900" height="100" rx="16" fill="#0d1023" stroke="#ffc866" stroke-width="2"/><text x="108" y="522" class="h" style="fill:#ffc866;font-size:22px">Electrolysis of water</text><text x="108" y="554" class="t">2 H₂O -(electrolysis)→ 2 H₂ + O₂</text><rect x="78" y="610" width="900" height="100" rx="16" fill="#0d1023" stroke="#ff9c7a" stroke-width="2"/><text x="108" y="652" class="h" style="fill:#ff9c7a;font-size:22px">Chlor-alkali by-product</text><text x="108" y="684" class="t">2 NaCl + 2 H₂O → 2 NaOH + H₂ + Cl₂</text><rect x="1030" y="220" width="510" height="490" rx="26" class="panel"/><text x="1064" y="270" class="h">Exam focus</text><text x="1064" y="300" class="t">Syngas = CO + H₂, the feedstock for the</text><text x="1064" y="326" class="t">reforming/shift sequence.</text><text x="1064" y="352" class="t"></text><text x="1064" y="378" class="t">The shift reaction raises H₂ yield by</text><text x="1064" y="404" class="t">converting the CO by-product.</text><text x="1064" y="430" class="t"></text><text x="1064" y="456" class="t">H₂ from chlor-alkali is a by-product,</text><text x="1064" y="482" class="t">not the primary target of that process.</text><text x="1064" y="508" class="t"></text><text x="1064" y="534" class="t">Electrolysis gives the purest H₂ but is</text><text x="1064" y="560" class="t">the most energy-intensive route.</text></svg>