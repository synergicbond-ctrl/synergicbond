e8" text-anchor="start" font-family="'SF Mono','DejaVu Sans Mono',ui-monospace,Menlo,monospace" letter-spacing="0.24em">SYNERGIC BOND</text><path d="M 648 12 l 6 6 l -6 6 l -6 -6 z" fill="none" stroke="#63d39b" stroke-width="1.2"/><text x="20" y="40" font-size="16" font-weight="bold" fill="#f4ecd9" text-anchor="start" font-family="'Georgia','Times New Roman',serif">The halogen family — master trends, F → I</text><line x1="20" y1="42" x2="660" y2="42" stroke="#232a36" stroke-width="1"/><g transform="translate(0,34)"><rect x="30" y="60" width="620" height="254" rx="8" fill="#0f1219" stroke="#232a36" stroke-width="1.2"/><text x="48.0" y="90.0" font-size="9.5" font-weight="normal" fill="#dbe3ef" text-anchor="start">atomic / ionic radius</text><text x="632.0" y="90.0" font-size="9.5" font-weight="bold" fill="#63d39b" text-anchor="end">increases</text><path d="M 380 92 L 380 80 M 380 80 l -4 5 M 380 80 l 4 5" stroke="#63d39b" stroke-width="1.6" fill="none"/><line x1="42" y1="107" x2="638" y2="107" stroke="#232a36" stroke-width="1"/><text x="48.0" y="124.0" font-size="9.5" font-weight="normal" fill="#dbe3ef" text-anchor="start">ionisation enthalpy, electronegativity</text><text x="632.0" y="124.0" font-size="9.5" font-weight="bold" fill="#ff8f6e" text-anchor="end">decreases</text><path d="M 380 114 L 380 126 M 380 126 l -4 -5 M 380 126 l 4 -5" stroke="#ff8f6e" stroke-width="1.6" fill="none"/><line x1="42" y1="141" x2="638" y2="141" stroke="#232a36" stroke-width="1"/><text x="48.0" y="158.0" font-size="9.5" font-weight="normal" fill="#dbe3ef" text-anchor="start">electron-gain enthalpy (magnitude)</text><text x="632.0" y="158.0" font-size="9.5" font-weight="bold" fill="#f3b64b" text-anchor="end">Cl &gt; F &gt; Br &gt; I  (F is anomalous)</text><line x1="42" y1="175" x2="638" y2="175" stroke="#232a36" stroke-width="1"/><text x="48.0" y="192.0" font-size="9.5" font-weight="normal" fill="#dbe3ef" text-anchor="start">X–X bond enthalpy</text><text x="632.0" y="192.0" font-size="9.5" font-weight="bold" fill="#f3b64b" text-anchor="end">Cl₂ &gt; Br₂ &gt; F₂ &gt; I₂  (F₂ anomalous)</text><line x1="42" y1="209" x2="638" y2="209" stroke="#232a36" stroke-width="1"/><text x="48.0" y="226.0" font-size="9.5" font-weight="normal" fill="#dbe3ef" text-anchor="start">oxidising power of X₂</text><text x="632.0" y="226.0" font-size="9.5" font-weight="bold" fill="#ff8f6e" text-anchor="end">F₂ &gt; Cl₂ &gt; Br₂ &gt; I₂</text><path d="M 380 216 L 380 228 M 380 228 l -4 -5 M 380 228 l 4 -5" stroke="#ff8f6e" stroke-width="1.6" fill="none"/><line x1="42" y1="243" x2="638" y2="243" stroke="#232a36" stroke-width="1"/><text x="48.0" y="260.0" font-size="9.5" font-weight="normal" fill="#dbe3ef" text-anchor="start">acid strength / reducing power of HX</text><text x="632.0" y="260.0" font-size="9.5" font-weight="bold" fill="#63d39b" text-anchor="end">HF &lt; HCl &lt; HBr &lt; HI</text><path d="M 380 262 L 380 250 M 380 250 l -4 5 M 380 250 l 4 5" stroke="#63d39b" stroke-width="1.6" fill="none"/><line x1="42" y1="277" x2="638" y2="277" stroke="#232a36" stroke-width="1"/><text x="48.0" y="294.0" font-size="9.5" font-weight="normal" fill="#dbe3ef" text-anchor="start">colour of X₂</text><text x="632.0" y="294.0" font-size="9.5" font-weight="bold" fill="#f3b64b" text-anchor="end">deepens: pale yellow → violet</text><text x="340.0" y="332.0" font-size="8.4" font-weight="normal" fill="#93a1b5" text-anchor="middle">F is the anomaly in electron-gain enthalpy and X–X bond enthalpy — small size means</text><text x="340.0" y="348.0" font-size="8.4" font-weight="normal" fill="#93a1b5" text-anchor="middle">high electron density / lone-pair repulsion, weakening both effects</text></g></svg>