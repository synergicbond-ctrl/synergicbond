e">violet (solid/vapour)</text><text x="280.0" y="158.0" font-family="DejaVu Sans, Arial, sans-serif" font-size="9" font-weight="normal" fill="#333" text-anchor="middle">X2 absorbs visible light (pi* -&gt; sigma*); the gap falls F2 -&gt; I2, so longer lambda is absorbed</text></svg>