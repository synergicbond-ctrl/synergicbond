ERGIC BOND</text><path d="M 588 12 l 6 6 l -6 6 l -6 -6 z" fill="none" stroke="#63d39b" stroke-width="1.2"/><text x="20" y="40" font-size="16" font-weight="bold" fill="#f4ecd9" text-anchor="start" font-family="'Georgia','Times New Roman',serif">Preparation of fluorine — the Moissan / Dennis cell</text><line x1="20" y1="42" x2="600" y2="42" stroke="#232a36" stroke-width="1"/><g transform="translate(0,34)"><rect x="140" y="90" width="340" height="160" rx="6" fill="rgba(120,190,235,0.06)" stroke="#6fb7dc" stroke-width="2.2"/><text x="310.0" y="78.0" font-size="8.6" font-weight="normal" fill="#4db8e8" text-anchor="middle">molten KHF₂ in anhydrous HF, ≈370 K</text><rect x="210" y="76" width="18" height="188" fill="#93a1b5" stroke="#1b1f27" stroke-width="1.4"/><text x="219.0" y="292.0" font-size="8.4" font-weight="normal" fill="#93a1b5" text-anchor="middle">C anode (+)</text><rect x="392" y="76" width="18" height="188" fill="#8b98ac" stroke="#1b1f27" stroke-width="1.4"/><text x="401.0" y="292.0" font-size="8.4" font-weight="normal" fill="#93a1b5" text-anchor="middle">steel cathode (−)</text><line x1="310.0" y1="100" x2="310.0" y2="240" stroke="#f3b64b" stroke-width="1.6" stroke-dasharray="5 4"/><text x="310.0" y="170.0" font-size="8" font-weight="normal" fill="#f3b64b" text-anchor="middle">Monel diaphragm</text><path d="M 219 76 v -26 h -40" stroke="#6fb7dc" stroke-width="2"/><text x="160.0" y="44.0" font-size="13" font-weight="bold" fill="#ff8f6e" text-anchor="end">F₂</text><path d="M 401 76 v -26 h 40" stroke="#6fb7dc" stroke-width="2"/><text x="470.0" y="44.0" font-size="13" font-weight="bold" fill="#63d39b" text-anchor="start">H₂</text><text x="241.2" y="283.9" font-size="11" font-weight="bold" fill="#f4ecd9" text-anchor="start">2 HF</text><line x1="280.6" y1="280.0" x2="328.6" y2="280.0" stroke="#4db8e8" stroke-width="1.8" stroke-linecap="round"/><line x1="328.6" y1="280.0" x2="321.3" y2="276.7" stroke="#4db8e8" stroke-width="1.8" stroke-linecap="round"/><line x1="328.6" y1="280.0" x2="321.3" y2="283.3" stroke="#4db8e8" stroke-width="1.8" stroke-linecap="round"/><text x="304.6" y="272.0" font-size="7.5" font-weight="normal" fill="#93a1b5" text-anchor="middle">electrolysis, ≈370 K</text><text x="346.6" y="283.9" font-size="11" font-weight="bold" fill="#f4ecd9" text-anchor="start">H₂ + F₂</text><text x="310.0" y="302.0" font-size="8.4" font-weight="normal" fill="#93a1b5" text-anchor="middle">no chemical oxidant on Earth can oxidise F⁻ (E°(F₂/F⁻) = +2.87 V) — electrolysis is the only route</text><text x="310.0" y="322.0" font-size="8.4" font-weight="normal" fill="#93a1b5" text-anchor="middle">pure anhydrous HF is a non-conductor; KHF₂ is dissolved in it to carry the current</text></g></svg>