<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900"><defs>
  <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#030712"/><stop offset="0.55" stop-color="#071426"/><stop offset="1" stop-color="#120a24"/></linearGradient>
  <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0"><stop stop-color="#43e6ff"/><stop offset="0.5" stop-color="#9b8cff"/><stop offset="1" stop-color="#ffb65c"/></linearGradient>
  <filter id="glow"><feGaussianBlur stdDeviation="6" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
  <style>
    .title{font:800 44px Inter,Arial,sans-serif;fill:#f8fafc} .sub{font:400 22px Inter,Arial,sans-serif;fill:#b9c6d8}
    .h{font:750 26px Inter,Arial,sans-serif;fill:#69e7ff} .t{font:400 21px Inter,Arial,sans-serif;fill:#d8e1ee}
    .small{font:400 17px Inter,Arial,sans-serif;fill:#aebbd0} .tiny{font:400 15px Inter,Arial,sans-serif;fill:#8ba0b8}
    .gold{fill:#ffc866} .violet{fill:#b9a2ff} .cyan{fill:#62e8ff} .coral{fill:#ff9c7a} .green{fill:#7be6ab}
    .panel{fill:#07111f;stroke:#284563;stroke-width:2} .panel2{fill:#0d1023;stroke:#5f4a88;stroke-width:2}
    .line{stroke:#63e6ff;stroke-width:4;fill:none} .dash{stroke:#b69cff;stroke-width:4;stroke-dasharray:12 10;fill:none}
    .bond{stroke:#e8f1fb;stroke-width:5} .thin{stroke:#6f829a;stroke-width:2;fill:none}
  </style>
</defs>
<rect width="1600" height="900" fill="url(#bg)"/><rect x="44" y="34" width="1512" height="832" rx="34" fill="none" stroke="#17324d" stroke-width="2"/><text x="78" y="96" class="title">Synthetic ion-exchange resins</text><rect x="78" y="118" width="430" height="5" rx="3" fill="url(#accent)"/><text x="78" y="158" class="sub">cation + anion exchange gives fully demineralised water</text><rect x="78" y="190" width="700" height="580" rx="26" class="panel"/><text x="112" y="240" class="h">Cation-exchange column</text><text x="110" y="290" class="t">Resin–SO₃⁻Na⁺  (insoluble polymer)</text><rect x="130" y="320" width="580" height="200" rx="16" fill="#0c1c30" stroke="#3a6a94" stroke-width="2"/><circle cx="220" cy="340" r="14" fill="#123a24" stroke="#7be6ab" stroke-width="4"/><circle cx="340" cy="370" r="14" fill="#123a24" stroke="#7be6ab" stroke-width="4"/><circle cx="460" cy="340" r="14" fill="#123a24" stroke="#7be6ab" stroke-width="4"/><circle cx="560" cy="370" r="14" fill="#123a24" stroke="#7be6ab" stroke-width="4"/><circle cx="650" cy="340" r="14" fill="#123a24" stroke="#7be6ab" stroke-width="4"/><text x="420" y="550" class="small" text-anchor="middle">hard water in  (Ca²⁺, Mg²⁺)</text><line x1="420" y1="530" x2="420" y2="330" stroke="#63e6ff" stroke-width="4"/><path d="M 420 330 L 427 342 L 413 342 Z" fill="#63e6ff"/><text x="420" y="590" class="t" text-anchor="middle">Resin–SO₃⁻Na⁺ + Ca²⁺ → (Resin–SO₃)₂Ca + 2Na⁺</text><text x="420" y="630" class="tiny" text-anchor="middle">water leaving carries Na⁺ instead of Ca²⁺/Mg²⁺</text><line x1="420" y1="650" x2="420" y2="720" stroke="#63e6ff" stroke-width="4"/><path d="M 420 720 L 413 708 L 427 708 Z" fill="#63e6ff"/><rect x="838" y="190" width="700" height="580" rx="26" class="panel2"/><text x="872" y="240" class="h">Anion-exchange column</text><text x="870" y="290" class="t">Resin–NR₃⁺OH⁻  (basic polymer)</text><rect x="890" y="320" width="580" height="200" rx="16" fill="#160f2a" stroke="#6a4a94" stroke-width="2"/><circle cx="980" cy="340" r="14" fill="#241638" stroke="#b9a2ff" stroke-width="4"/><circle cx="1100" cy="370" r="14" fill="#241638" stroke="#b9a2ff" stroke-width="4"/><circle cx="1220" cy="340" r="14" fill="#241638" stroke="#b9a2ff" stroke-width="4"/><circle cx="1320" cy="370" r="14" fill="#241638" stroke="#b9a2ff" stroke-width="4"/><circle cx="1410" cy="340" r="14" fill="#241638" stroke="#b9a2ff" stroke-width="4"/><text x="1180" y="550" class="small" text-anchor="middle">acidic water in (H⁺ + anions)</text><line x1="1180" y1="530" x2="1180" y2="330" stroke="#b9a2ff" stroke-width="4"/><path d="M 1180 330 L 1187 342 L 1173 342 Z" fill="#b9a2ff"/><text x="1180" y="590" class="t" text-anchor="middle">Resin–NR₃⁺OH⁻ + Cl⁻ → Resin–NR₃⁺Cl⁻ + OH⁻</text><text x="1180" y="630" class="tiny" text-anchor="middle">H⁺ + OH⁻ → H₂O  — output is de-ionised water</text><line x1="1180" y1="650" x2="1180" y2="720" stroke="#b9a2ff" stroke-width="4"/><path d="M 1180 720 L 1173 708 L 1187 708 Z" fill="#b9a2ff"/><rect x="78" y="790" width="1460" height="56" rx="14" fill="#0a2630" stroke="#2aaec0"/><text x="100" y="824.0" class="small">Regeneration: cation resin is washed with dilute acid to restore –SO₃⁻Na⁺; anion resin is washed with dilute NaOH to restore –NR₃⁺OH⁻.</text></svg>