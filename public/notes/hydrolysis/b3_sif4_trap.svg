<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 860 560" width="860" height="560"><rect x="0" y="0" width="860" height="560" fill="#0a0c11"/><text x="430.0" y="22.0" text-anchor="middle" font-family='Inter,Arial,sans-serif' font-size="11.5" font-weight="800" fill="#7cc4ff" style="letter-spacing:1.6px;">GROUP 14 · SILICON TETRAFLUORIDE</text><text x="430.0" y="70.0" text-anchor="middle" font-family='Inter,Arial,sans-serif' font-size="22" font-weight="800" fill="#ffffff" style="">SiF₄ partial hydrolysis: fluoride trapping as [SiF₆]²⁻</text><text x="140.0" y="170.0" text-anchor="start" font-family='Inter,Arial,sans-serif' font-size="16" font-weight="600" fill="#ffffff" style="">3SiF₄ + 4H₂O</text><defs><marker id="sa28976" markerWidth="8" markerHeight="8" refX="5" refY="3"
            orient="auto"><path d="M0,0 L6,3 L0,6 Z" fill="#ffffff"/></marker></defs><line x1="340" y1="170" x2="480" y2="170" stroke="#ffffff" stroke-width="2.2" marker-end="url(#sa28976)"/><text x="410.0" y="160.0" text-anchor="middle" font-family='Inter,Arial,sans-serif' font-size="15" font-weight="400" fill="#9fb2c4" style="">attack at Si</text><text x="530.0" y="170.0" text-anchor="start" font-family='Inter,Arial,sans-serif' font-size="15" font-weight="600" fill="#ffffff" style="">Si(OH)₄ + 2H₂SiF₆</text><text x="300.0" y="420.0" text-anchor="middle" font-family='Inter,Arial,sans-serif' font-size="15" font-weight="600" fill="#ffffff" style="">SiF₄ + 2F⁻ → [SiF₆]²⁻</text><defs><marker id="ah56255" markerWidth="8" markerHeight="8" refX="5" refY="3"
            orient="auto"><path d="M0,0 L6,3 L0,6 Z" fill="#7cc4ff"/></marker></defs><path d="M 480.0 210.0 Q 364.0 256.0 350.0 380.0" stroke="#7cc4ff" stroke-width="2.6" fill="none" marker-end="url(#ah56255)"/><text x="430.0" y="500.0" text-anchor="middle" font-family='Inter,Arial,sans-serif' font-size="14" font-weight="400" fill="#9fb2c4" style="font-style:italic;">Water substitutes at Si first; the liberated F⁻ then adds to unreacted SiF₄ (a second,</text><text x="430.0" y="521.0" text-anchor="middle" font-family='Inter,Arial,sans-serif' font-size="14" font-weight="400" fill="#9fb2c4" style="font-style:italic;">non-hydrolytic step) as octahedral [SiF₆]²⁻ — net hydrolysis is only partial.</text></svg>