<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 420" width="900" height="420"><rect x="0" y="0" width="900" height="420" fill="#0a0c11"/><text x="450.0" y="22.0" text-anchor="middle" font-family='Inter,Arial,sans-serif' font-size="11.5" font-weight="800" fill="#7cc4ff" style="letter-spacing:1.6px;">GROUP 15 · WHITE PHOSPHORUS</text><text x="450.0" y="70.0" text-anchor="middle" font-family='Inter,Arial,sans-serif' font-size="22" font-weight="800" fill="#ffffff" style="">P₄ in hot alkali: simultaneous reduction and oxidation</text><text x="90.0" y="190.0" text-anchor="middle" font-family='Inter,Arial,sans-serif' font-size="16" font-weight="600" fill="#ffffff" style="">P₄  (P: 0)</text><defs><marker id="sa9503" markerWidth="8" markerHeight="8" refX="5" refY="3"
            orient="auto"><path d="M0,0 L6,3 L0,6 Z" fill="#ffffff"/></marker></defs><line x1="240" y1="150" x2="480" y2="150" stroke="#ffffff" stroke-width="2.2" marker-end="url(#sa9503)"/><text x="360.0" y="140.0" text-anchor="middle" font-family='Inter,Arial,sans-serif' font-size="15" font-weight="400" fill="#9fb2c4" style="">OH⁻ attacks one P, gains 3e⁻</text><text x="520.0" y="140.0" text-anchor="start" font-family='Inter,Arial,sans-serif' font-size="15" font-weight="600" fill="#ffffff" style="">PH₃  (P: −3)</text><defs><marker id="sa71457" markerWidth="8" markerHeight="8" refX="5" refY="3"
            orient="auto"><path d="M0,0 L6,3 L0,6 Z" fill="#ffffff"/></marker></defs><line x1="240" y1="240" x2="480" y2="240" stroke="#ffffff" stroke-width="2.2" marker-end="url(#sa71457)"/><text x="360.0" y="262.0" text-anchor="middle" font-family='Inter,Arial,sans-serif' font-size="15" font-weight="400" fill="#9fb2c4" style="">other P bonds to O, loses 1e⁻</text><text x="520.0" y="260.0" text-anchor="start" font-family='Inter,Arial,sans-serif' font-size="15" font-weight="600" fill="#ffffff" style="">H₂PO₂⁻  (P: +1)</text><text x="450.0" y="360.0" text-anchor="middle" font-family='Inter,Arial,sans-serif' font-size="14" font-weight="400" fill="#9fb2c4" style="font-style:italic;">Some P atoms are reduced to PH₃ (gain 3e⁻ each); others are oxidised to hypophosphite</text><text x="450.0" y="381.0" text-anchor="middle" font-family='Inter,Arial,sans-serif' font-size="14" font-weight="400" fill="#9fb2c4" style="font-style:italic;">H₂PO₂⁻ (lose 1e⁻ each) — a disproportionation. P₄ + 3OH⁻ + 3H₂O → PH₃ + 3H₂PO₂⁻.</text></svg>