<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 620" width="1000" height="620"><rect x="0" y="0" width="1000" height="620" fill="#0a0c11"/><text x="500.0" y="22.0" text-anchor="middle" font-family='Inter,Arial,sans-serif' font-size="11.5" font-weight="800" fill="#7cc4ff" style="letter-spacing:1.6px;">INTERHALOGENS</text><text x="500.0" y="70.0" text-anchor="middle" font-family='Inter,Arial,sans-serif' font-size="22" font-weight="800" fill="#ffffff" style="">OH always attaches to the larger, less electronegative A</text><text x="60.0" y="150.0" text-anchor="start" font-family='Inter,Arial,sans-serif' font-size="15" font-weight="600" fill="#ffffff" style="">Br–Cl</text><text x="60.0" y="172.0" text-anchor="start" font-family='Inter,Arial,sans-serif' font-size="10" font-weight="400" fill="#9fb2c4" style="">H₂O attacks Br (δ⁺, less EN)</text><defs><marker id="sa82578" markerWidth="8" markerHeight="8" refX="5" refY="3"
            orient="auto"><path d="M0,0 L6,3 L0,6 Z" fill="#ffffff"/></marker></defs><line x1="400" y1="150" x2="620" y2="150" stroke="#ffffff" stroke-width="2.2" marker-end="url(#sa82578)"/><text x="660.0" y="150.0" text-anchor="start" font-family='Inter,Arial,sans-serif' font-size="14" font-weight="600" fill="#ffffff" style="">HOBr + HCl</text><text x="870.0" y="150.0" text-anchor="start" font-family='Inter,Arial,sans-serif' font-size="11" font-weight="400" fill="#9fb2c4" style="">Br stays 0</text><text x="60.0" y="270.0" text-anchor="start" font-family='Inter,Arial,sans-serif' font-size="15" font-weight="600" fill="#ffffff" style="">F₃Cl (T-shaped)</text><text x="60.0" y="292.0" text-anchor="start" font-family='Inter,Arial,sans-serif' font-size="10" font-weight="400" fill="#9fb2c4" style="">2× subst. at Cl, then –H₂O</text><defs><marker id="sa79764" markerWidth="8" markerHeight="8" refX="5" refY="3"
