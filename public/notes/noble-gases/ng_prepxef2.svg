<svg xmlns="http://www.w3.org/2000/svg" width="540" height="260" viewBox="0 0 540 260" font-family="DejaVu Sans, Arial, sans-serif"><rect x="0" y="0" width="540" height="260" fill="white"/><text x="270.0" y="22.0" font-family="DejaVu Sans, Arial, sans-serif" font-size="17" font-weight="bold" fill="#111" text-anchor="middle">Preparation of xenon difluoride</text><rect x="160" y="110" width="220" height="60" rx="8" fill="#eef6ff" stroke="#111" stroke-width="2"/><text x="270.0" y="145.0" font-family="DejaVu Sans, Arial, sans-serif" font-size="11" font-weight="normal" fill="#111" text-anchor="middle">Xe  :  F2  =  2 : 1</text><text x="270.0" y="100.0" font-family="DejaVu Sans, Arial, sans-serif" font-size="8.5" font-weight="normal" fill="#555" text-anchor="middle">sealed nickel / quartz tube</text><line x1="200.0" y1="60.0" x2="210.0" y2="105.0" stroke="#f5a623" stroke-width="1.6"/><line x1="235.0" y1="60.0" x2="245.0" y2="105.0" stroke="#f5a623" stroke-width="1.6"/><line x1="270.0" y1="60.0" x2="280.0" y2="105.0" stroke="#f5a623" stroke-width="1.6"/><line x1="305.0" y1="60.0" x2="315.0" y2="105.0" stroke="#f5a623" stroke-width="1.6"/><line x1="340.0" y1="60.0" x2="350.0" y2="105.0" stroke="#f5a623" stroke-width="1.6"/><text x="270.0" y="52.0" font-family="DejaVu Sans, Arial, sans-serif" font-size="9" font-weight="normal" fill="#e8990b" text-anchor="middle">sunlight  (or 673 K)</text><path d="M 380.0 140.0 L 420.0 140.0" fill="none" stroke="#111" stroke-width="2"/><text x="428.0" y="143.0" font-family="DejaVu Sans, Arial, sans-serif" font-size="11" font-weight="bold" fill="#c0392b" text-anchor="start">XeF2</text><text x="270.0" y="205.0" font-family="DejaVu Sans, Arial, sans-serif" font-size="9" font-weight="bold" fill="#111" text-anchor="middle">Xe + F2  -&gt;  XeF2      (Xe excess -&gt; XeF2 ;  1:5 -&gt; XeF4 ;  1:20, 60-70 bar -&gt; XeF6)</text><text x="270.0" y="224.0" font-family="DejaVu Sans, Arial, sans-serif" font-size="8.8" font-weight="normal" fill="#555" text-anchor="middle">colourless crystals, sublime at 298 K, powerful fluorinating agents</text></svg>