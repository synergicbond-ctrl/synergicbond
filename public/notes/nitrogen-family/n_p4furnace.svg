<svg xmlns="http://www.w3.org/2000/svg" width="580" height="300" viewBox="0 0 580 300" font-family="DejaVu Sans, Arial, sans-serif"><rect x="0" y="0" width="580" height="300" fill="white"/><text x="290.0" y="22.0" font-family="DejaVu Sans, Arial, sans-serif" font-size="17" font-weight="bold" fill="#111" text-anchor="middle">Manufacture of white phosphorus  (electric furnace)</text><rect x="120" y="95" width="250" height="140" rx="6" fill="#f1ede2" stroke="#111" stroke-width="2"/><text x="245.0" y="85.0" font-family="DejaVu Sans, Arial, sans-serif" font-size="9.5" font-weight="normal" fill="#111" text-anchor="middle">charge:  phosphorite Ca3(PO4)2  +  coke C  +  sand SiO2</text><rect x="150" y="62" width="16" height="46" rx="4" fill="#333" stroke="#111" stroke-width="1.6"/><rect x="324" y="62" width="16" height="46" rx="4" fill="#333" stroke="#111" stroke-width="1.6"/><text x="158.0" y="54.0" font-family="DejaVu Sans, Arial, sans-serif" font-size="9" font-weight="normal" fill="#111" text-anchor="middle">C</text><text x="332.0" y="54.0" font-family="DejaVu Sans, Arial, sans-serif" font-size="9" font-weight="normal" fill="#111" text-anchor="middle">C</text><path d="M 166 100 Q 245 128 324 100" fill="none" stroke="#f5a623" stroke-width="3"/><text x="245.0" y="150.0" font-family="DejaVu Sans, Arial, sans-serif" font-size="10" font-weight="normal" fill="#111" text-anchor="middle">electric arc  ~1700 K</text><path d="M 370.0 120.0 L 430.0 120.0 L 430.0 90.0" fill="none" stroke="#111" stroke-width="2"/><text x="438.0" y="92.0" font-family="DejaVu Sans, Arial, sans-serif" font-size="9.5" font-weight="normal" fill="#c0392b" text-anchor="start">P4 vapour</text><text x="438.0" y="106.0" font-family="DejaVu Sans, Arial, sans-serif" font-size="8.4" font-weight="normal" fill="#555" text-anchor="start">(condensed under water)</text><path d="M 370.0 200.0 L 425.0 200.0" fill="none" stroke="#111" stroke-width="2"/><text x="430.0" y="203.0" font-family="DejaVu Sans, Arial, sans-serif" font-size="9.5" font-weight="normal" fill="#333" text-anchor="start">CaSiO3 slag + CO</text><text x="290.0" y="270.0" font-family="DejaVu Sans, Arial, sans-serif" font-size="11.5" font-weight="bold" fill="#111" text-anchor="middle">2 Ca3(PO4)2 + 6 SiO2 + 10 C  -&gt;  P4 + 6 CaSiO3 + 10 CO</text><text x="290.0" y="289.0" font-family="DejaVu Sans, Arial, sans-serif" font-size="9" font-weight="normal" fill="#555" text-anchor="middle">SiO2 slags off CaO ;  C reduces phosphate to P4</text></svg>