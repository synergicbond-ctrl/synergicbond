>RULES:  basicity = number of P-OH groups only.</text><text x="60.0" y="373.0" font-size="12" font-weight="normal" fill="#dbe3ef" text-anchor="start">P-H bond =&gt; strong reducing agent  (H3PO2 &gt; H3PO3 &gt; H3PO4 = 0).</text><text x="60.0" y="396.0" font-size="12" font-weight="normal" fill="#dbe3ef" text-anchor="start">P in +1 / +3  =&gt;  disproportionates on heating:  4 H3PO3 -&gt; 3 H3PO4 + PH3.</text></g></svg>