<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900"><defs>
  <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#030712"/><stop offset="0.55" stop-color="#071426"/><stop offset="1" stop-color="#120a24"/></linearGradient>
  <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0"><stop stop-color="#43e6ff"/><stop offset="0.5" stop-color="#9b8cff"/><stop offset="1" stop-color="#ffb65c"/></linearGradient>
  <filter id="glow"><feGaussianBlur stdDeviation="6" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
  <style>
    .title{font:800 44px Inter,Arial,sans-serif;fill:#f8fafc} .sub{font:400 22px Inter,Arial,sans-serif;fill:#b9c6d8}
    .h{font:750 26px Inter,Arial,sans-serif;fill:#69e7ff} .t{font:400 21px Inter,Arial,sans-serif;fill:#d8e1ee}
    .small{font:400 17px Inter,Arial,sans-serif;fill:#aebbd0} .tiny{font:400 15px Inter,Arial,sans-serif;fill:#8ba0b8}
    .gold{fill:#ffc866} .violet{fill:#b9a2ff} .cyan{fill:#62e8ff} .coral{fill:#ff9c7a} .green{fill:#7be6ab}
    .panel{fill:#07111f;stroke:#284563;stroke-width:2} .panel2{fill:#0d1023;stroke:#5f4a88;stroke-width:2}
    .line{stroke:#63e6ff;stroke-width:4;fill:none} .dash{stroke:#b69cff;stroke-width:4;stroke-dasharray:12 10;fill:none}
    .bond{stroke:#e8f1fb;stroke-width:5} .thin{stroke:#6f829a;stroke-width:2;fill:none}
  </style>
</defs>
<rect width="1600" height="900" fill="url(#bg)"/><rect x="44" y="34" width="1512" height="832" rx="34" fill="none" stroke="#17324d" stroke-width="2"/><text x="78" y="96" class="title">Hardness of water</text><rect x="78" y="118" width="430" height="5" rx="3" fill="url(#accent)"/><text x="78" y="158" class="sub">temporary vs permanent — two chemically distinct problems</text><rect x="78" y="190" width="700" height="320" rx="26" class="panel"/><text x="112" y="240" class="h">Temporary hardness</text><text x="110" y="290" class="t">Cause: dissolved bicarbonates</text><text x="110" y="322" class="h">Ca(HCO₃)₂ , Mg(HCO₃)₂</text><text x="110" y="362" class="small">Removed by boiling:</text><text x="110" y="390" class="t">Ca(HCO₃)₂ → CaCO₃↓ + H₂O + CO₂↑</text><text x="110" y="418" class="t">Mg(HCO₃)₂ → Mg(OH)₂↓ + 2CO₂↑</text><rect x="110" y="450" width="620" height="56" rx="14" fill="#0a2630" stroke="#2aaec0"/><text x="132" y="484.0" class="small">Also removable by Clark's method: adding Ca(OH)₂ to precipitate the excess as CaCO₃.</text><rect x="838" y="190" width="700" height="320" rx="26" class="panel2"/><text x="872" y="240" class="h">Permanent hardness</text><text x="870" y="290" class="t">Cause: dissolved chlorides / sulfates</text><text x="870" y="322" class="h">CaCl₂ , MgCl₂ , CaSO₄ , MgSO₄</text><text x="870" y="362" class="small">NOT removed by boiling — needs:</text><text x="870" y="390" class="t">• Washing soda: Ca²⁺/Mg²⁺ + CO₃²⁻ → carbonate↓</text><text x="870" y="418" class="t">• Zeolite / ion-exchange (see §17.6, §17.7)</text><rect x="870" y="450" width="620" height="56" rx="14" fill="#0a2630" stroke="#2aaec0"/><text x="892" y="484.0" class="small">Calgon (sodium hexametapolyphosphate) sequesters Ca²⁺/Mg²⁺ without precipitating them.</text><text x="78" y="560" class="small">Degree of hardness is reported as ppm CaCO₃ equivalent: soft &lt; 60, moderately hard 60–120, hard 120–180, very hard &gt; 180 ppm.</text></svg>