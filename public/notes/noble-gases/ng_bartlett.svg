lo,monospace" letter-spacing="0.24em">SYNERGIC BOND</text><path d="M 648 12 l 6 6 l -6 6 l -6 -6 z" fill="none" stroke="#63d39b" stroke-width="1.2"/><text x="20" y="40" font-size="16" font-weight="bold" fill="#f4ecd9" text-anchor="start" font-family="'Georgia','Times New Roman',serif">Bartlett's discovery (1962) — the reasoning</text><line x1="20" y1="42" x2="660" y2="42" stroke="#232a36" stroke-width="1"/><g transform="translate(0,34)"><rect x="40" y="70" width="260" height="90" rx="8" fill="#0f1219" stroke="#6fb7dc" stroke-width="1.6"/><text x="170.0" y="109.0" font-size="11" font-weight="bold" fill="#63d39b" text-anchor="middle">O₂ + PtF₆ → O₂+[PtF₆]-</text><text x="170.0" y="129.0" font-size="8" font-weight="normal" fill="#93a1b5" text-anchor="middle">PtF₆ is a powerful enough oxidiser to ionise O₂</text><line x1="300.0" y1="115.0" x2="350.0" y2="115.0" stroke="#4db8e8" stroke-width="2" stroke-linecap="round"/><line x1="350.0" y1="115.0" x2="343.6" y2="112.1" stroke="#4db8e8" stroke-width="2" stroke-linecap="round"/><line x1="350.0" y1="115.0" x2="343.6" y2="117.9" stroke="#4db8e8" stroke-width="2" stroke-linecap="round"/><rect x="360" y="70" width="270" height="90" rx="8" fill="#0f1219" stroke="#6fb7dc" stroke-width="1.6"/><text x="495.0" y="109.0" font-size="11" font-weight="bold" fill="#f3b64b" text-anchor="middle">IE(O₂) = 1175 kJ/mol</text><text x="495.0" y="129.0" font-size="8" font-weight="normal" fill="#93a1b5" text-anchor="middle">almost identical to IE(Xe) = 1170 kJ/mol</text><line x1="225.0" y1="160.0" x2="225.0" y2="195.0" stroke="#4db8e8" stroke-width="2" stroke-linecap="round"/><line x1="225.0" y1="195.0" x2="227.9" y2="188.6" stroke="#4db8e8" stroke-width="2" stroke-linecap="round"/><line x1="225.0" y1="195.0" x2="222.1" y2="188.6" stroke="#4db8e8" stroke-width="2" stroke-linecap="round"/><rect x="95" y="205" width="340" height="80" rx="8" fill="#0f1219" stroke="#6fb7dc" stroke-width="1.6"/><text x="265.0" y="239.0" font-size="11" font-weight="bold" fill="#ff8f6e" text-anchor="middle">Xe + PtF₆ → Xe+[PtF₆]-</text><text x="265.0" y="259.0" font-size="8" font-weight="normal" fill="#93a1b5" text-anchor="middle">the first noble-gas compound — Xe could be oxidised the same way</text></g></svg>