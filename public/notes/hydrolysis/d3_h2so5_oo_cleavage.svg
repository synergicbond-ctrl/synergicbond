<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 480" width="1000" height="480"><rect x="0" y="0" width="1000" height="480" fill="#0a0c11"/><text x="500.0" y="22.0" text-anchor="middle" font-family='Inter,Arial,sans-serif' font-size="11.5" font-weight="800" fill="#7cc4ff" style="letter-spacing:1.6px;">GROUP 16 · PEROXOACIDS</text><text x="500.0" y="70.0" text-anchor="middle" font-family='Inter,Arial,sans-serif' font-size="22" font-weight="800" fill="#ffffff" style="">Caro's / Marshall's acid: attack at the O–O bond releases H₂O₂</text><text x="200.0" y="190.0" text-anchor="start" font-family='Inter,Arial,sans-serif' font-size="16" font-weight="600" fill="#ffffff" style="">–S(=O)₂–O–O–H</text><text x="60.0" y="130.0" text-anchor="middle" font-family='Inter,Arial,sans-serif' font-size="14" font-weight="600" fill="#ffffff" style="">H₂O</text><defs><marker id="ah261" markerWidth="8" markerHeight="8" refX="5" refY="3"
            orient="auto"><path d="M0,0 L6,3 L0,6 Z" fill="#7cc4ff"/></marker></defs><path d="M 95.0 145.0 Q 206.5 98.5 300.0 175.0" stroke="#7cc4ff" stroke-width="2.6" fill="none" marker-end="url(#ah261)"/><defs><marker id="ah45607" markerWidth="8" markerHeight="8" refX="5" refY="3"
            orient="auto"><path d="M0,0 L6,3 L0,6 Z" fill="#7cc4ff"/></marker></defs><path d="M 430.0 165.0 Q 445.0 238.5 520.0 240.0" stroke="#7cc4ff" stroke-width="2.6" fill="none" marker-end="url(#ah45607)"/><defs><marker id="sa16689" markerWidth="8" markerHeight="8" refX="5" refY="3"
            orient="auto"><path d="M0,0 L6,3 L0,6 Z" fill="#ffffff"/></marker></defs><line x1="560" y1="190" x2="700" y2="190" stroke="#ffffff" stroke-width="2.2" marker-end="url(#sa16689)"/><text x="730.0" y="190.0" text-anchor="start" font-family='Inter,Arial,sans-serif' font-size="15" font-weight="600" fill="#ffffff" style="">–S(=O)₂–OH + HO–OH</text><text x="500.0" y="340.0" text-anchor="middle" font-family='Inter,Arial,sans-serif' font-size="14" font-weight="400" fill="#9fb2c4" style="font-style:italic;">Water attacks the inner peroxide O; the weak O–O bond breaks heterolytically, both</text><text x="500.0" y="361.0" text-anchor="middle" font-family='Inter,Arial,sans-serif' font-size="14" font-weight="400" fill="#9fb2c4" style="font-style:italic;">electrons leaving with the outer O as part of H₂O₂. Caro's acid (H₂SO₅) gives H₂SO₄ + H₂O₂;</text><text x="500.0" y="382.0" text-anchor="middle" font-family='Inter,Arial,sans-serif' font-size="14" font-weight="400" fill="#9fb2c4" style="font-style:italic;">Marshall's acid (H₂S₂O₈, two –SO₃H linked by O–O) gives 2H₂SO₄ + H₂O₂ the same way.</text><text x="500.0" y="403.0" text-anchor="middle" font-family='Inter,Arial,sans-serif' font-size="14" font-weight="400" fill="#9fb2c4" style="font-style:italic;">Pyrosulfuric acid H₂S₂O₇ has an S–O–S bridge (no O–O) — ordinary bridge cleavage → 2H₂SO₄.</text></svg>