<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900"><defs>
  <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#030712"/><stop offset="0.55" stop-color="#071426"/><stop offset="1" stop-color="#120a24"/></linearGradient>
  <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0"><stop stop-color="#43e6ff"/><stop offset="0.5" stop-color="#9b8cff"/><stop offset="1" stop-color="#ffb65c"/></linearGradient>
  <filter id="glow"><feGaussianBlur stdDeviation="6" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
  <style>
    .title{font:800 44px Inter,Arial,sans-serif;fill:#f8fafc} .sub{font:400 22px Inter,Arial,sans-serif;fill:#b9c6d8}
    .h{font:750 26px Inter,Arial,sans-serif;fill:#69e7ff} .t{font:400 21px Inter,Arial,sans-serif;fill:#d8e1ee}
    .small{font:400 17px Inter,Arial,sans-serif;fill:#aebbd0} .tiny{font:400 15px Inter,Arial,sans-serif;fill:#8ba0b8}
    .gold{fill:#ffc866} .violet{fill:#b9a2ff} .cyan{fill:#62e8ff} .coral{fill:#ff9c7a} .green{fill:#7be6ab}
    .panel{fill:#07111f;stroke:#284563;stroke-width:2} .panel2{fill:#0d1023;stroke:#5f4a88;stroke-width:2}
    .line{stroke:#63e6ff;stroke-width:4;fill:none} .dash{stroke:#b69cff;stroke-width:4;stroke-dasharray:12 10;fill:none}
    .bond{stroke:#e8f1fb;stroke-width:5} .thin{stroke:#6f829a;stroke-width:2;fill:none}
  </style>
</defs>
<rect width="1600" height="900" fill="url(#bg)"/><rect x="44" y="34" width="1512" height="832" rx="34" fill="none" stroke="#17324d" stroke-width="2"/><text x="78" y="96" class="title">Industrial H₂O₂ — the Anthraquinone Cycle</text><rect x="78" y="118" width="430" height="5" rx="3" fill="url(#accent)"/><text x="78" y="158" class="sub">A catalytic cycle, not stoichiometric consumption of the carrier</text><rect x="78" y="240" width="350" height="140" rx="16" fill="#0d1023" stroke="#62e8ff" stroke-width="2"/><text x="102" y="290" class="h" style="fill:#62e8ff;font-size:22px">Alkyl anthraquinone</text><text x="102" y="326" class="small">organic carrier</text><rect x="450" y="240" width="350" height="140" rx="16" fill="#0d1023" stroke="#7be6ab" stroke-width="2"/><text x="474" y="290" class="h" style="fill:#7be6ab;font-size:22px">Hydrogenation</text><text x="474" y="326" class="small">H₂ / Pd catalyst → anthraquinol</text><rect x="822" y="240" width="350" height="140" rx="16" fill="#0d1023" stroke="#ffc866" stroke-width="2"/><text x="846" y="290" class="h" style="fill:#ffc866;font-size:22px">Oxidation</text><text x="846" y="326" class="small">air / O₂ regenerates the quinone</text><rect x="822" y="420" width="350" height="140" rx="16" fill="#0d1023" stroke="#ff9c7a" stroke-width="2"/><text x="846" y="470" class="h" style="fill:#ff9c7a;font-size:22px">H₂O₂ formed</text><text x="846" y="506" class="small">extracted into the water phase</text><rect x="450" y="420" width="350" height="140" rx="16" fill="#0d1023" stroke="#b9a2ff" stroke-width="2"/><text x="474" y="470" class="h" style="fill:#b9a2ff;font-size:22px">Separation</text><text x="474" y="506" class="small">extract and concentrate the H₂O₂</text><line x1="428" y1="310" x2="450" y2="310" stroke="#62e8ff" stroke-width="4"/><path d="M 450 310 L 438 317 L 438 303 Z" fill="#62e8ff"/><line x1="800" y1="310" x2="822" y2="310" stroke="#62e8ff" stroke-width="4"/><path d="M 822 310 L 810 317 L 810 303 Z" fill="#62e8ff"/><line x1="997" y1="380" x2="997" y2="420" stroke="#62e8ff" stroke-width="4"/><path d="M 997 420 L 990 408 L 1004 408 Z" fill="#62e8ff"/><line x1="822" y1="490" x2="800" y2="490" stroke="#62e8ff" stroke-width="4"/><path d="M 800 490 L 812 483 L 812 497 Z" fill="#62e8ff"/><path d="M 450 490 C 300 560 180 460 200 320" stroke="#7be6ab" stroke-width="3" fill="none" marker-end="url(#arh)"/><path d="M 200 320 l -10 -18 l 18 6 z" fill="#7be6ab"/><rect x="78" y="610" width="1460" height="100" rx="14" fill="#0a2630" stroke="#2aaec0"/><text x="100" y="666.0" class="small">The carrier is recycled indefinitely: hydrogenation → oxidation → extraction, then back to the start. Overall the process is simply H₂ + O₂ → H₂O₂, with the anthraquinone acting as an electron-transfer catalyst.</text></svg>