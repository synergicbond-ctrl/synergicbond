<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900" role="img" aria-labelledby="title desc">
<title id="title">Water: Geometry, Lone Pairs and Molecular Orbitals</title><desc id="desc">Why H₂O is bent, polar and exceptionally effective at hydrogen bonding</desc>
<defs>
  <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#030712"/><stop offset="0.55" stop-color="#071426"/><stop offset="1" stop-color="#120a24"/></linearGradient>
  <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0"><stop stop-color="#43e6ff"/><stop offset="0.5" stop-color="#9b8cff"/><stop offset="1" stop-color="#ffb65c"/></linearGradient>
  <filter id="glow"><feGaussianBlur stdDeviation="6" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
  <style>
    .title{font:800 52px Inter,Arial,sans-serif;fill:#f8fafc} .sub{font:400 24px Inter,Arial,sans-serif;fill:#b9c6d8}
    .h{font:750 28px Inter,Arial,sans-serif;fill:#69e7ff} .t{font:400 22px Inter,Arial,sans-serif;fill:#d8e1ee}
    .small{font:400 18px Inter,Arial,sans-serif;fill:#aebbd0} .gold{fill:#ffc866} .violet{fill:#b9a2ff} .cyan{fill:#62e8ff}
    .panel{fill:#07111f;stroke:#284563;stroke-width:2} .panel2{fill:#0d1023;stroke:#5f4a88;stroke-width:2}
    .line{stroke:#63e6ff;stroke-width:4;fill:none} .dash{stroke:#b69cff;stroke-width:4;stroke-dasharray:12 10;fill:none}
    .bond{stroke:#e8f1fb;stroke-width:5} .thin{stroke:#6f829a;stroke-width:2;fill:none}
  </style>
</defs>
<rect width="1600" height="900" fill="url(#bg)"/>
<rect x="44" y="34" width="1512" height="832" rx="34" fill="none" stroke="#17324d" stroke-width="2"/>
<text x="78" y="105" class="title">Water: Geometry, Lone Pairs and Molecular Orbitals</text>
<rect x="78" y="128" width="430" height="5" rx="3" fill="url(#accent)"/>
<text x="78" y="172" class="sub">Why H₂O is bent, polar and exceptionally effective at hydrogen bonding</text>

<rect x="78" y="220" width="700" height="540" rx="28" class="panel"/>
<text x="112" y="270" class="h">Bent molecular geometry</text>
<circle cx="420" cy="470" r="88" fill="#7a2632" stroke="#ff9a8b" stroke-width="4"/><text x="390" y="485" class="title" style="font-size:46px">O</text>
<circle cx="230" cy="620" r="48" fill="#d7dce5" stroke="#fff" stroke-width="3"/><circle cx="610" cy="620" r="48" fill="#d7dce5" stroke="#fff" stroke-width="3"/><text x="213" y="632" class="t" style="fill:#18212c">H</text><text x="593" y="632" class="t" style="fill:#18212c">H</text>
<line x1="350" y1="535" x2="270" y2="590" class="bond"/><line x1="490" y1="535" x2="570" y2="590" class="bond"/>
<path d="M330 590 A140 140 0 0 1 510 590" class="dash"/><text x="378" y="655" class="t violet">104.5°</text>
<ellipse cx="330" cy="365" rx="62" ry="30" fill="#563c87" stroke="#b9a2ff" stroke-width="3"/><ellipse cx="510" cy="365" rx="62" ry="30" fill="#563c87" stroke="#b9a2ff" stroke-width="3"/><text x="285" y="325" class="small">two lone pairs</text>
<rect x="815" y="220" width="707" height="540" rx="28" class="panel2"/>
<text x="852" y="270" class="h">Qualitative MO / symmetry picture</text>
<text x="870" y="320" class="t">O 2s, 2p orbitals combine with symmetry-adapted</text><text x="870" y="352" class="t">linear combinations of the two H 1s orbitals.</text>
<line x1="900" y1="560" x2="1040" y2="560" stroke="#62e8ff" stroke-width="6"/><text x="920" y="545" class="small">bonding MOs</text>
<line x1="1130" y1="470" x2="1270" y2="470" stroke="#b9a2ff" stroke-width="6"/><line x1="1130" y1="495" x2="1270" y2="495" stroke="#b9a2ff" stroke-width="6"/><text x="1160" y="455" class="small">lone-pair MOs</text>
<line x1="1325" y1="400" x2="1465" y2="400" stroke="#ffc866" stroke-width="6"/><text x="1330" y="385" class="small">antibonding MOs</text>
<rect x="865" y="615" width="610" height="90" rx="18" fill="#0a2630" stroke="#2aaec0"/><text x="895" y="650" class="small">Electron-pair repulsion and orbital mixing give a bent, polar molecule.</text><text x="895" y="680" class="small">The dipole moment and lone pairs enable extensive hydrogen bonding.</text>

</svg>